[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["server*"]
exclude = ["client*", "tests*"]

[project]
name = "latec-compare"
version = "1.0.0"
description = "Document comparison app — PDF diff + impact analysis + volume storage"
requires-python = ">=3.11"
dependencies = [
  "fastapi[standard]>=0.115.8",
  "mlflow[databricks]>=3.1",
  "python-dotenv>=1.0.1",
  "uvicorn>=0.34.0",
  "httpx>=0.28.0",
  "pydantic>=2.10.0",
  "requests>=2.32.0",
  "databricks-sdk>=0.88.0",
  "asyncpg>=0.29.0",
  "pymupdf>=1.25.0",
  "python-docx>=1.1.0",
  "python-pptx>=1.0.0",
  "mammoth>=1.6.0",
  "openpyxl>=3.1.0",
  "olefile>=0.47",
  "fasttext-wheel>=0.9.2",  # fast local language-ID pre-check for the chat translation bridge (server/data/lid.176.ftz)
  # Conflict resolution pins for Databricks Apps pre-installed packages
  "tenacity==9.0.0",
  "pillow==11.1.0",
  "websockets==15.0",
  "pyarrow==18.1.0",
  "markupsafe==3.0.2",
  "rich==14.0.0",
  "protobuf>=3.12.0,<5",
  "pandas==2.3.0",
  "flask==3.1.0",
  "werkzeug==3.1.3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "ipykernel>=6.29",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
prerelease = "allow"

[tool.ruff]
src = ["server"]
line-length = 100
indent-width = 2
fix = true
