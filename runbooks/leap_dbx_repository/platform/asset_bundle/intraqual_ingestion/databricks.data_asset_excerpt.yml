# Lines added to platform/asset_bundle/intraqual_ingestion/databricks.yml (excerpt, not the whole file).
variables:
  job_cluster_policy_id_M:
    description: "Cluster policy ID (taille M) pour le job cluster classique (Z_0 init)"
    default: "0005321E892BF7D2"  # dev
  job_cluster_policy_id_S:
    description: "Cluster policy id (S) du cluster du job data-asset D_2"
    default: "001E30C26BD479FE"  # dev
  data_asset_git_branch:
    description: "Branche Git utilisee par le job data-asset D_2 (tasks source GIT)"
    default: feature/intraqual_data_asset
  data_asset_reference_read_env:
    description: >
      Env des tables de reference lues par le job data-asset D_2 (headers_others).
      Toujours prod : les headers_intraqual_* sont portes par prod_bronze. Distinct de
      reference_read_env, qui sert de suffixe de bucket cote ingestion.
    default: prod
  aws_instance_profile_arn:
    description: "Instance profile ARN pour les job clusters classiques"
    default: "arn:aws:iam::512505875250:instance-profile/databricks-workspace-stack-access-data-buckets"  # dev

targets:
  dev:
    variables:
      my_dbx_service_principal: fde6ff28-739f-4a41-b61e-604a298c8478
      notification_email: patrice.puntis@latecoere.aero
      job_cluster_policy_id_M: 0005321E892BF7D2
      job_cluster_policy_id_S: 001E30C26BD479FE
      data_asset_git_branch: feature/intraqual_data_asset
      data_asset_reference_read_env: prod
