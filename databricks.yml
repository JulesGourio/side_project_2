# Databricks Asset Bundle (DABs) — QualiBOT
#
# Deploy via script: .\utils\deploy\deploy_qualibot.ps1 -AppEnv dev|uat|uat-test|prod

bundle:
  name: qualibot

include:
  - resources/*.yml

variables:
  app_name:
    default: "qualibot"
    description: "Unique name for the Databricks App"
  app_write_catalog:
    description: The write catalog
    default: dev_lab
  app_write_schema:
    description: The write schema
    default: lab_jules
  app_volume_name:
    description: "Name of the main storage volume"
    default: doc_compare
  app_proj_catalog:
    description: "Project catalog (UC experiments, traces, eval assets)"
    default: ${var.app_write_catalog}
  app_proj_schema:
    description: "Project schema inside app_proj_catalog"
    default: ${var.app_write_schema}

  # --- Parsing pipeline ---
  parsing_node_type:
    description: "(legacy) Node type for the parsing job cluster"
    default: "r6idn.2xlarge"
  parsing_gpu_node_type:
    description: "GPU node type for the Docling parse cluster (g4dn.4xlarge = T4 64Go)"
    default: "g4dn.4xlarge"
  parsing_describe_node_type:
    description: "Small CPU node for the LLM image-description task (I/O-bound)"
    default: "m5d.xlarge"
  parsing_num_workers:
    description: "Number of GPU workers for the parse cluster"
    default: "2"
  parsing_run_mode:
    description: "Parsing run mode: 'incremental' (new docs only) or 'full' (rebuild all)"
    default: "incremental"
  parsing_parse_filter:
    description: "Comma-separated IDDOC list to restrict a run to (empty = no filter, normal mode). Override via --var for a one-off targeted test run."
    default: ""
  parsing_table_suffix:
    description: "Suffix appended to every WRITE target table (checkpoint, chunks, image_metadata, processed_files, audit, retry/rag temp tables). Empty = real tables. Override via --var (e.g. '_test') for a one-off validation run that never touches production tables."
    default: ""
  intraqual_bronze_catalog_schema:
    description: >-
      catalog.schema of the Intraqual bronze materialized views (gd_*_latest) —
      the pipeline's real metadata source. prod_bronze became official on
      2026-07-27; dev_bronze had stopped refreshing on 2026-07-21.
    default: "prod_bronze.intraqual"
  intraqual_suffix:
    description: "Suffix for Intraqual tables (empty by default)"
    default: ""
  intraqual_volume_root:
    description: "Volume path containing the raw Intraqual D_XXXXX document folders"
    default: "/Volumes/prod_landingzone/intraqual/intraqual_documents"
  parsing_offline_models_path:
    description: >-
      Volume path to the offline Docling/embedding models. Per-environment —
      each workspace's compute can only reach volumes in its own metastore
      catalogs, never a different environment's (UAT cannot read dev_landingzone).
      DEV's volume has an extra nested docling_models/ subfolder that UAT's
      copy does not; the two paths are not the same suffix on a different catalog.
    default: "/Volumes/dev_landingzone/qualibot/docling_models/docling_models"
  parsing_max_source_staleness_hours:
    description: >-
      00b fails the run if an Intraqual source table hasn't been refreshed within
      this window. 0 disables the check (catch-up run on a stalled ingestion).
    default: "36"
  parsing_vector_search_indexes:
    description: >-
      Comma-separated Vector Search index names synced by task 5_sync_index.
      Empty = nothing to sync.
    default: ""
  parsing_archive_max_docs:
    description: >-
      Total number of pre-2018 documents allowed to be parsed into chunks_archive,
      most recent first (cumulative, not per run). 0 = none, -1 = all.
    default: "0"
  parsing_archive_notices_in_rag:
    description: >-
      "true" copies the metadata-only notice chunk of each pre-2018 document into
      chunks (chat index). "false" keeps them in
      chunks_archive_notices only.
    default: "false"
  parsing_build_chunks_full:
    description: >-
      "true" makes 5_sync_index refresh chunks_full (chunks + chunks_archive) even
      when chunks_full_index is not in parsing_vector_search_indexes.
    default: "false"
  parsing_lakebase_database:
    description: >-
      Lakebase database updated by task 6_update_kb_metadata with the daily
      run's documents_as_of/updated_at. Empty = skip.
    default: ""
  parsing_schedule_cron:
    description: "Quartz cron for the daily parsing run (Europe/Paris)"
    default: "0 0 4 * * ?"
  parsing_schedule_pause:
    description: "PAUSED | UNPAUSED for the daily parsing schedule"
    default: "PAUSED"
  parsing_job_activity_tag:
    description: >-
      activity-type tag value, matching the org-wide {env}-job convention
      used by other jobs in the shared UAT/PROD workspaces (see e.g.
      D_0_intraqual_documents_sync's activity-type=uat-job/prod-job tag).
    default: "dev-job"

sync:
  include:
    - "target_config.env"        # gitignored but must reach the workspace (per-env overrides)
  exclude:
    - "~$*"                      # Excel/Word lock files (Windows, file open in Office)
    - "client/src/**"            # frontend source — only built output (client/out) is needed
    - "client/public/**"         # source assets duplicated in client/out after build
    - "client/node_modules/**"
    - "docs/**"                  # documentation only (architecture.html alone is 3.5 MB) — never read at runtime
    - "archive/**"               # superseded code kept for reference (archive/README.md) — never deployed
    - ".git/**"
    - ".databricks/**"           # local CLI cache — contains 64MB+ terraform binaries
    - "__pycache__/**"
    - "**/*.pyc"
    - ".venv/**"
    - "**/*.ipynb"               # notebooks (debug_prompt.ipynb embeds base64 images — ~12MB)
    - "utils/dev/**"              # local debug/dev-only scripts (debug_prompt.py etc.), never deployed
    - "debug_results/**"
    - "files_to_compare/**"
    - "debug_images/**"
    - "Intraqual_files/**"
    - "intraqual_downloads/**"
    - "intraqual_extracted/**"
    - "intraqual_*.csv"
    - "intraqual_*.json"
    - "intraqual_*.jsonl"        # raw export — only server/data/doc_catalog.json ships
    - "utils/deploy/intraqual_*.csv"
    - "utils/deploy/.intraqual_profile/**"
    - "utils/deploy/download_intraqual.py"
    - "utils/deploy/scrap_ids_intraqual.py"
    - "utils/deploy/unzip_intraqual.py"
    - "utils/deploy/upload_intraqual.py"
    - "user_feedbacks/**"
    - "test_prompt/**"
    - "**/*.xlsx"
    - "**/*.xls"
    - "**/*.zip"

resources:
  apps:
    doc-compare:
      name: ${var.app_name}
      description: "QualiBOT — document comparison and chat"
      source_code_path: .
      # On-behalf-of-user OAuth: the app checks the visitor's group membership itself (server/services/user.py, active when CAPS_WAREHOUSE_ID is set).
      user_api_scopes:
        - sql
      permissions:
        - group_name: "Role-Project-LEAP-CoreAdmin"
          level: CAN_MANAGE
        - group_name: "Role-Project-LEAP-CoreDev"
          level: CAN_MANAGE
        - group_name: "Role-Project-LEAP-End-users-Qualibot-DocCompare"
          level: CAN_USE
        - group_name: "Role-Project-LEAP-End-users-Qualibot-ChatBot"
          level: CAN_USE

targets:
  # ---------------------------------------------------------------------------
  # DEV target: full copy of qualibot-uat in the DEV workspace (steps in operations_dev.md).
  # Own app, Lakebase project, Vector Search endpoint and dev_landingzone.qualibot tables, loaded from a UAT snapshot (copy_uat_to_dev).
  # Every new schedule is PAUSED. run_as is the DEV service principal: job-runner-sa-uat is UAT-scoped and silently ignored here.
  # The in-app group check is off for this target only: CAPS_BYPASS in utils/deploy/target_env.json.
  # ---------------------------------------------------------------------------
  dev:
    workspace:
      host: https://dbc-c623749d-731b.cloud.databricks.com
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
    resources:
      postgres_projects:
        qualibot-history:
          project_id: qualibot
          display_name: "Qualibot History"
          enable_pg_native_login: true
          default_endpoint_settings:
            autoscaling_limit_min_cu: 1
            autoscaling_limit_max_cu: 1
            suspend_timeout_duration: "300s"
          lifecycle:
            prevent_destroy: true
          permissions:
            - group_name: "Role-Project-LEAP-CoreAdmin"
              level: CAN_MANAGE
            - group_name: "Role-Project-LEAP-CoreDev"
              level: CAN_MANAGE
            - group_name: "leap-qualibot-service-accounts"
              level: CAN_MANAGE
            - service_principal_name: "fde6ff28-739f-4a41-b61e-604a298c8478"  # DEV job SP
              level: CAN_MANAGE
            # The deploying human must stay in this list: it is the full desired state, and a creator left out loses Can Manage on its own project.
            - user_name: "jules.gourio.external@latecoere.aero"
              level: CAN_MANAGE
            - user_name: "mehdi.lamrani@databricks.com"  # developer on the DEV copy
              level: CAN_MANAGE
            - group_name: "Role-Project-LEAP-End-users-Qualibot-DocCompare"
              level: CAN_USE
            - group_name: "Role-Project-LEAP-End-users-Qualibot-ChatBot"
              level: CAN_USE
      # The parent interpolates the project above so the roles wait for it on a first deploy.
      postgres_roles:
        qualibot-service-accounts:
          role_id: "leap-qualibot-service-accounts"
          parent: "projects/${resources.postgres_projects.qualibot-history.project_id}/branches/production"
          identity_type: GROUP
          postgres_role: "leap-qualibot-service-accounts"
          attributes:
            createdb: true
            createrole: false
            bypassrls: false
          membership_roles:
            - DATABRICKS_SUPERUSER
          replace_existing: true
        # The app connects to Lakebase as its own service principal, hardcoded: an interpolated value would force a recreate of this immutable role.
        # The DEV app predates the bundle and is bound to it.
        app-service-principal:
          role_id: "app-doc-compare-sp"
          parent: "projects/${resources.postgres_projects.qualibot-history.project_id}/branches/production"
          identity_type: SERVICE_PRINCIPAL
          postgres_role: "8e411164-a7e8-46ff-8013-8c56af2c3656"  # DEV qualibot app SP client id
          attributes:
            createdb: true
            createrole: false
            bypassrls: false
          membership_roles:
            - DATABRICKS_SUPERUSER
          replace_existing: true
          lifecycle:
            prevent_destroy: true
        # Writes knowledge_base_metadata (6_update_kb_metadata) and runs the Lakebase export and migrations.
        dev-job-service-principal:
          role_id: "dev-job-sp"
          parent: "projects/${resources.postgres_projects.qualibot-history.project_id}/branches/production"
          identity_type: SERVICE_PRINCIPAL
          postgres_role: "fde6ff28-739f-4a41-b61e-604a298c8478"
          attributes:
            createdb: false
            createrole: false
            bypassrls: false
          membership_roles:
            - DATABRICKS_SUPERUSER
          replace_existing: true
        # Direct SQL access to the DEV doccompare database for Mehdi (developer).
        mehdi:
          role_id: "mehdi-lamrani"
          parent: "projects/${resources.postgres_projects.qualibot-history.project_id}/branches/production"
          identity_type: USER
          postgres_role: "mehdi.lamrani@databricks.com"
          attributes:
            createdb: true
            createrole: false
            bypassrls: false
          membership_roles:
            - DATABRICKS_SUPERUSER
          replace_existing: true
        coredev:
          role_id: "coredev"
          parent: "projects/${resources.postgres_projects.qualibot-history.project_id}/branches/production"
          identity_type: GROUP
          postgres_role: "Role-Project-LEAP-CoreDev"
          attributes:
            createdb: false
            createrole: false
            bypassrls: false
          membership_roles:
            - DATABRICKS_SUPERUSER
          replace_existing: true
      # dev_landingzone.qualibot already exists: bind it before the first deploy (operations_dev.md, step "bind"), like any volume `databricks volumes list dev_landingzone qualibot` shows.
      schemas:
        qualibot_schema:
          catalog_name: ${var.app_write_catalog}
          name: ${var.app_write_schema}
        qualibot_proj_schema:
          catalog_name: ${var.app_proj_catalog}
          name: ${var.app_proj_schema}
      volumes:
        qualibot_doc_compare:
          catalog_name: ${var.app_write_catalog}
          schema_name: ${resources.schemas.qualibot_schema.name}
          name: doc_compare
          volume_type: MANAGED
        qualibot_test:
          catalog_name: ${var.app_write_catalog}
          schema_name: ${resources.schemas.qualibot_schema.name}
          name: test
          volume_type: MANAGED
        qualibot_images:
          catalog_name: ${var.app_write_catalog}
          schema_name: ${resources.schemas.qualibot_schema.name}
          name: images
          volume_type: MANAGED
        # Lakebase export of the DEV app (lakebase_export_dev_to_volume below).
        qualibot_staging:
          catalog_name: ${var.app_write_catalog}
          schema_name: ${resources.schemas.qualibot_schema.name}
          name: staging
          volume_type: MANAGED
      apps:
        doc-compare:
          # Mirrors the live ACL of the DEV app, without `users` CAN_MANAGE, plus the developer and the DEV job SP.
          permissions:
            - group_name: "Role-Project-LEAP-CoreAdmin"
              level: CAN_MANAGE
            - group_name: "Role-Project-LEAP-CoreDev"
              level: CAN_MANAGE
            - group_name: "Role-Project-LEAP-End-users-Qualibot-DocCompare"
              level: CAN_USE
            - group_name: "Role-Project-LEAP-End-users-Qualibot-ChatBot"
              level: CAN_USE
            - user_name: "jules.gourio.external@latecoere.aero"
              level: CAN_MANAGE
            # Developer on the DEV copy; must be a user of the DEV workspace.
            - user_name: "mehdi.lamrani@databricks.com"
              level: CAN_MANAGE
            - service_principal_name: "fde6ff28-739f-4a41-b61e-604a298c8478"  # DEV job SP (stop/start jobs)
              level: CAN_MANAGE
          # No UC volume binding on this target: it would grant USE CATALOG on dev_landingzone to the app SP, which a human deployer cannot do.
          # The SP gets its grants from the grant_app_access_dev job below.
      jobs:
        # ── Pre-existing DEV jobs, unchanged ────────────────────────────────
        # No run_as: they keep running as the deploying user. Both write UAT chat data to dev_landingzone.qualibot (Usage Tracking dashboard).
        lakebase_import_uat_to_dev:
          name: "D_1_Qualibot_Lakebase_Import_Uat_To_Dev"
          description: "Import the UAT staging volume export into DEV Delta tables"
          max_concurrent_runs: 1
          permissions:
            - group_name: "Role-Project-LEAP-CoreAdmin"
              level: CAN_MANAGE
            - group_name: "Role-Project-LEAP-CoreDev"
              level: CAN_MANAGE
            - service_principal_name: "fde6ff28-739f-4a41-b61e-604a298c8478"  # DEV job SP — lets the Bitbucket deploy (run as this SP) update jobs a human created
              level: CAN_MANAGE
            - user_name: "mehdi.lamrani@databricks.com"  # developer on the DEV copy
              level: CAN_MANAGE
          tasks:
            - task_key: import_lakebase_uat_volume
              notebook_task:
                notebook_path: ./utils/lakebase_sync/import_lakebase_uat_volume_to_dev_job.py
                source: WORKSPACE
              new_cluster:
                spark_version: "17.3.x-scala2.13"
                data_security_mode: SINGLE_USER   # without it the cluster has no Unity Catalog (see utils/parsing_pipeline/README.md#uc-not-enabled-single-user)
                node_type_id: "m5d.xlarge"
                num_workers: 0
                aws_attributes:
                  availability: ON_DEMAND
                spark_conf:
                  spark.databricks.cluster.profile: singleNode
                  spark.master: "local[*]"
                custom_tags:
                  ResourceClass: SingleNode
                spark_env_vars:
                  SOURCE_EXPORT_DIR: "/Volumes/uat_landingzone/qualibot/staging/lakebase_export"
                  TARGET_CATALOG: "dev_landingzone"
                  TARGET_SCHEMA: "qualibot"
                  TABLES_TO_SKIP: "llm_requests"
          schedule:
            quartz_cron_expression: "0 30 2,14 * * ?"
            timezone_id: "Europe/Paris"
            pause_status: UNPAUSED

        # Runs 15 min after each lakebase_import_uat_to_dev, once the chat_messages rows have landed.
        score_production_qa:
          name: "D_1_Qualibot_Score_Production_Qa"
          description: "LLM-judge quality scoring of real ChatBot turns already answered"
          max_concurrent_runs: 1
          permissions:
            - group_name: "Role-Project-LEAP-CoreAdmin"
              level: CAN_MANAGE
            - group_name: "Role-Project-LEAP-CoreDev"
              level: CAN_MANAGE
            - service_principal_name: "fde6ff28-739f-4a41-b61e-604a298c8478"  # DEV job SP — lets the Bitbucket deploy (run as this SP) update jobs a human created
              level: CAN_MANAGE
            - user_name: "mehdi.lamrani@databricks.com"  # developer on the DEV copy
              level: CAN_MANAGE
          tasks:
            - task_key: score_production_qa
              notebook_task:
                notebook_path: ./utils/evaluation/score_production_qa.py
                source: WORKSPACE
              environment_key: default
          environments:
            - environment_key: default
              spec:
                environment_version: "2"
                dependencies:
                  - mlflow[databricks]
          schedule:
            quartz_cron_expression: "0 45 2,14 * * ?"
            timezone_id: "Europe/Paris"
            pause_status: UNPAUSED

        # ── UAT copy ─────────────────────────────────────────────────────────
        # Manual trigger. Loads the snapshot written by export_uat_to_staging.py, then creates and syncs the Vector Search index:
        # the corpus is queryable without a parsing run, and parsing_pipeline resumes incrementally from the copied checkpoint.
        copy_uat_to_dev:
          name: "Z_1_Qualibot_Copy_Uat_To_Dev"
          description: "Load the UAT corpus snapshot (chunks + parsing state) into dev_landingzone.qualibot and build the Vector Search indexes. Manual trigger only."
          max_concurrent_runs: 1
          tags:
            project: Qualibot
          # Runs as the deploying user: the DEV SP has no READ VOLUME on uat_landingzone.qualibot.staging.
          # Explicit, because dropping run_as leaves the previous SP in place on redeploy.
          run_as:
            user_name: jules.gourio.external@latecoere.aero
          permissions:
            - group_name: "Role-Project-LEAP-CoreAdmin"
              level: CAN_MANAGE
            - group_name: "Role-Project-LEAP-CoreDev"
              level: CAN_MANAGE
            - service_principal_name: "fde6ff28-739f-4a41-b61e-604a298c8478"  # DEV job SP — lets the Bitbucket deploy (run as this SP) update jobs a human created
              level: CAN_MANAGE
            - user_name: "mehdi.lamrani@databricks.com"  # developer on the DEV copy
              level: CAN_MANAGE
          parameters:
            - name: overwrite
              default: "false"
          tasks:
            - task_key: "1_import_tables"
              description: "Staging volume snapshot -> dev_landingzone.qualibot.* (+ LibreOffice archive)"
              notebook_task:
                notebook_path: ./utils/dev_copy/import_staging_to_dev_job.py
                source: WORKSPACE
                base_parameters:
                  SOURCE_DIR: "/Volumes/uat_landingzone/qualibot/staging/dev_copy"
                  TARGET_CATALOG_SCHEMA: ${var.app_write_catalog}.${var.app_write_schema}
                  TABLE_SUFFIX: ${var.parsing_table_suffix}
                  OVERWRITE: "{{job.parameters.overwrite}}"
                  SOFFICE_TARGET_DIR: /Volumes/${var.app_write_catalog}/${var.app_write_schema}/doc_compare/libreoffice
              # Serverless: starts in seconds.
              environment_key: default
            - task_key: "2_vector_search_endpoint"
              description: "Create the Vector Search endpoint if missing, wait until ONLINE"
              depends_on:
                - task_key: "1_import_tables"
              notebook_task:
                notebook_path: ./utils/dev_copy/ensure_vector_search_endpoint.py
                source: WORKSPACE
                base_parameters:
                  vector_search_endpoint: "qualibot"
                  wait_minutes: "30"
              environment_key: default
            # Reuses the parsing pipeline's index task: creates the index if missing, then syncs it.
            - task_key: "3_sync_indexes"
              description: "Create + sync the chunks Vector Search index"
              depends_on:
                - task_key: "2_vector_search_endpoint"
              notebook_task:
                notebook_path: ./utils/parsing_pipeline/5_Sync_Vector_Indexes.py
                source: WORKSPACE
                base_parameters:
                  indexes: ${var.parsing_vector_search_indexes}
                  wait_minutes: "120"
                  vector_search_endpoint: "qualibot"
                  embedding_model: "databricks-qwen3-embedding-0-6b"
                  catalog_schema: ${var.app_write_catalog}.${var.app_write_schema}
                  table_suffix: ${var.parsing_table_suffix}
                  build_chunks_full: "false"
              environment_key: default
          environments:
            - environment_key: default
              spec:
                environment_version: "2"
                dependencies:
                  - databricks-sdk>=0.118.0

        # Manual trigger. Grants the DEV app SP what it uses (catalog and schema usage, volumes, indexes, serving endpoints),
        # and the DEV SP itself SELECT + MODIFY on `pipeline_tables`. Edit the lists in base_parameters, deploy, run;
        # re-run after recreating an index, a table or the app.
        grant_app_access_dev:
          name: "Z_1_Qualibot_Grant_App_Access_${bundle.target}"
          description: "Grant the DEV qualibot app SP its volumes, indexes and LLM endpoints, and the DEV job SP the pipeline tables. Manual trigger only."
          max_concurrent_runs: 1
          tags:
            project: Qualibot
          run_as:
            service_principal_name: fde6ff28-739f-4a41-b61e-604a298c8478
          permissions:
            - group_name: "Role-Project-LEAP-CoreAdmin"
              level: CAN_MANAGE
            - group_name: "Role-Project-LEAP-CoreDev"
              level: CAN_MANAGE
            - service_principal_name: "fde6ff28-739f-4a41-b61e-604a298c8478"  # DEV job SP — lets the Bitbucket deploy (run as this SP) update jobs a human created
              level: CAN_MANAGE
            - user_name: "mehdi.lamrani@databricks.com"  # developer on the DEV copy
              level: CAN_MANAGE
          parameters:
            - name: app_service_principal
              default: "8e411164-a7e8-46ff-8013-8c56af2c3656"
          tasks:
            - task_key: grant_app_access
              notebook_task:
                notebook_path: ./utils/grants/grant_app_access.py
                source: WORKSPACE
                base_parameters:
                  app_service_principal: "{{job.parameters.app_service_principal}}"
                  catalog: ${var.app_write_catalog}
                  schema_name: ${var.app_write_schema}
                  volumes: "doc_compare,test"
                  indexes: "chunks_index"
                  serving_endpoints: "databricks-claude-sonnet-4-6,databricks-gpt-5-6-luna,databricks-gpt-6-luna"
                  # The DEV SP itself (this job's run_as), on the tables a person created.
                  pipeline_service_principal: fde6ff28-739f-4a41-b61e-604a298c8478
                  pipeline_tables: "_pipeline_checkpoint,processed_files,image_metadata,parse_manifest,category_reference,chunks"
              environment_key: default
          environments:
            - environment_key: default
              spec:
                environment_version: "2"
                dependencies:
                  - databricks-sdk>=0.118.0

        # ── Same jobs as qualibot-uat, adapted to DEV ───────────────────────
        # Export only: the UAT twin also imports chat_* into Delta tables, which would overwrite the UAT chat data landed by lakebase_import_uat_to_dev.
        lakebase_export_dev_to_volume:
          name: "D_1_Qualibot_Lakebase_Export_To_Volume_${bundle.target}"
          description: "Export the DEV Lakebase tables to the dev_landingzone.qualibot.staging volume"
          max_concurrent_runs: 1
          tags:
            project: Qualibot
          permissions:
            - group_name: "Role-Project-LEAP-CoreAdmin"
              level: CAN_MANAGE
            - group_name: "Role-Project-LEAP-CoreDev"
              level: CAN_MANAGE
            - service_principal_name: "fde6ff28-739f-4a41-b61e-604a298c8478"  # DEV job SP — lets the Bitbucket deploy (run as this SP) update jobs a human created
              level: CAN_MANAGE
            - user_name: "mehdi.lamrani@databricks.com"  # developer on the DEV copy
              level: CAN_MANAGE
          run_as:
