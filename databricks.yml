# Databricks Asset Bundle (DABs) — QualiBOT
#
# Deploy via script: .\utils\deploy\deploy_qualibot.ps1 -AppEnv dev|uat|uat-test|prod

bundle:
  name: qualibot

# Jobs live in resources/*.job.yml (one file per concern, declared per target).
include:
  - resources/*.yml

variables:
  app_name:
    default: "qualibot"
    description: "Unique name for the Databricks App"
  app_write_catalog:
    description: The write catalog
    default: dev_lab
  app_write_schema:
    description: The write schema
    default: lab_jules
  app_volume_name:
    description: "Name of the main storage volume"
    default: doc_compare
  app_proj_catalog:
    description: "Project catalog (UC experiments, traces, eval assets)"
    default: ${var.app_write_catalog}
  app_proj_schema:
    description: "Project schema inside app_proj_catalog"
    default: ${var.app_write_schema}

  # --- Parsing pipeline ---
  parsing_node_type:
    description: "(legacy) Node type for the parsing job cluster"
    default: "r6idn.2xlarge"
  parsing_gpu_node_type:
    description: "GPU node type for the Docling parse cluster (g4dn.4xlarge = T4 64Go)"
    default: "g4dn.4xlarge"
  parsing_describe_node_type:
    description: "Small CPU node for the LLM image-description task (I/O-bound)"
    default: "m5d.xlarge"
  parsing_num_workers:
    description: "Number of GPU workers for the parse cluster"
    default: "2"
  parsing_run_mode:
    description: "Parsing run mode: 'incremental' (new docs only) or 'full' (rebuild all)"
    default: "incremental"
  parsing_parse_filter:
    description: "Comma-separated IDDOC list to restrict a run to (empty = no filter, normal mode). Override via --var for a one-off targeted test run."
    default: ""
  parsing_table_suffix:
    description: "Suffix appended to every WRITE target table (checkpoint, chunks, image_metadata, processed_files, audit, retry/rag temp tables). Empty = real tables. Override via --var (e.g. '_test') for a one-off validation run that never touches production tables."
    default: ""
  intraqual_bronze_catalog_schema:
    description: >-
      catalog.schema of the Intraqual bronze materialized views (gd_*_latest) —
      the pipeline's real metadata source. prod_bronze became official on
      2026-07-27; dev_bronze had stopped refreshing on 2026-07-21.
    default: "prod_bronze.intraqual"
  intraqual_suffix:
    description: "Suffix for Intraqual tables (empty by default)"
    default: ""
  intraqual_volume_root:
    description: "Volume path containing the raw Intraqual D_XXXXX document folders"
    default: "/Volumes/prod_landingzone/intraqual/intraqual_documents"
  parsing_offline_models_path:
    description: >-
      Volume path to the offline Docling/embedding models. Per-environment —
      each workspace's compute can only reach volumes in its own metastore
      catalogs, never a different environment's (UAT cannot read dev_landingzone).
      DEV's volume has an extra nested docling_models/ subfolder that UAT's
      copy does not; the two paths are not the same suffix on a different catalog.
    default: "/Volumes/dev_landingzone/qualibot/docling_models/docling_models"
  parsing_max_source_staleness_hours:
    description: >-
      00b fails the run if an Intraqual source table hasn't been refreshed within
      this window. 0 disables the check (catch-up run on a stalled ingestion).
    default: "36"
  parsing_vector_search_indexes:
    description: >-
      Comma-separated Vector Search index names synced by task 5_sync_index.
      Empty = nothing to sync.
    default: ""
  parsing_archive_max_docs:
    description: >-
      Total number of pre-2018 documents allowed to be parsed into chunks_archive,
      most recent first (cumulative, not per run). 0 = none, -1 = all.
    default: "0"
  parsing_archive_notices_in_rag:
    description: >-
      "true" copies the metadata-only notice chunk of each pre-2018 document into
      chunks (chat index). "false" keeps them in
      chunks_archive_notices only.
    default: "false"
  parsing_build_chunks_full:
    description: >-
      "true" makes 5_sync_index refresh chunks_full (chunks + chunks_archive) even
      when chunks_full_index is not in parsing_vector_search_indexes.
    default: "false"
  parsing_lakebase_database:
    description: >-
      Lakebase database updated by task 6_update_kb_metadata with the daily
      run's documents_as_of/updated_at. Empty = skip.
    default: ""
  parsing_schedule_cron:
    description: "Quartz cron for the daily parsing run (Europe/Paris)"
    default: "0 0 4 * * ?"
  parsing_schedule_pause:
    description: "PAUSED | UNPAUSED for the daily parsing schedule"
    default: "PAUSED"
  parsing_job_activity_tag:
    description: >-
      activity-type tag value, matching the org-wide {env}-job convention
      used by other jobs in the shared UAT/PROD workspaces (see e.g.
      D_0_intraqual_documents_sync's activity-type=uat-job/prod-job tag).
    default: "dev-job"

sync:
  include:
    - "target_config.env"        # gitignored but must reach the workspace (per-env overrides)
  exclude:
    - "~$*"                      # Excel/Word lock files (Windows, file open in Office)
    - "client/src/**"            # frontend source — only built output (client/out) is needed
    - "client/public/**"         # source assets duplicated in client/out after build
    - "client/node_modules/**"
    - "docs/**"                  # documentation only (architecture.html alone is 3.5 MB) — never read at runtime
    - "archive/**"               # superseded code kept for reference (archive/README.md) — never deployed
    - ".git/**"
    - ".databricks/**"           # local CLI cache — contains 64MB+ terraform binaries
    - "__pycache__/**"
    - "**/*.pyc"
    - ".venv/**"
    - "**/*.ipynb"               # notebooks (debug_prompt.ipynb embeds base64 images — ~12MB)
    - "utils/dev/**"              # local debug/dev-only scripts (debug_prompt.py etc.), never deployed
    - "debug_results/**"
    - "files_to_compare/**"
    - "debug_images/**"
    - "Intraqual_files/**"
    - "intraqual_downloads/**"
    - "intraqual_extracted/**"
    - "intraqual_*.csv"
    - "intraqual_*.json"
    - "intraqual_*.jsonl"        # raw export — only server/data/doc_catalog.json ships
    - "utils/deploy/intraqual_*.csv"
    - "utils/deploy/.intraqual_profile/**"
    - "utils/deploy/download_intraqual.py"
    - "utils/deploy/scrap_ids_intraqual.py"
    - "utils/deploy/unzip_intraqual.py"
    - "utils/deploy/upload_intraqual.py"
    - "user_feedbacks/**"
    - "test_prompt/**"
    - "**/*.xlsx"
    - "**/*.xls"
    - "**/*.zip"

resources:
  apps:
    doc-compare:
      name: ${var.app_name}
      description: "QualiBOT — document comparison and chat"
      source_code_path: .
      # On-behalf-of-user OAuth: the app checks the visitor's group membership itself (server/services/user.py, active when CAPS_WAREHOUSE_ID is set).
      user_api_scopes:
        - sql
      permissions:
        - group_name: "Role-Project-LEAP-CoreAdmin"
          level: CAN_MANAGE
        - group_name: "Role-Project-LEAP-CoreDev"
          level: CAN_MANAGE
        - group_name: "Role-Project-LEAP-End-users-Qualibot-DocCompare"
          level: CAN_USE
        - group_name: "Role-Project-LEAP-End-users-Qualibot-ChatBot"
          level: CAN_USE

targets:
  # ---------------------------------------------------------------------------
  # DEV target: full copy of qualibot-uat in the DEV workspace (steps in operations_dev.md).
  # Own app, Lakebase project, Vector Search endpoint and dev_landingzone.qualibot tables, loaded from a UAT snapshot (copy_uat_to_dev).
  # Every new schedule is PAUSED. run_as is the DEV service principal: job-runner-sa-uat is UAT-scoped and silently ignored here.
  # The in-app group check is off for this target only: CAPS_BYPASS in utils/deploy/target_env.json.
  # ---------------------------------------------------------------------------
  dev:
    workspace:
      host: https://dbc-c623749d-731b.cloud.databricks.com
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
    resources:
      postgres_projects:
        qualibot-history:
          project_id: qualibot
          display_name: "Qualibot History"
          enable_pg_native_login: true
          default_endpoint_settings:
            autoscaling_limit_min_cu: 1
            autoscaling_limit_max_cu: 1
            suspend_timeout_duration: "300s"
          lifecycle:
            prevent_destroy: true
          permissions:
            - group_name: "Role-Project-LEAP-CoreAdmin"
              level: CAN_MANAGE
            - group_name: "Role-Project-LEAP-CoreDev"
              level: CAN_MANAGE
            - group_name: "leap-qualibot-service-accounts"
              level: CAN_MANAGE
            - service_principal_name: "fde6ff28-739f-4a41-b61e-604a298c8478"  # DEV job SP
              level: CAN_MANAGE
            # The deploying human must stay in this list: it is the full desired state, and a creator left out loses Can Manage on its own project.
            - user_name: "jules.gourio.external@latecoere.aero"
              level: CAN_MANAGE
            - user_name: "mehdi.lamrani@databricks.com"  # developer on the DEV copy
              level: CAN_MANAGE
            - group_name: "Role-Project-LEAP-End-users-Qualibot-DocCompare"
              level: CAN_USE
            - group_name: "Role-Project-LEAP-End-users-Qualibot-ChatBot"
              level: CAN_USE
      # The parent interpolates the project above so the roles wait for it on a first deploy.
      postgres_roles:
        qualibot-service-accounts:
          role_id: "leap-qualibot-service-accounts"
          parent: "projects/${resources.postgres_projects.qualibot-history.project_id}/branches/production"
          identity_type: GROUP
          postgres_role: "leap-qualibot-service-accounts"
          attributes:
            createdb: true
            createrole: false
            bypassrls: false
          membership_roles:
            - DATABRICKS_SUPERUSER
          replace_existing: true
        # The app connects to Lakebase as its own service principal, hardcoded: an interpolated value would force a recreate of this immutable role.
        # The DEV app predates the bundle and is bound to it.
        app-service-principal:
          role_id: "app-doc-compare-sp"
          parent: "projects/${resources.postgres_projects.qualibot-history.project_id}/branches/production"
          identity_type: SERVICE_PRINCIPAL
          postgres_role: "8e411164-a7e8-46ff-8013-8c56af2c3656"  # DEV qualibot app SP client id
          attributes:
            createdb: true
            createrole: false
            bypassrls: false
          membership_roles:
            - DATABRICKS_SUPERUSER
          replace_existing: true
          lifecycle:
            prevent_destroy: true
        # Writes knowledge_base_metadata (6_update_kb_metadata) and runs the Lakebase export and migrations.
        dev-job-service-principal:
          role_id: "dev-job-sp"
          parent: "projects/${resources.postgres_projects.qualibot-history.project_id}/branches/production"
          identity_type: SERVICE_PRINCIPAL
          postgres_role: "fde6ff28-739f-4a41-b61e-604a298c8478"
          attributes:
            createdb: false
            createrole: false
            bypassrls: false
          membership_roles:
            - DATABRICKS_SUPERUSER
          replace_existing: true
        # Direct SQL access to the DEV doccompare database for Mehdi (developer).
        mehdi:
          role_id: "mehdi-lamrani"
          parent: "projects/${resources.postgres_projects.qualibot-history.project_id}/branches/production"
          identity_type: USER
          postgres_role: "mehdi.lamrani@databricks.com"
          attributes:
            createdb: true
            createrole: false
            bypassrls: false
          membership_roles:
            - DATABRICKS_SUPERUSER
          replace_existing: true
        coredev:
          role_id: "coredev"
          parent: "projects/${resources.postgres_projects.qualibot-history.project_id}/branches/production"
          identity_type: GROUP
          postgres_role: "Role-Project-LEAP-CoreDev"
          attributes:
            createdb: false
            createrole: false
            bypassrls: false
          membership_roles:
            - DATABRICKS_SUPERUSER
          replace_existing: true
      # dev_landingzone.qualibot already exists: bind it before the first deploy (operations_dev.md, step "bind"), like any volume `databricks volumes list dev_landingzone qualibot` shows.
      schemas:
        qualibot_schema:
          catalog_name: ${var.app_write_catalog}
          name: ${var.app_write_schema}
        qualibot_proj_schema:
          catalog_name: ${var.app_proj_catalog}
          name: ${var.app_proj_schema}
      volumes:
        qualibot_doc_compare:
          catalog_name: ${var.app_write_catalog}
          schema_name: ${resources.schemas.qualibot_schema.name}
          name: doc_compare
          volume_type: MANAGED
        qualibot_test:
          catalog_name: ${var.app_write_catalog}
          schema_name: ${resources.schemas.qualibot_schema.name}
          name: test
          volume_type: MANAGED
        qualibot_images:
          catalog_name: ${var.app_write_catalog}
          schema_name: ${resources.schemas.qualibot_schema.name}
          name: images
          volume_type: MANAGED
        # Lakebase export of the DEV app (lakebase_export_dev_to_volume below).
        qualibot_staging:
          catalog_name: ${var.app_write_catalog}
          schema_name: ${resources.schemas.qualibot_schema.name}
          name: staging
          volume_type: MANAGED
      apps:
        doc-compare:
          # Mirrors the live ACL of the DEV app, without `users` CAN_MANAGE, plus the developer and the DEV job SP.
          permissions:
            - group_name: "Role-Project-LEAP-CoreAdmin"
              level: CAN_MANAGE
            - group_name: "Role-Project-LEAP-CoreDev"
              level: CAN_MANAGE
            - group_name: "Role-Project-LEAP-End-users-Qualibot-DocCompare"
              level: CAN_USE
            - group_name: "Role-Project-LEAP-End-users-Qualibot-ChatBot"
              level: CAN_USE
            - user_name: "jules.gourio.external@latecoere.aero"
              level: CAN_MANAGE
            # Developer on the DEV copy; must be a user of the DEV workspace.
            - user_name: "mehdi.lamrani@databricks.com"
              level: CAN_MANAGE
            - service_principal_name: "fde6ff28-739f-4a41-b61e-604a298c8478"  # DEV job SP (stop/start jobs)
              level: CAN_MANAGE
          # No UC volume binding on this target: it would grant USE CATALOG on dev_landingzone to the app SP, which a human deployer cannot do.
          # The SP gets its grants from the grant_app_access_dev job below.
    variables:
      app_name: "qualibot"
      app_write_catalog: dev_landingzone
      app_write_schema: qualibot
      app_volume_name: doc_compare
      app_proj_catalog: dev_proj
      app_proj_schema: qualibot
      parsing_node_type: "r6idn.4xlarge"
      parsing_num_workers: "4"
      parsing_run_mode: "incremental"
      # Same prod sources as UAT.
      intraqual_bronze_catalog_schema: "prod_bronze.intraqual"
      intraqual_volume_root: "/Volumes/prod_landingzone/intraqual/intraqual_documents"
      # DEV's own volume (nested docling_models/ subfolder, unlike UAT's).
      parsing_offline_models_path: "/Volumes/dev_landingzone/qualibot/docling_models/docling_models"
      # Real tables, no suffix. One index serves the chat (division filter) and impact search.
      parsing_table_suffix: ""
      parsing_vector_search_indexes: "dev_landingzone.qualibot.chunks_index"
      # PAUSED on purpose — unpause only on explicit decision.
      parsing_schedule_pause: "PAUSED"
      parsing_lakebase_database: "doccompare"
      parsing_job_activity_tag: "dev-job"
      # Pre-2018 archive test phase: not carried over to DEV.
      parsing_archive_max_docs: "0"
      parsing_archive_notices_in_rag: "false"
      parsing_build_chunks_full: "false"

  qualibot-uat:
    default: true
    workspace:
      host: https://dbc-3a17bfce-9e88.cloud.databricks.com
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
    resources:
      postgres_projects:
        qualibot-history:
          project_id: qualibot
          display_name: "Qualibot History"
          # Native Postgres login in addition to Databricks OAuth tokens.
          enable_pg_native_login: true
          default_endpoint_settings:
            # Fixed 1 CU (~2 GB RAM) — no autoscaling (min = max).
            autoscaling_limit_min_cu: 1
            autoscaling_limit_max_cu: 1
            # Scale-to-zero: suspend the compute endpoint after 5 min idle.
            suspend_timeout_duration: "300s"
          lifecycle:
            prevent_destroy: true
          # Full desired state: grants made in the UI and not listed here are removed on the next deploy.
          permissions:
            - group_name: "Role-Project-LEAP-CoreAdmin"
              level: CAN_MANAGE
            - group_name: "Role-Project-LEAP-CoreDev"
              level: CAN_MANAGE
            - group_name: "leap-qualibot-service-accounts"
              level: CAN_MANAGE
            # Also needed for bundle deploy to read this project's permissions as job-runner-sa-uat (group membership alone was not enough).
            - service_principal_name: "3e5cd4e5-f765-4760-b974-ee7715258b39"  # job-runner-sa-uat
              level: CAN_MANAGE
            - group_name: "Role-Project-LEAP-End-users-Qualibot-DocCompare"
              level: CAN_USE
            - group_name: "Role-Project-LEAP-End-users-Qualibot-ChatBot"
              level: CAN_USE
      # Database-level Postgres role: map the Databricks group to a Lakebase
      # role and grant it DATABRICKS_SUPERUSER on the `production` branch.
      postgres_roles:
        qualibot-service-accounts:
          role_id: "leap-qualibot-service-accounts"
          parent: "projects/qualibot/branches/production"
          identity_type: GROUP
          postgres_role: "leap-qualibot-service-accounts"
          attributes:
            # All three attributes are required: the API rejects a partial `attributes` object.
            createdb: true
            createrole: false
            bypassrls: false
          membership_roles:
            - DATABRICKS_SUPERUSER
          # Adopt the role if it already exists on the branch instead of failing.
          replace_existing: true
        # The app connects as its own service principal: grant it its own role.
        # postgres_role is hardcoded: an interpolated app SP id is unknown after apply, which would recreate this immutable role on unrelated app changes.
        # Update it only if the app is recreated with a new SP (`databricks apps get qualibot`); prevent_destroy is the second safeguard.
        app-service-principal:
          # role_id is a Databricks resource identifier (RFC1123, starts with a letter), not the SP UUID; the SP identity is postgres_role.
          role_id: "app-doc-compare-sp"
          parent: "projects/qualibot/branches/production"
          identity_type: SERVICE_PRINCIPAL
          postgres_role: "ed8abb86-e0db-423b-8f35-5cda58e89b80"  # qualibot-uat app SP client id
          attributes:
            createdb: true
            createrole: false
            bypassrls: false
          membership_roles:
            - DATABRICKS_SUPERUSER
          replace_existing: true
          lifecycle:
            prevent_destroy: true
        # CoreDev group: full access through DATABRICKS_SUPERUSER membership.
        coredev:
          role_id: "coredev"
          parent: "projects/qualibot/branches/production"
          identity_type: GROUP
          postgres_role: "Role-Project-LEAP-CoreDev"
          attributes:
            createdb: false
            createrole: false
            bypassrls: false
          membership_roles:
            - DATABRICKS_SUPERUSER
          replace_existing: true
      schemas:
        qualibot_schema:
          catalog_name: ${var.app_write_catalog}
          name: ${var.app_write_schema}
        qualibot_proj_schema:
          catalog_name: ${var.app_proj_catalog}
          name: ${var.app_proj_schema}
      volumes:
        qualibot_doc_compare:
          catalog_name: ${var.app_write_catalog}
          schema_name: ${resources.schemas.qualibot_schema.name}
          name: doc_compare
          volume_type: MANAGED
        qualibot_test:
          catalog_name: ${var.app_write_catalog}
          schema_name: ${resources.schemas.qualibot_schema.name}
          name: test
          volume_type: MANAGED
        # Written by the 3_parse task (PARSING_VOLUME_BASE_PATH). It already exists: bind it
        # (`databricks bundle deployment bind qualibot_images uat_landingzone.qualibot.images -t qualibot-uat`), or the first deploy tries to create it.
        qualibot_images:
          catalog_name: ${var.app_write_catalog}
          schema_name: ${resources.schemas.qualibot_schema.name}
          name: images
          volume_type: MANAGED
      apps:
        doc-compare:
          # Declared explicitly: once present, this block is the full desired state, so a deploy cannot reset the live ACL silently.
          permissions:
            - group_name: "Role-Project-LEAP-CoreAdmin"
              level: CAN_MANAGE
            - group_name: "Role-Project-LEAP-CoreDev"
              level: CAN_MANAGE
            - group_name: "Role-Project-LEAP-End-users-Qualibot-DocCompare"
              level: CAN_USE
            - group_name: "Role-Project-LEAP-End-users-Qualibot-ChatBot"
              level: CAN_USE
            - user_name: "jules.gourio.external@latecoere.aero"
              level: CAN_MANAGE
            - user_name: "christophe.pelissier@latecoere.aero"
              level: CAN_USE
            - user_name: "yosif.karapendov@latecoere.aero"
              level: CAN_USE
            - service_principal_name: "3e5cd4e5-f765-4760-b974-ee7715258b39"  # job-runner-sa-uat
              level: CAN_MANAGE
          resources:
            - name: doc-compare-volume
              uc_securable:
                securable_type: VOLUME
                securable_full_name: uat_landingzone.qualibot.doc_compare
                permission: WRITE_VOLUME
            - name: test-volume
              uc_securable:
                securable_type: VOLUME
                securable_full_name: uat_landingzone.qualibot.test
                permission: WRITE_VOLUME
    variables:
      app_name: "qualibot"
      app_write_catalog: uat_landingzone
      app_write_schema: qualibot
      app_volume_name: doc_compare
      app_proj_catalog: uat_proj
      app_proj_schema: qualibot
      parsing_node_type: "r6idn.4xlarge"
      parsing_num_workers: "4"
      parsing_run_mode: "incremental"
      # Prod sources (refreshed daily), not uat_*: the UAT workspace reads prod_bronze through the shared metastore.
      intraqual_bronze_catalog_schema: "prod_bronze.intraqual"
      intraqual_volume_root: "/Volumes/prod_landingzone/intraqual/intraqual_documents"
      # UAT's own docling_models volume copy (no nested docling_models/ subfolder, unlike DEV).
      parsing_offline_models_path: "/Volumes/uat_landingzone/qualibot/docling_models"
      # Real tables, no suffix: copy the former _v1 state tables to these names (OPERATIONS.md D5.3) BEFORE the next deploy,
      # or the daily run reparses the whole corpus on GPU. One index serves the chat and impact search.
      parsing_table_suffix: ""
      parsing_vector_search_indexes: "uat_landingzone.qualibot.chunks_index"
      # chunks_full is built but its index is not: append uat_landingzone.qualibot.chunks_full_index above to create and sync it.
      parsing_build_chunks_full: "true"
      parsing_schedule_pause: "UNPAUSED"
      # Same Lakebase database the deployed qualibot-uat app itself reads/writes
      # (LAKEBASE_DATABASE in app.yaml / target_config.env) — never doccompare_test.
      parsing_lakebase_database: "doccompare"
      parsing_job_activity_tag: "uat-job"

  # Disposable test target: evaluates the chat without touching the real qualibot-uat app or its Lakebase data (own terraform state).
  # It does not declare postgres_projects/schemas/volumes (they exist, and this identity cannot grant on them).
  # No UC volume binding, so compare is disabled; Lakebase history stays off unless an admin grants the app SP access.
  # Remove this target once the evaluation is done.
  qualibot-uat-test:
    workspace:
      host: https://dbc-3a17bfce-9e88.cloud.databricks.com
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
    variables:
      app_name: "qualibot-uat-test"
      app_write_catalog: uat_landingzone
      app_write_schema: qualibot
      app_volume_name: doc_compare
      parsing_node_type: "r6idn.4xlarge"
      parsing_num_workers: "4"
      parsing_run_mode: "incremental"
      # Disposable target: `*_test` tables and no synced index, same as
      # qualibot-uat until the chain is validated.
      parsing_table_suffix: "_test"
      parsing_vector_search_indexes: ""
      parsing_schedule_pause: "PAUSED"
      intraqual_bronze_catalog_schema: "prod_bronze.intraqual"
      intraqual_volume_root: "/Volumes/prod_landingzone/intraqual/intraqual_documents"

  qualibot-prod:
    mode: production
    workspace:
      host: https://dbc-77b87d5a-6bcb.cloud.databricks.com
      root_path: /Workspace/.bundle/${bundle.name}/${bundle.target}
    resources:
      postgres_projects:
        qualibot-history:
          project_id: qualibot
          display_name: "Qualibot History"
          # Native Postgres login in addition to Databricks OAuth tokens.
          enable_pg_native_login: true
          default_endpoint_settings:
            # Fixed 1 CU (~2 GB RAM) — no autoscaling (min = max).
            autoscaling_limit_min_cu: 1
            autoscaling_limit_max_cu: 1
            # Scale-to-zero: suspend the compute endpoint after 5 min idle.
            suspend_timeout_duration: "300s"
          lifecycle:
            prevent_destroy: true
          # Full desired state: grants made in the UI and not listed here are removed on the next deploy.
          permissions:
            - group_name: "Role-Project-LEAP-CoreAdmin"
              level: CAN_MANAGE
            - group_name: "Role-Project-LEAP-CoreDev"
              level: CAN_MANAGE
            - group_name: "leap-qualibot-service-accounts"
              level: CAN_MANAGE
            - group_name: "Role-Project-LEAP-End-users-Qualibot-DocCompare"
              level: CAN_USE
            - group_name: "Role-Project-LEAP-End-users-Qualibot-ChatBot"
              level: CAN_USE
      # Database-level Postgres role: map the Databricks group to a Lakebase
      # role and grant it DATABRICKS_SUPERUSER on the `production` branch.
      postgres_roles:
        qualibot-service-accounts:
          role_id: "leap-qualibot-service-accounts"
          parent: "projects/qualibot/branches/production"
          identity_type: GROUP
          postgres_role: "leap-qualibot-service-accounts"
          attributes:
            # All three attributes are required: the API rejects a partial `attributes` object.
            createdb: true
            createrole: false
            bypassrls: false
          membership_roles:
            - DATABRICKS_SUPERUSER
          # Adopt the role if it already exists on the branch instead of failing.
          replace_existing: true
        # The app connects as its own service principal: grant it its own role. The SP client id is referenced from the app resource, so it is right per environment.
        app-service-principal:
          # role_id is a Databricks resource identifier (RFC1123, starts with a letter), not the SP UUID; the SP identity is postgres_role.
          role_id: "app-doc-compare-sp"
          parent: "projects/qualibot/branches/production"
          identity_type: SERVICE_PRINCIPAL
          postgres_role: ${resources.apps.doc-compare.service_principal_client_id}
          attributes:
            createdb: true
            createrole: false
            bypassrls: false
          membership_roles:
            - DATABRICKS_SUPERUSER
          replace_existing: true
        # CoreDev group: full access through DATABRICKS_SUPERUSER membership.
        coredev:
          role_id: "coredev"
          parent: "projects/qualibot/branches/production"
          identity_type: GROUP
          postgres_role: "Role-Project-LEAP-CoreDev"
          attributes:
            createdb: false
            createrole: false
            bypassrls: false
          membership_roles:
            - DATABRICKS_SUPERUSER
          replace_existing: true
      schemas:
        qualibot_schema:
          catalog_name: ${var.app_write_catalog}
          name: ${var.app_write_schema}
      volumes:
        qualibot_doc_compare:
          catalog_name: ${var.app_write_catalog}
          schema_name: ${resources.schemas.qualibot_schema.name}
          name: doc_compare
          volume_type: MANAGED
        qualibot_docling_models:
          catalog_name: ${var.app_write_catalog}
          schema_name: ${resources.schemas.qualibot_schema.name}
          name: docling_models
          volume_type: MANAGED
        qualibot_test:
          catalog_name: ${var.app_write_catalog}
          schema_name: ${resources.schemas.qualibot_schema.name}
          name: test
          volume_type: MANAGED
        # Written by the 3_parse task (PARSING_VOLUME_BASE_PATH). Check `databricks volumes list prod_landingzone qualibot` before deploying: bind it if it exists.
        qualibot_images:
          catalog_name: ${var.app_write_catalog}
          schema_name: ${resources.schemas.qualibot_schema.name}
          name: images
          volume_type: MANAGED
      apps:
        doc-compare:
          resources:
            - name: doc-compare-volume
              uc_securable:
                securable_type: VOLUME
                securable_full_name: prod_landingzone.qualibot.doc_compare
                permission: WRITE_VOLUME
            - name: test-volume
              uc_securable:
                securable_type: VOLUME
                securable_full_name: prod_landingzone.qualibot.test
                permission: WRITE_VOLUME
    variables:
      app_name: "qualibot"
      app_write_catalog: prod_landingzone
      app_write_schema: qualibot
      app_volume_name: doc_compare
      parsing_node_type: "r6idn.4xlarge"
      parsing_num_workers: "8"
      parsing_run_mode: "incremental"
      intraqual_bronze_catalog_schema: "prod_bronze.intraqual"
      intraqual_volume_root: "/Volumes/prod_landingzone/intraqual/intraqual_documents"
      parsing_job_activity_tag: "prod-job"
      parsing_offline_models_path: "/Volumes/prod_landingzone/qualibot/docling_models"
      # Same Lakebase database the deployed qualibot-prod app reads and writes (LAKEBASE_DATABASE in app.yaml).
      parsing_lakebase_database: "doccompare"
      # 5_sync_index creates the index on its first run if it does not exist.
      parsing_vector_search_indexes: "prod_landingzone.qualibot.chunks_index"
