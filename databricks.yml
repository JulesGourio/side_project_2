    variables:
      app_name: "qualibot"
      app_write_catalog: dev_landingzone
      app_write_schema: qualibot
      app_volume_name: doc_compare
      app_proj_catalog: dev_proj
      app_proj_schema: qualibot
      parsing_node_type: "r6idn.4xlarge"
      parsing_num_workers: "4"
      parsing_run_mode: "incremental"
      # Same prod sources as UAT.
      intraqual_bronze_catalog_schema: "prod_bronze.intraqual"
      intraqual_volume_root: "/Volumes/prod_landingzone/intraqual/intraqual_documents"
      # DEV's own volume (nested docling_models/ subfolder, unlike UAT's).
      parsing_offline_models_path: "/Volumes/dev_landingzone/qualibot/docling_models/docling_models"
      # Real tables, no suffix. One index serves the chat (division filter) and impact search.
      parsing_table_suffix: ""
      parsing_vector_search_indexes: "dev_landingzone.qualibot.chunks_index"
      # PAUSED on purpose — unpause only on explicit decision.
      parsing_schedule_pause: "PAUSED"
      parsing_lakebase_database: "doccompare"
      parsing_job_activity_tag: "dev-job"
      # Pre-2018 archive test phase: not carried over to DEV.
      parsing_archive_max_docs: "0"
      parsing_archive_notices_in_rag: "false"
      parsing_build_chunks_full: "false"

  qualibot-uat:
    default: true
    workspace:
      host: https://dbc-3a17bfce-9e88.cloud.databricks.com
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
    resources:
      postgres_projects:
        qualibot-history:
          project_id: qualibot
          display_name: "Qualibot History"
          # Native Postgres login in addition to Databricks OAuth tokens.
          enable_pg_native_login: true
          default_endpoint_settings:
            # Fixed 1 CU (~2 GB RAM) — no autoscaling (min = max).
            autoscaling_limit_min_cu: 1
            autoscaling_limit_max_cu: 1
            # Scale-to-zero: suspend the compute endpoint after 5 min idle.
            suspend_timeout_duration: "300s"
          lifecycle:
            prevent_destroy: true
          # Full desired state: grants made in the UI and not listed here are removed on the next deploy.
          permissions:
            - group_name: "Role-Project-LEAP-CoreAdmin"
              level: CAN_MANAGE
            - group_name: "Role-Project-LEAP-CoreDev"
              level: CAN_MANAGE
            - group_name: "leap-qualibot-service-accounts"
              level: CAN_MANAGE
            # Also needed for bundle deploy to read this project's permissions as job-runner-sa-uat (group membership alone was not enough).
            - service_principal_name: "3e5cd4e5-f765-4760-b974-ee7715258b39"  # job-runner-sa-uat
              level: CAN_MANAGE
            - group_name: "Role-Project-LEAP-End-users-Qualibot-DocCompare"
              level: CAN_USE
            - group_name: "Role-Project-LEAP-End-users-Qualibot-ChatBot"
              level: CAN_USE
      # Database-level Postgres role: map the Databricks group to a Lakebase
      # role and grant it DATABRICKS_SUPERUSER on the `production` branch.
      postgres_roles:
        qualibot-service-accounts:
          role_id: "leap-qualibot-service-accounts"
          parent: "projects/qualibot/branches/production"
          identity_type: GROUP
          postgres_role: "leap-qualibot-service-accounts"
          attributes:
            # All three attributes are required: the API rejects a partial `attributes` object.
            createdb: true
            createrole: false
            bypassrls: false
          membership_roles:
            - DATABRICKS_SUPERUSER
          # Adopt the role if it already exists on the branch instead of failing.
          replace_existing: true
        # The app connects as its own service principal: grant it its own role.
        # postgres_role is hardcoded: an interpolated app SP id is unknown after apply, which would recreate this immutable role on unrelated app changes.
        # Update it only if the app is recreated with a new SP (`databricks apps get qualibot`); prevent_destroy is the second safeguard.
        app-service-principal:
          # role_id is a Databricks resource identifier (RFC1123, starts with a letter), not the SP UUID; the SP identity is postgres_role.
          role_id: "app-doc-compare-sp"
          parent: "projects/qualibot/branches/production"
          identity_type: SERVICE_PRINCIPAL
          postgres_role: "ed8abb86-e0db-423b-8f35-5cda58e89b80"  # qualibot-uat app SP client id
          attributes:
            createdb: true
            createrole: false
            bypassrls: false
          membership_roles:
            - DATABRICKS_SUPERUSER
          replace_existing: true
          lifecycle:
            prevent_destroy: true
        # CoreDev group: full access through DATABRICKS_SUPERUSER membership.
        coredev:
          role_id: "coredev"
          parent: "projects/qualibot/branches/production"
          identity_type: GROUP
          postgres_role: "Role-Project-LEAP-CoreDev"
          attributes:
            createdb: false
            createrole: false
            bypassrls: false
          membership_roles:
            - DATABRICKS_SUPERUSER
          replace_existing: true
      schemas:
        qualibot_schema:
          catalog_name: ${var.app_write_catalog}
          name: ${var.app_write_schema}
        qualibot_proj_schema:
          catalog_name: ${var.app_proj_catalog}
          name: ${var.app_proj_schema}
      volumes:
        qualibot_doc_compare:
          catalog_name: ${var.app_write_catalog}
          schema_name: ${resources.schemas.qualibot_schema.name}
          name: doc_compare
          volume_type: MANAGED
        qualibot_test:
          catalog_name: ${var.app_write_catalog}
          schema_name: ${resources.schemas.qualibot_schema.name}
          name: test
          volume_type: MANAGED
        # Written by the 3_parse task (PARSING_VOLUME_BASE_PATH). It already exists: bind it
        # (`databricks bundle deployment bind qualibot_images uat_landingzone.qualibot.images -t qualibot-uat`), or the first deploy tries to create it.
        qualibot_images:
          catalog_name: ${var.app_write_catalog}
          schema_name: ${resources.schemas.qualibot_schema.name}
          name: images
          volume_type: MANAGED
      apps:
        doc-compare:
          # Declared explicitly: once present, this block is the full desired state, so a deploy cannot reset the live ACL silently.
          permissions:
            - group_name: "Role-Project-LEAP-CoreAdmin"
              level: CAN_MANAGE
            - group_name: "Role-Project-LEAP-CoreDev"
              level: CAN_MANAGE
            - group_name: "Role-Project-LEAP-End-users-Qualibot-DocCompare"
              level: CAN_USE
            - group_name: "Role-Project-LEAP-End-users-Qualibot-ChatBot"
              level: CAN_USE
            - user_name: "jules.gourio.external@latecoere.aero"
              level: CAN_MANAGE
            - user_name: "christophe.pelissier@latecoere.aero"
              level: CAN_USE
            - user_name: "yosif.karapendov@latecoere.aero"
              level: CAN_USE
            - service_principal_name: "3e5cd4e5-f765-4760-b974-ee7715258b39"  # job-runner-sa-uat
              level: CAN_MANAGE
          resources:
            - name: doc-compare-volume
              uc_securable:
                securable_type: VOLUME
                securable_full_name: uat_landingzone.qualibot.doc_compare
                permission: WRITE_VOLUME
            - name: test-volume
              uc_securable:
                securable_type: VOLUME
                securable_full_name: uat_landingzone.qualibot.test
                permission: WRITE_VOLUME
      jobs:
        # parsing_pipeline lives in resources/parsing_pipeline.job.yml.
        lakebase_export_uat_to_volume:
          name: "D_1_Qualibot_Lakebase_Export_To_Volume_${bundle.target}"
          description: "Export Lakebase UAT tables to a Unity Catalog staging volume"
          max_concurrent_runs: 1
          tags:
            project: Qualibot
          # Without it, run_as=job-runner-sa-uat makes the SP sole owner and humans lose View/Manage Run rights at deploy.
          permissions:
            - group_name: "Role-Project-LEAP-CoreAdmin"
              level: CAN_MANAGE
            - group_name: "Role-Project-LEAP-CoreDev"
              level: CAN_MANAGE
          run_as:
            service_principal_name: 3e5cd4e5-f765-4760-b974-ee7715258b39
          tasks:
            # Serverless: classic job compute cannot reach the Lakebase private endpoint.
            - task_key: export_lakebase_uat_to_volume
              description: "Extract Lakebase tables to JSONL files in the UAT staging volume"
              notebook_task:
                notebook_path: ./utils/lakebase_sync/export_lakebase_uat_to_volume_job.py
                source: WORKSPACE
                base_parameters:
                  LAKEBASE_PROJECT_ID: "qualibot"
                  LAKEBASE_BRANCH: "production"
                  LAKEBASE_ENDPOINT: "primary"
                  LAKEBASE_DATABASE: "doccompare"
                  OUTPUT_VOLUME_CATALOG: "uat_landingzone"
                  OUTPUT_VOLUME_SCHEMA: "qualibot"
                  OUTPUT_VOLUME_NAME: "staging"
                  TABLES_TO_SKIP: "llm_requests"
              environment_key: default
            - task_key: import_chatbot_tables_to_uat
              description: "Load chatbot JSON exports (chat_feedbacks, chat_messages, chat_sessions) as Delta tables in uat_landingzone.qualibot"
              depends_on:
                - task_key: export_lakebase_uat_to_volume
              notebook_task:
                notebook_path: ./utils/lakebase_sync/import_chatbot_tables_to_uat_job.py
                source: WORKSPACE
              environment_key: default
          environments:
            - environment_key: default
              spec:
                environment_version: "2"
                dependencies:
                  - psycopg2-binary
                  - databricks-sdk>=0.118.0
          schedule:
            quartz_cron_expression: "0 0 2,14 * * ?"
            timezone_id: "Europe/Paris"
            pause_status: UNPAUSED

        # LLM-judge quality scoring of real chat turns, grounded on the Vector Search index (see the notebook header).
        score_production_qa_uat:
          name: "D_1_Qualibot_Score_Production_Qa_Uat"
          description: "LLM-judge quality scoring (Luna, retrieval-grounded) of real ChatBot turns"
          max_concurrent_runs: 1
          tags:
            project: Qualibot
          permissions:
            - group_name: "Role-Project-LEAP-CoreAdmin"
              level: CAN_MANAGE
            - group_name: "Role-Project-LEAP-CoreDev"
              level: CAN_MANAGE
          run_as:
            service_principal_name: 3e5cd4e5-f765-4760-b974-ee7715258b39
          parameters:
            # Empty = no cap on the daily incremental run; pass test_limit explicitly for a backlog run.
            - name: test_limit
              default: ""
            - name: catalog_schema
              default: "uat_landingzone.qualibot"
            - name: source_type
              default: "volume_json"
            - name: enable_retrieval
              default: "true"
            # Overrides for ad-hoc runs only: selection=negative_feedback keeps thumbed-down turns, rescore=true re-judges scored ones into chat_quality_scores_rescore.
            - name: selection
              default: "recent"
            - name: rescore
              default: "false"
          tasks:
            - task_key: score_production_qa
              notebook_task:
                notebook_path: ./utils/evaluation/score_production_qa.py
                source: WORKSPACE
                base_parameters:
                  test_limit: "{{job.parameters.test_limit}}"
                  catalog_schema: "{{job.parameters.catalog_schema}}"
                  source_type: "{{job.parameters.source_type}}"
                  enable_retrieval: "{{job.parameters.enable_retrieval}}"
                  selection: "{{job.parameters.selection}}"
                  rescore: "{{job.parameters.rescore}}"
              environment_key: default
          environments:
            - environment_key: default
              spec:
                environment_version: "2"
                dependencies:
                  - mlflow[databricks]
                  - httpx
          # 20 min after each lakebase_export_uat_to_volume run (02:00 and 14:00), so the staging JSON holds the day's turns.
          schedule:
            quartz_cron_expression: "0 20 2,14 * * ?"
            timezone_id: "Europe/Paris"
            pause_status: UNPAUSED

        # sync_user_capabilities_uat is not in the bundle: its run_as lacks USE SCHEMA on system.access, and a non-admin deployer can only set run_as to itself.
        # A CoreDev member deploys it directly: utils/deploy/deploy_sync_user_capabilities_uat_personal.py.

        # ── App off-hours (UAT) ─────────────────────────────────────────────
        # Generic notebook utils/app_mgmt/stop_start_app_job.py. qualibot-uat-test is stop-only; only qualibot has a start job (weekend pair below).
        # run_as job-runner-sa-uat holds CAN_MANAGE on both apps.
        apps_stop_nightly_uat:
          name: "D_1_Qualibot_Apps_Stop_Nightly_Uat"
          description: "Stop qualibot-uat-test every night at 21h. Never restarted by a job — start it manually when needed."
          max_concurrent_runs: 1
          tags:
            project: Qualibot
          permissions:
            - group_name: "Role-Project-LEAP-CoreAdmin"
              level: CAN_MANAGE
            - group_name: "Role-Project-LEAP-CoreDev"
              level: CAN_MANAGE
          run_as:
            service_principal_name: 3e5cd4e5-f765-4760-b974-ee7715258b39
          tasks:
            - task_key: stop_apps
              notebook_task:
                notebook_path: ./utils/app_mgmt/stop_start_app_job.py
                source: WORKSPACE
                base_parameters:
                  action: "stop"
                  app_names: "qualibot-uat-test"
              environment_key: default
          environments:
            - environment_key: default
              spec:
                environment_version: "2"
                dependencies:
                  - databricks-sdk>=0.118.0
          schedule:
            quartz_cron_expression: "0 0 21 * * ?"
            timezone_id: "Europe/Paris"
            pause_status: UNPAUSED

        qualibot_stop_weekend_uat:
          name: "W_1_Qualibot_Stop_Weekend_Uat"
          description: "Stop qualibot for the weekend (no nightly schedule for this app, unlike qualibot-uat-test/sps-rfq-analysis)."
          max_concurrent_runs: 1
          tags:
            project: Qualibot
          permissions:
            - group_name: "Role-Project-LEAP-CoreAdmin"
              level: CAN_MANAGE
            - group_name: "Role-Project-LEAP-CoreDev"
              level: CAN_MANAGE
          run_as:
            service_principal_name: 3e5cd4e5-f765-4760-b974-ee7715258b39
          tasks:
            - task_key: stop_app
              notebook_task:
                notebook_path: ./utils/app_mgmt/stop_start_app_job.py
                source: WORKSPACE
                base_parameters:
                  action: "stop"
                  app_names: "qualibot"
              environment_key: default
          environments:
            - environment_key: default
              spec:
                environment_version: "2"
                dependencies:
                  - databricks-sdk>=0.118.0
          schedule:
            quartz_cron_expression: "0 0 21 ? * FRI"
            timezone_id: "Europe/Paris"
            pause_status: UNPAUSED

        qualibot_start_weekend_uat:
          name: "W_1_Qualibot_Start_Weekend_Uat"
          description: "Restart qualibot on Monday morning."
          max_concurrent_runs: 1
          tags:
            project: Qualibot
          permissions:
            - group_name: "Role-Project-LEAP-CoreAdmin"
              level: CAN_MANAGE
            - group_name: "Role-Project-LEAP-CoreDev"
              level: CAN_MANAGE
          run_as:
            service_principal_name: 3e5cd4e5-f765-4760-b974-ee7715258b39
          tasks:
            - task_key: start_app
              notebook_task:
                notebook_path: ./utils/app_mgmt/stop_start_app_job.py
                source: WORKSPACE
                base_parameters:
                  action: "start"
                  app_names: "qualibot"
              environment_key: default
          environments:
            - environment_key: default
              spec:
                environment_version: "2"
                dependencies:
                  - databricks-sdk>=0.118.0
          schedule:
            quartz_cron_expression: "0 0 7 ? * MON"
            timezone_id: "Europe/Paris"
            pause_status: UNPAUSED
    variables:
      app_name: "qualibot"
      app_write_catalog: uat_landingzone
      app_write_schema: qualibot
      app_volume_name: doc_compare
      app_proj_catalog: uat_proj
      app_proj_schema: qualibot
      parsing_node_type: "r6idn.4xlarge"
      parsing_num_workers: "4"
      parsing_run_mode: "incremental"
      # Prod sources (refreshed daily), not uat_*: the UAT workspace reads prod_bronze through the shared metastore.
      intraqual_bronze_catalog_schema: "prod_bronze.intraqual"
      intraqual_volume_root: "/Volumes/prod_landingzone/intraqual/intraqual_documents"
      # UAT's own docling_models volume copy (no nested docling_models/ subfolder, unlike DEV).
      parsing_offline_models_path: "/Volumes/uat_landingzone/qualibot/docling_models"
      # Real tables, no suffix: copy the former _v1 state tables to these names (OPERATIONS.md D5.3) BEFORE the next deploy,
      # or the daily run reparses the whole corpus on GPU. One index serves the chat and impact search.
      parsing_table_suffix: ""
      parsing_vector_search_indexes: "uat_landingzone.qualibot.chunks_index"
      # chunks_full is built but its index is not: append uat_landingzone.qualibot.chunks_full_index above to create and sync it.
      parsing_build_chunks_full: "true"
      parsing_schedule_pause: "UNPAUSED"
      # Same Lakebase database the deployed qualibot-uat app itself reads/writes
      # (LAKEBASE_DATABASE in app.yaml / target_config.env) — never doccompare_test.
      parsing_lakebase_database: "doccompare"
      parsing_job_activity_tag: "uat-job"

  # Disposable test target: evaluates the chat without touching the real qualibot-uat app or its Lakebase data (own terraform state).
  # It does not declare postgres_projects/schemas/volumes (they exist, and this identity cannot grant on them).
  # No UC volume binding, so compare is disabled; Lakebase history stays off unless an admin grants the app SP access.
  # Remove this target once the evaluation is done.
  qualibot-uat-test:
    workspace:
      host: https://dbc-3a17bfce-9e88.cloud.databricks.com
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
    resources:
      jobs:
        # No parsing_pipeline job here: it is declared per target in resources/parsing_pipeline.job.yml.

        # One-off admin utility, manual trigger, outside the daily chain.
        # run_as job-runner-sa-uat can grant on uat_landingzone but not on prod_landingzone.intraqual: run it as the deploying user there.
        # It grants one specific SP. The `account users` USE CATALOG failure of `bundle deploy` needs a governance decision (CLAUDE.md).
        grant_volume_access:
          name: "Z_1_Qualibot_Grant_Volume_Access_${bundle.target}"
          description: "Grants USE CATALOG + USE SCHEMA + READ/WRITE VOLUME on a volume to a service principal. Manual trigger only."
          max_concurrent_runs: 1
          tags:
            project: Qualibot
          run_as:
            service_principal_name: 3e5cd4e5-f765-4760-b974-ee7715258b39
          parameters:
            - name: service_principal
              default: "3e5cd4e5-f765-4760-b974-ee7715258b39"
            - name: catalog
              default: "prod_landingzone"
            - name: schema_name
              default: "intraqual"
            - name: volume_name
              default: "intraqual_documents"
            - name: volume_permission
              default: "READ VOLUME"
          tasks:
            - task_key: grant
              notebook_task:
                notebook_path: ./utils/grants/grant_volume_access_job.py
                source: WORKSPACE
                base_parameters:
                  service_principal: "{{job.parameters.service_principal}}"
                  catalog: "{{job.parameters.catalog}}"
                  schema_name: "{{job.parameters.schema_name}}"
                  volume_name: "{{job.parameters.volume_name}}"
                  volume_permission: "{{job.parameters.volume_permission}}"
              environment_key: default
          environments:
            - environment_key: default
              spec:
                environment_version: "2"

        migrate_lakebase_uat_test:
          name: "Z_1_Qualibot_Migrate_Lakebase_${bundle.target}"
          description: "Apply idempotent Lakebase schema migrations (utils/lakebase_sync/migrate_lakebase.py) to doccompare_test — never doccompare. Manual trigger only."
          max_concurrent_runs: 1
          tags:
            project: Qualibot
          # doccompare_test tables are owned by the qualibot-uat-test app SP, not job-runner-sa-uat.
          run_as:
            service_principal_name: 3e5cd4e5-f765-4760-b974-ee7715258b39
          permissions:
            - group_name: "Role-Project-LEAP-CoreAdmin"
              level: CAN_MANAGE
            - group_name: "Role-Project-LEAP-CoreDev"
              level: CAN_MANAGE
          tasks:
            # Serverless: classic job compute cannot reach the Lakebase private endpoint.
            - task_key: migrate_lakebase
              notebook_task:
                notebook_path: ./utils/lakebase_sync/migrate_lakebase_job.py
                source: WORKSPACE
                base_parameters:
                  LAKEBASE_PROJECT_ID: "qualibot"
                  LAKEBASE_BRANCH: "production"
                  LAKEBASE_ENDPOINT: "primary"
                  LAKEBASE_DATABASE: "doccompare_test"
              environment_key: default
          environments:
            - environment_key: default
              spec:
                environment_version: "2"
                dependencies:
                  - psycopg2-binary
                  - databricks-sdk>=0.118.0

        sync_user_capabilities_uat_test:
          name: "D_1_Qualibot_Sync_User_Capabilities_Uat_Test"
          description: "Sync user group membership (system.access.audit) -> users.groups/can_chat/can_compare, on doccompare_test. Validation job — see utils/user_capabilities/sync_user_capabilities_job.py. Point LAKEBASE_DATABASE at doccompare (qualibot-uat target) only once validated end to end."
          max_concurrent_runs: 1
          tags:
            project: Qualibot
          # Live test of job-runner-sa-uat on system.access.audit (blocked: missing USE SCHEMA/SELECT).
          run_as:
            service_principal_name: 3e5cd4e5-f765-4760-b974-ee7715258b39
          permissions:
            - group_name: "Role-Project-LEAP-CoreAdmin"
              level: CAN_MANAGE
            - group_name: "Role-Project-LEAP-CoreDev"
              level: CAN_MANAGE
          tasks:
            # Serverless: classic job compute cannot reach the Lakebase private endpoint.
            - task_key: sync_user_capabilities
              notebook_task:
                notebook_path: ./utils/user_capabilities/sync_user_capabilities_job.py
                source: WORKSPACE
                base_parameters:
                  dry_run: "false"
                  LAKEBASE_PROJECT_ID: "qualibot"
                  LAKEBASE_BRANCH: "production"
                  LAKEBASE_ENDPOINT: "primary"
                  LAKEBASE_DATABASE: "doccompare_test"
              environment_key: default
          environments:
            - environment_key: default
              spec:
                environment_version: "2"
                dependencies:
                  - psycopg2-binary
                  - databricks-sdk>=0.118.0
          schedule:
            quartz_cron_expression: "0 30 3 * * ?"
            timezone_id: "Europe/Paris"
            pause_status: UNPAUSED
    variables:
      app_name: "qualibot-uat-test"
      app_write_catalog: uat_landingzone
      app_write_schema: qualibot
      app_volume_name: doc_compare
      parsing_node_type: "r6idn.4xlarge"
      parsing_num_workers: "4"
      parsing_run_mode: "incremental"
      # Disposable target: `*_test` tables and no synced index, same as
      # qualibot-uat until the chain is validated.
      parsing_table_suffix: "_test"
      parsing_vector_search_indexes: ""
      parsing_schedule_pause: "PAUSED"
      intraqual_bronze_catalog_schema: "prod_bronze.intraqual"
      intraqual_volume_root: "/Volumes/prod_landingzone/intraqual/intraqual_documents"

  qualibot-prod:
    mode: production
    workspace:
      host: https://dbc-77b87d5a-6bcb.cloud.databricks.com
      root_path: /Workspace/.bundle/${bundle.name}/${bundle.target}
    resources:
      postgres_projects:
        qualibot-history:
          project_id: qualibot
          display_name: "Qualibot History"
          # Native Postgres login in addition to Databricks OAuth tokens.
          enable_pg_native_login: true
          default_endpoint_settings:
            # Fixed 1 CU (~2 GB RAM) — no autoscaling (min = max).
            autoscaling_limit_min_cu: 1
            autoscaling_limit_max_cu: 1
            # Scale-to-zero: suspend the compute endpoint after 5 min idle.
            suspend_timeout_duration: "300s"
          lifecycle:
            prevent_destroy: true
          # Full desired state: grants made in the UI and not listed here are removed on the next deploy.
          permissions:
            - group_name: "Role-Project-LEAP-CoreAdmin"
              level: CAN_MANAGE
            - group_name: "Role-Project-LEAP-CoreDev"
              level: CAN_MANAGE
            - group_name: "leap-qualibot-service-accounts"
              level: CAN_MANAGE
            - group_name: "Role-Project-LEAP-End-users-Qualibot-DocCompare"
              level: CAN_USE
            - group_name: "Role-Project-LEAP-End-users-Qualibot-ChatBot"
              level: CAN_USE
      # Database-level Postgres role: map the Databricks group to a Lakebase
      # role and grant it DATABRICKS_SUPERUSER on the `production` branch.
      postgres_roles:
        qualibot-service-accounts:
          role_id: "leap-qualibot-service-accounts"
          parent: "projects/qualibot/branches/production"
          identity_type: GROUP
          postgres_role: "leap-qualibot-service-accounts"
          attributes:
            # All three attributes are required: the API rejects a partial `attributes` object.
            createdb: true
            createrole: false
            bypassrls: false
          membership_roles:
            - DATABRICKS_SUPERUSER
          # Adopt the role if it already exists on the branch instead of failing.
          replace_existing: true
        # The app connects as its own service principal: grant it its own role. The SP client id is referenced from the app resource, so it is right per environment.
        app-service-principal:
          # role_id is a Databricks resource identifier (RFC1123, starts with a letter), not the SP UUID; the SP identity is postgres_role.
          role_id: "app-doc-compare-sp"
          parent: "projects/qualibot/branches/production"
          identity_type: SERVICE_PRINCIPAL
          postgres_role: ${resources.apps.doc-compare.service_principal_client_id}
          attributes:
            createdb: true
            createrole: false
            bypassrls: false
          membership_roles:
            - DATABRICKS_SUPERUSER
          replace_existing: true
        # CoreDev group: full access through DATABRICKS_SUPERUSER membership.
        coredev:
          role_id: "coredev"
          parent: "projects/qualibot/branches/production"
          identity_type: GROUP
          postgres_role: "Role-Project-LEAP-CoreDev"
          attributes:
            createdb: false
            createrole: false
            bypassrls: false
          membership_roles:
            - DATABRICKS_SUPERUSER
          replace_existing: true
      schemas:
        qualibot_schema:
          catalog_name: ${var.app_write_catalog}
          name: ${var.app_write_schema}
      volumes:
        qualibot_doc_compare:
          catalog_name: ${var.app_write_catalog}
          schema_name: ${resources.schemas.qualibot_schema.name}
          name: doc_compare
          volume_type: MANAGED
        qualibot_docling_models:
          catalog_name: ${var.app_write_catalog}
          schema_name: ${resources.schemas.qualibot_schema.name}
          name: docling_models
          volume_type: MANAGED
        qualibot_test:
          catalog_name: ${var.app_write_catalog}
          schema_name: ${resources.schemas.qualibot_schema.name}
          name: test
          volume_type: MANAGED
        # Written by the 3_parse task (PARSING_VOLUME_BASE_PATH). Check `databricks volumes list prod_landingzone qualibot` before deploying: bind it if it exists.
        qualibot_images:
          catalog_name: ${var.app_write_catalog}
          schema_name: ${resources.schemas.qualibot_schema.name}
          name: images
          volume_type: MANAGED
      apps:
        doc-compare:
          resources:
            - name: doc-compare-volume
              uc_securable:
                securable_type: VOLUME
                securable_full_name: prod_landingzone.qualibot.doc_compare
                permission: WRITE_VOLUME
            - name: test-volume
              uc_securable:
                securable_type: VOLUME
                securable_full_name: prod_landingzone.qualibot.test
                permission: WRITE_VOLUME
    variables:
      app_name: "qualibot"
      app_write_catalog: prod_landingzone
      app_write_schema: qualibot
      app_volume_name: doc_compare
      parsing_node_type: "r6idn.4xlarge"
      parsing_num_workers: "8"
      parsing_run_mode: "incremental"
      intraqual_bronze_catalog_schema: "prod_bronze.intraqual"
      intraqual_volume_root: "/Volumes/prod_landingzone/intraqual/intraqual_documents"
      parsing_job_activity_tag: "prod-job"
      parsing_offline_models_path: "/Volumes/prod_landingzone/qualibot/docling_models"
      # Same Lakebase database the deployed qualibot-prod app reads and writes (LAKEBASE_DATABASE in app.yaml).
      parsing_lakebase_database: "doccompare"
      # 5_sync_index creates the index on its first run if it does not exist.
      parsing_vector_search_indexes: "prod_landingzone.qualibot.chunks_index"
