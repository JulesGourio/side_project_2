            - task_key: sync_user_capabilities
              notebook_task:
                notebook_path: ./utils/databricks_ops/user_capabilities/sync_user_capabilities_job.py
                source: WORKSPACE
                base_parameters:
                  dry_run: "false"
                  LAKEBASE_PROJECT_ID: "qualibot"
                  LAKEBASE_BRANCH: "production"
                  LAKEBASE_ENDPOINT: "primary"
                  LAKEBASE_DATABASE: "doccompare_test"
              environment_key: default
          environments:
            - environment_key: default
              spec:
                environment_version: "2"
                dependencies:
                  - psycopg2-binary
                  - databricks-sdk>=0.118.0
          schedule:
            quartz_cron_expression: "0 30 3 * * ?"
            timezone_id: "Europe/Paris"
            pause_status: UNPAUSED
    variables:
      app_name: "qualibot-uat-test"
      app_write_catalog: uat_landingzone
      app_write_schema: qualibot
      app_volume_name: doc_compare
      parsing_node_type: "r6idn.4xlarge"
      parsing_num_workers: "4"
      parsing_run_mode: "incremental"
      # Disposable target: `*_test` tables and no synced index, same as
      # qualibot-uat until the chain is validated.
      parsing_table_suffix: "_test"
      parsing_vector_search_indexes: ""
      parsing_schedule_pause: "PAUSED"
      intraqual_source_catalog_schema: "prod_landingzone.intraqual"
      intraqual_bronze_catalog_schema: "prod_bronze.intraqual"
      intraqual_volume_root: "/Volumes/prod_landingzone/intraqual/intraqual_documents"

  qualibot-prod:
    mode: production
    workspace:
      host: https://dbc-77b87d5a-6bcb.cloud.databricks.com
      root_path: /Workspace/.bundle/${bundle.name}/${bundle.target}
    resources:
      postgres_projects:
        qualibot-history:
          project_id: qualibot
          display_name: "Qualibot History"
          # Allow Postgres native (username/password) login IN ADDITION to the
          # default Databricks OAuth-token auth on the connection.
          enable_pg_native_login: true
          default_endpoint_settings:
            # Fixed 1 CU (~2 GB RAM) — no autoscaling (min = max).
            autoscaling_limit_min_cu: 1
            autoscaling_limit_max_cu: 1
            # Scale-to-zero: suspend the compute endpoint after 5 min idle.
            suspend_timeout_duration: "300s"
          lifecycle:
            prevent_destroy: true
          # Declared block = full desired state: any grant made manually in the
          # UI and not listed here is removed on the next deploy (same behaviour
          # as the app's `permissions:` block).
          permissions:
            - group_name: "Role-Project-LEAP-CoreAdmin"
              level: CAN_MANAGE
            - group_name: "Role-Project-LEAP-CoreDev"
              level: CAN_MANAGE
            - group_name: "leap-qualibot-service-accounts"
              level: CAN_MANAGE
            - group_name: "Role-Project-LEAP-End-users-Qualibot-DocCompare"
              level: CAN_USE
            - group_name: "Role-Project-LEAP-End-users-Qualibot-ChatBot"
              level: CAN_USE
      # Database-level Postgres role: map the Databricks group to a Lakebase
      # role and grant it DATABRICKS_SUPERUSER on the `production` branch.
      postgres_roles:
        qualibot-service-accounts:
          role_id: "leap-qualibot-service-accounts"
          parent: "projects/qualibot/branches/production"
          identity_type: GROUP
          postgres_role: "leap-qualibot-service-accounts"
          attributes:
            # All three must be provided: the API's update_mask covers the whole
            # `attributes` object, so an omitted field is rejected (400).
            createdb: true
            createrole: false
            bypassrls: false
          membership_roles:
            - DATABRICKS_SUPERUSER
          # Adopt the role if it already exists on the branch instead of failing.
          replace_existing: true
        # The app connects to Lakebase as its OWN service principal. Grant that
        # SP its own role (in addition to the group role above). The SP client id
        # is referenced dynamically from the app resource — never hard-coded, and
        # automatically correct per environment (UAT vs prod have different SPs).
        app-service-principal:
          # role_id = a Databricks resource identifier (RFC1123, must start with
          # a letter) — NOT the SP UUID. The SP identity is carried by
          # postgres_role, which for identity_type SERVICE_PRINCIPAL must equal
          # the SP's application id (the username the app connects with).
          role_id: "app-doc-compare-sp"
          parent: "projects/qualibot/branches/production"
          identity_type: SERVICE_PRINCIPAL
          postgres_role: ${resources.apps.doc-compare.service_principal_client_id}
          attributes:
            createdb: true
            createrole: false
            bypassrls: false
          membership_roles:
            - DATABRICKS_SUPERUSER
          replace_existing: true
        # CoreDev group — full access via DATABRICKS_SUPERUSER membership
        # (superuser can read every table without per-table GRANTs).
        coredev:
          role_id: "coredev"
          parent: "projects/qualibot/branches/production"
          identity_type: GROUP
          postgres_role: "Role-Project-LEAP-CoreDev"
          attributes:
            createdb: false
            createrole: false
            bypassrls: false
          membership_roles:
            - DATABRICKS_SUPERUSER
          replace_existing: true
      jobs:
        # Same idempotent create-or-update as qualibot-uat-test's
        # provision_knowledge_assistant_uat_test (see that job's comment for
        # the full rationale) -- points at prod_landingzone.qualibot with no
        # index suffix (prod's clean naming, see resources/parsing_pipeline.job.yml)
        # and run_as job-runner-sa-prod, which already owns this schema.
        provision_knowledge_assistant_prod:
          name: "qualibot-provision-knowledge-assistant-${bundle.target}"
          description: "Idempotent create-or-update of the Qualibot Knowledge Assistants. Manual trigger only."
          max_concurrent_runs: 1
          tags:
            project: Qualibot
          run_as:
            service_principal_name: b82d3b5a-b633-4738-8dde-68bb2142cb02
          permissions:
            - group_name: "Role-Project-LEAP-CoreAdmin"
              level: CAN_MANAGE
            - group_name: "Role-Project-LEAP-CoreDev"
              level: CAN_MANAGE
          parameters:
            - name: ka_profiles
              default: "ALL,AS,IS"
            - name: catalog
              default: "prod_landingzone"
            - name: schema_name
              default: "qualibot"
            - name: index_suffix
              default: ""
            # Unlike qualibot-uat-test (which keeps "_v2" to match the live
            # qualibot-uat KAs by name), prod gets clean, unsuffixed KA names.
            - name: display_name_suffix
              default: ""
            - name: app_name
              default: "qualibot"
          tasks:
            - task_key: provision_knowledge_assistant
              notebook_task:
                notebook_path: ./utils/databricks_ops/knowledge_assistant/provision_knowledge_assistant_job.py
                source: WORKSPACE
                base_parameters:
                  KA_PROFILES: "{{job.parameters.ka_profiles}}"
                  CATALOG: "{{job.parameters.catalog}}"
                  SCHEMA: "{{job.parameters.schema_name}}"
                  INDEX_SUFFIX: "{{job.parameters.index_suffix}}"
                  DISPLAY_NAME_SUFFIX: "{{job.parameters.display_name_suffix}}"
                  APP_NAME: "{{job.parameters.app_name}}"
              environment_key: default
          environments:
            - environment_key: default
              spec:
                environment_version: "2"
                dependencies:
                  - databricks-sdk>=0.102.0
      schemas:
        qualibot_schema:
          catalog_name: ${var.app_write_catalog}
          name: ${var.app_write_schema}
      volumes:
        qualibot_doc_compare:
          catalog_name: ${var.app_write_catalog}
          schema_name: ${resources.schemas.qualibot_schema.name}
          name: doc_compare
          volume_type: MANAGED
        qualibot_docling_models:
          catalog_name: ${var.app_write_catalog}
          schema_name: ${resources.schemas.qualibot_schema.name}
          name: docling_models
          volume_type: MANAGED
        qualibot_test:
          catalog_name: ${var.app_write_catalog}
          schema_name: ${resources.schemas.qualibot_schema.name}
          name: test
          volume_type: MANAGED
        # Written by parsing_pipeline's 3_parse task (PARSING_VOLUME_BASE_PATH).
        # Existence in prod_landingzone.qualibot unconfirmed as of 2026-08-26
        # (PROD CLI profile needs re-auth) — check with `databricks volumes
        # list prod_landingzone qualibot` before deploying this target; if it
        # doesn't exist yet, a normal deploy creates it, if it does, bind
        # first like qualibot-uat's (see that target's comment).
        qualibot_images:
          catalog_name: ${var.app_write_catalog}
          schema_name: ${resources.schemas.qualibot_schema.name}
          name: images
          volume_type: MANAGED
      apps:
        doc-compare:
          resources:
            - name: doc-compare-volume
              uc_securable:
                securable_type: VOLUME
                securable_full_name: prod_landingzone.qualibot.doc_compare
                permission: WRITE_VOLUME
            - name: test-volume
              uc_securable:
                securable_type: VOLUME
                securable_full_name: prod_landingzone.qualibot.test
                permission: WRITE_VOLUME
    variables:
      app_name: "qualibot"
      app_write_catalog: prod_landingzone
      app_write_schema: qualibot
      app_volume_name: doc_compare
      parsing_node_type: "r6idn.4xlarge"
      parsing_num_workers: "8"
      parsing_run_mode: "incremental"
      intraqual_source_catalog_schema: "prod_landingzone.intraqual"
      intraqual_bronze_catalog_schema: "prod_bronze.intraqual"
      intraqual_volume_root: "/Volumes/prod_landingzone/intraqual/intraqual_documents"
      parsing_job_activity_tag: "prod-job"
      parsing_offline_models_path: "/Volumes/prod_landingzone/qualibot/docling_models"
      # Same Lakebase database the deployed qualibot-prod app itself reads/writes
      # (LAKEBASE_DATABASE in app.yaml) — matches the qualibot-uat pattern.
      parsing_lakebase_database: "doccompare"
      # No suffix (unlike qualibot-uat's _v1) -- prod is the one environment,
      # no version history to carry. 5_sync_index creates these the first time
      # it runs if they don't exist yet (see that notebook + its job task).
      parsing_vector_search_indexes: "prod_landingzone.qualibot.chunks_index,prod_landingzone.qualibot.chunks_as_index,prod_landingzone.qualibot.chunks_is_index,prod_landingzone.qualibot.chunks_full_index"
