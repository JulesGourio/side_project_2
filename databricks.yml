# Databricks Asset Bundle (DABs) — QualiBOT

bundle:
  name: qualibot

# Jobs and apps live in resources/*.yml (one file per concern, declared per target).
include:
  - resources/*.yml

variables:
  app_name:
    default: "qualibot"
    description: "Unique name for the Databricks App"
  alerts_warehouse_id:
    description: "SQL warehouse that runs the Databricks SQL alerts of resources/alerts.yml (one per target)."
  alerts_pause_status:
    description: "PAUSED: the alerts are deployed but do not run. UNPAUSED: they run on their schedule."
    default: "PAUSED"
  pipeline_write_env:
    description: "Environment the app and the pipeline write to: dev, uat or prod. Tables live in <pipeline_write_env>_proj.qualibot."
    default: dev

  # --- Parsing pipeline ---
  parsing_gpu_node_type:
    description: "GPU node type for the Docling parse cluster (g4dn.4xlarge = T4 64Go)"
    default: "g4dn.4xlarge"
  parsing_describe_node_type:
    description: "Small CPU node for the LLM image-description task (I/O-bound)"
    default: "m5d.xlarge"
  parsing_num_workers:
    description: "Number of GPU workers for the parse cluster"
    default: "2"
  parsing_parse_cpu_node_type:
    description: "Node of the CPU parse cluster (3_parse, 3c_chunks); the S policy allows *.xlarge only. r6id.xlarge = 4 vCPU, 32 GB, for four Docling processes."
    default: "r6id.xlarge"
  parsing_images_volume:
    description: "Volume of <pipeline_write_env>_proj.qualibot the parsing pipeline extracts images to"
    default: "images"
  reference_read_env:
    description: "Environment of the reference tables the pipeline reads (Intraqual data asset quality_system): prod in every target"
    default: "prod"
  parsing_vector_search_indexes:
    description: >-
      Comma-separated Vector Search index names synced by task 5_sync_index.
      Empty = nothing to sync.
    default: ""
  parsing_archive_max_docs:
    description: >-
      Total number of pre-2018 documents allowed to be parsed into chunks_archive,
      most recent first (cumulative, not per run). 0 = none, -1 = all.
    default: "0"
  parsing_build_chunks_full:
    description: >-
      "true" makes 5_sync_index refresh chunks_full (chunks + chunks_archive) even
      when chunks_full_index is not in parsing_vector_search_indexes.
    default: "false"
  parsing_lakebase_database:
    description: >-
      Lakebase database updated by task 6_update_kb_metadata with the daily
      run's documents_as_of/updated_at. Empty = skip.
    default: ""
  parsing_schedule_cron:
    description: "Quartz cron for the daily parsing run (Europe/Brussels)"
    default: "0 0 4 * * ?"
  parsing_schedule_pause:
    description: "PAUSED: the daily parsing job does not run on its schedule. UNPAUSED: it runs every day at parsing_schedule_cron."
    default: "PAUSED"
  job_cluster_policy_id_S:
    description: "CORE Job Compute S policy: single node, first node (the driver) on demand"
    default: "001E30C26BD479FE"
  job_activity_tag:
    description: "activity-type tag of every job and of its clusters, {env}-job (the cluster policies require it)"
    default: "dev-job"
  chat_mlflow_experiment:
    description: >-
      Workspace path of the MLflow experiment that receives one trace per chat turn (the traces are stored in Unity Catalog tables <experiment id>_otel_* of the schema <pipeline_write_env>_proj.qualibot). It sits in the shared folder /Shared/Experiment, not in the home folder of a person or a service principal. Read by the chat jobs of resources/chat_mlflow.yml;
      the app reads CHAT_MLFLOW_EXPERIMENT in utils/deploy/target_env.json, which must hold the same value (tests/test_deploy_config.py).
      Moving the experiment in the workspace changes this path: update both.
    default: "/Shared/Experiment/qualibot_chat_traces"
  lakebase_export_schedule_pause:
    description: "PAUSED: the Lakebase export job (D_1_Qualibot_Lakebase_Export_To_Volume) does not run on its schedule. UNPAUSED: it runs at 02:00 and 14:00 (Europe/Brussels)."
    default: "PAUSED"
  lakebase_import_to_delta:
    description: "true: the export job also loads every exported table as a Delta table of <pipeline_write_env>_proj.qualibot. false on DEV, whose schema holds Delta copies of the UAT tables."
    default: "false"
  lakebase_tables_to_skip:
    description: "Comma-separated Lakebase tables the export job leaves out. Empty: every table is exported."
    default: ""
  notification_email:
    description: "Recipient of the failure notifications of every job"
    default: "LEAP_Databricks_Alert@latecoere.aero"

sync:
  include:
    - "target_config.env"        # gitignored but must reach the workspace (per-env overrides)
    - "client/out/**"            # gitignored: the frontend is built at deployment and served by the app
  exclude:
    - "~$*"                      # Excel/Word lock files (Windows, file open in Office)
    - "client/src/**"            # frontend source — only built output (client/out) is needed
    - "client/public/**"         # source assets duplicated in client/out after build
    - "client/node_modules/**"
    - "runbooks/**"              # not deployed
    - "archive/**"               # superseded documentation, never read at runtime
    - ".git/**"
    - ".databricks/**"           # local CLI cache — contains 64MB+ terraform binaries
    - "__pycache__/**"
    - "**/*.pyc"
    - ".venv/**"
    - "**/*.ipynb"               # notebooks (exploratory ones embed base64 images, several MB)
    - "debug_results/**"
    - "files_to_compare/**"
    - "debug_images/**"
    - "Intraqual_files/**"
    - "intraqual_downloads/**"
    - "intraqual_extracted/**"
    - "utils/deploy/.intraqual_profile/**"
    - "user_feedbacks/**"
    - "test_prompt/**"
    - "**/*.xlsx"
    - "**/*.xls"
    - "**/*.zip"

resources:
  apps:
    doc-compare:
      name: ${var.app_name}
      description: "QualiBOT — document comparison and chat"
      source_code_path: .
      # On-behalf-of-user OAuth: the app reads the visitor's workspace groups from SCIM /Me with their token (server/services/infra/user.py).
      user_api_scopes:
        - sql
      permissions:
        - group_name: "Role-Project-LEAP-CoreAdmin"
          level: CAN_MANAGE
        - group_name: "Role-Project-LEAP-CoreDev"
          level: CAN_MANAGE
        - group_name: "Role-Project-LEAP-End-users-Qualibot-DocCompare"
          level: CAN_USE
        - group_name: "Role-Project-LEAP-End-users-Qualibot-ChatBot"
          level: CAN_USE

targets:
  # ---------------------------------------------------------------------------
  # DEV target: full copy of uat in the DEV workspace.
  # Own app, Lakebase project, Vector Search endpoint and dev_proj.qualibot tables, loaded from a UAT snapshot by a one-shot submit.
  # Every new schedule is PAUSED. run_as is the DEV service principal: job-runner-sa-uat is UAT-scoped and silently ignored here.
  # The in-app group check is off for this target only: CAPS_BYPASS in utils/deploy/target_env.json.
  # ---------------------------------------------------------------------------
  dev:
    workspace:
      host: https://dbc-c623749d-731b.cloud.databricks.com
      root_path: /Workspace/.bundle/${bundle.name}/${bundle.target}
    resources:
      postgres_projects:
        qualibot-history:
          project_id: qualibot
          display_name: "Qualibot History"
          enable_pg_native_login: true
          default_endpoint_settings:
            autoscaling_limit_min_cu: 1
            autoscaling_limit_max_cu: 1
            suspend_timeout_duration: "300s"
          lifecycle:
            prevent_destroy: true
          permissions:
            - group_name: "Role-Project-LEAP-CoreAdmin"
              level: CAN_MANAGE
            - group_name: "Role-Project-LEAP-CoreDev"
              level: CAN_MANAGE
            - group_name: "leap-qualibot-service-accounts"
              level: CAN_MANAGE
            - service_principal_name: "fde6ff28-739f-4a41-b61e-604a298c8478"  # DEV job SP
              level: CAN_MANAGE
            # The deploying human must stay in this list: it is the full desired state, and a creator left out loses Can Manage on its own project.
            - user_name: "jules.gourio.external@latecoere.aero"
              level: CAN_MANAGE
            - group_name: "Role-Project-LEAP-End-users-Qualibot-DocCompare"
              level: CAN_USE
            - group_name: "Role-Project-LEAP-End-users-Qualibot-ChatBot"
              level: CAN_USE
      # The parent interpolates the project above so the roles wait for it on a first deploy.
      postgres_roles:
        qualibot-service-accounts:
          role_id: "leap-qualibot-service-accounts"
          parent: "projects/${resources.postgres_projects.qualibot-history.project_id}/branches/production"
          identity_type: GROUP
          postgres_role: "leap-qualibot-service-accounts"
          attributes:
            createdb: true
            createrole: false
            bypassrls: false
          membership_roles:
            - DATABRICKS_SUPERUSER
          replace_existing: true
        # The app connects to Lakebase as its own service principal, hardcoded: an interpolated value would force a recreate of this immutable role.
        # The DEV app is bound to this role.
        app-service-principal:
          role_id: "app-doc-compare-sp"
          parent: "projects/${resources.postgres_projects.qualibot-history.project_id}/branches/production"
          identity_type: SERVICE_PRINCIPAL
          postgres_role: "8e411164-a7e8-46ff-8013-8c56af2c3656"  # DEV qualibot app SP client id
          attributes:
            createdb: true
            createrole: false
            bypassrls: false
          membership_roles:
            - DATABRICKS_SUPERUSER
          replace_existing: true
          lifecycle:
            prevent_destroy: true
        # Writes catalog_metadata (6_update_kb_metadata) and runs the Lakebase export and migrations.
        dev-job-service-principal:
          role_id: "dev-job-sp"
          parent: "projects/${resources.postgres_projects.qualibot-history.project_id}/branches/production"
          identity_type: SERVICE_PRINCIPAL
          postgres_role: "fde6ff28-739f-4a41-b61e-604a298c8478"
          attributes:
            createdb: false
            createrole: false
            bypassrls: false
          membership_roles:
            - DATABRICKS_SUPERUSER
          replace_existing: true
        coredev:
          role_id: "coredev"
          parent: "projects/${resources.postgres_projects.qualibot-history.project_id}/branches/production"
          identity_type: GROUP
          postgres_role: "Role-Project-LEAP-CoreDev"
          attributes:
            createdb: false
            createrole: false
            bypassrls: false
          membership_roles:
            - DATABRICKS_SUPERUSER
          replace_existing: true
      # The volumes of dev_proj.qualibot are created by the first deploy; their data is loaded by the one-shot copy.
      schemas:
        qualibot_proj_schema:
          catalog_name: ${var.pipeline_write_env}_proj
          name: qualibot
      volumes:
        qualibot_doc_compare:
          catalog_name: ${var.pipeline_write_env}_proj
          schema_name: ${resources.schemas.qualibot_proj_schema.name}
          name: doc_compare
          volume_type: MANAGED
        qualibot_images:
          catalog_name: ${var.pipeline_write_env}_proj
          schema_name: ${resources.schemas.qualibot_proj_schema.name}
          name: images
          volume_type: MANAGED
        # Lakebase export of the DEV app (lakebase_export, resources/lakebase_sync.yml).
        qualibot_staging:
          catalog_name: ${var.pipeline_write_env}_proj
          schema_name: ${resources.schemas.qualibot_proj_schema.name}
          name: staging
          volume_type: MANAGED
      apps:
        doc-compare:
          # Mirrors the live ACL of the DEV app, without `users` CAN_MANAGE, plus the developer and the DEV job SP.
          permissions:
            - group_name: "Role-Project-LEAP-CoreAdmin"
              level: CAN_MANAGE
            - group_name: "Role-Project-LEAP-CoreDev"
              level: CAN_MANAGE
            - group_name: "Role-Project-LEAP-End-users-Qualibot-DocCompare"
              level: CAN_USE
            - group_name: "Role-Project-LEAP-End-users-Qualibot-ChatBot"
              level: CAN_USE
            - user_name: "jules.gourio.external@latecoere.aero"
              level: CAN_MANAGE
            - service_principal_name: "fde6ff28-739f-4a41-b61e-604a298c8478"  # DEV job SP (stop/start jobs)
              level: CAN_MANAGE
          # No UC volume binding on this target: it would grant USE CATALOG on dev_proj to the app SP, which a human deployer cannot do.
          # The SP gets its grants from a one-shot grant job.
    variables:
      app_name: "qualibot"
      pipeline_write_env: dev
      alerts_warehouse_id: "13eff4a6095513cb"
      lakebase_import_to_delta: "true"
      lakebase_tables_to_skip: "doc_catalog,impact_cache,impact_document_results,impact_feedbacks,impact_requests,llm_requests,summary_cache,users"
      parsing_num_workers: "4"
      # Same prod sources as UAT.
      reference_read_env: "prod"
      # DEV's own volume (nested docling_models/ subfolder, unlike UAT's).
      # Real tables, no suffix. One index serves the chat (division filter) and impact search.
      parsing_vector_search_indexes: "dev_proj.qualibot.chunks_index"
      # PAUSED on purpose — unpause only on explicit decision.
      parsing_schedule_pause: "PAUSED"
      parsing_lakebase_database: "doccompare"
      job_activity_tag: "dev-job"
      notification_email: "jules.gourio.external@latecoere.aero"
      job_cluster_policy_id_S: "001E30C26BD479FE"
      # The pre-2018 archive is not built on DEV.
      parsing_archive_max_docs: "0"
      parsing_build_chunks_full: "false"

  uat:
    default: true
    workspace:
      host: https://dbc-3a17bfce-9e88.cloud.databricks.com
      # Pinned: the bundle state of the deployed UAT lives in this folder. A new target name must not move it.
      root_path: /Workspace/.bundle/${bundle.name}/qualibot-uat
    resources:
      postgres_projects:
        qualibot-history:
          project_id: qualibot
          display_name: "Qualibot History"
          # Native Postgres login in addition to Databricks OAuth tokens.
          enable_pg_native_login: true
          default_endpoint_settings:
            # Fixed 1 CU (~2 GB RAM) — no autoscaling (min = max).
            autoscaling_limit_min_cu: 1
            autoscaling_limit_max_cu: 1
            # Scale-to-zero: suspend the compute endpoint after 5 min idle.
            suspend_timeout_duration: "300s"
          lifecycle:
            prevent_destroy: true
          # Full desired state: grants made in the UI and not listed here are removed on the next deploy.
          permissions:
            - group_name: "Role-Project-LEAP-CoreAdmin"
              level: CAN_MANAGE
            - group_name: "Role-Project-LEAP-CoreDev"
              level: CAN_MANAGE
            - group_name: "leap-qualibot-service-accounts"
              level: CAN_MANAGE
            # Also needed for bundle deploy to read this project's permissions as job-runner-sa-uat.
            - service_principal_name: "3e5cd4e5-f765-4760-b974-ee7715258b39"  # job-runner-sa-uat
              level: CAN_MANAGE
            - group_name: "Role-Project-LEAP-End-users-Qualibot-DocCompare"
              level: CAN_USE
            - group_name: "Role-Project-LEAP-End-users-Qualibot-ChatBot"
              level: CAN_USE
      # Database-level Postgres role: map the Databricks group to a Lakebase
      # role and grant it DATABRICKS_SUPERUSER on the `production` branch.
      postgres_roles:
        qualibot-service-accounts:
          role_id: "leap-qualibot-service-accounts"
          parent: "projects/qualibot/branches/production"
          identity_type: GROUP
          postgres_role: "leap-qualibot-service-accounts"
          attributes:
            # All three attributes are required: the API rejects a partial `attributes` object.
            createdb: true
            createrole: false
            bypassrls: false
          membership_roles:
            - DATABRICKS_SUPERUSER
          # Adopt the role if it already exists on the branch instead of failing.
          replace_existing: true
        # The app connects as its own service principal: grant it its own role.
        # postgres_role is hardcoded: an interpolated app SP id is unknown after apply, which would recreate this immutable role on unrelated app changes.
        # Update it only if the app is recreated with a new service principal; prevent_destroy is the second safeguard.
        app-service-principal:
          # role_id is a Databricks resource identifier (RFC1123, starts with a letter), not the SP UUID; the SP identity is postgres_role.
          role_id: "app-doc-compare-sp"
          parent: "projects/qualibot/branches/production"
          identity_type: SERVICE_PRINCIPAL
          postgres_role: "ed8abb86-e0db-423b-8f35-5cda58e89b80"  # qualibot-uat app SP client id
          attributes:
            createdb: true
            createrole: false
            bypassrls: false
          membership_roles:
            - DATABRICKS_SUPERUSER
          replace_existing: true
          lifecycle:
            prevent_destroy: true
        # CoreDev group: full access through DATABRICKS_SUPERUSER membership.
        coredev:
          role_id: "coredev"
          parent: "projects/qualibot/branches/production"
          identity_type: GROUP
          postgres_role: "Role-Project-LEAP-CoreDev"
          attributes:
            createdb: false
            createrole: false
            bypassrls: false
          membership_roles:
            - DATABRICKS_SUPERUSER
          replace_existing: true
      schemas:
        qualibot_proj_schema:
          catalog_name: ${var.pipeline_write_env}_proj
          name: qualibot
      volumes:
        qualibot_doc_compare:
          catalog_name: ${var.pipeline_write_env}_proj
          schema_name: ${resources.schemas.qualibot_proj_schema.name}
          name: doc_compare
          volume_type: MANAGED
        # Written by the 3_parse task (PARSING_VOLUME_BASE_PATH).
        qualibot_images:
          catalog_name: ${var.pipeline_write_env}_proj
          schema_name: ${resources.schemas.qualibot_proj_schema.name}
          name: images
          volume_type: MANAGED
      apps:
        doc-compare:
          # Declared explicitly: once present, this block is the full desired state, so a deploy cannot reset the live ACL silently.
          permissions:
            - group_name: "Role-Project-LEAP-CoreAdmin"
              level: CAN_MANAGE
            - group_name: "Role-Project-LEAP-CoreDev"
              level: CAN_MANAGE
            - group_name: "Role-Project-LEAP-End-users-Qualibot-DocCompare"
              level: CAN_USE
            - group_name: "Role-Project-LEAP-End-users-Qualibot-ChatBot"
              level: CAN_USE
            - user_name: "jules.gourio.external@latecoere.aero"
              level: CAN_MANAGE
            - service_principal_name: "3e5cd4e5-f765-4760-b974-ee7715258b39"  # job-runner-sa-uat
              level: CAN_MANAGE
          resources:
            - name: doc-compare-volume
              uc_securable:
                securable_type: VOLUME
                securable_full_name: uat_proj.qualibot.doc_compare
                permission: WRITE_VOLUME
    variables:
      app_name: "qualibot"
      pipeline_write_env: uat
      alerts_warehouse_id: "5890912c31867b77"
      parsing_num_workers: "4"
      # Prod sources (refreshed daily), not uat_*: the UAT workspace reads prod_gold through the shared metastore.
      reference_read_env: "prod"
      # UAT's own docling_models volume copy (no nested docling_models/ subfolder, unlike DEV).
      # Real tables, no suffix. Without the parsing state in these tables the daily run reparses the whole
      # corpus on GPU. One index serves the chat and impact search.
      parsing_vector_search_indexes: "uat_proj.qualibot.chunks_index"
      # chunks_full is built, but chunks_full_index is not in parsing_vector_search_indexes, so it is neither created nor synced.
      parsing_build_chunks_full: "true"
      parsing_schedule_pause: "UNPAUSED"
      # Same Lakebase database the deployed qualibot-uat app itself reads/writes
      parsing_lakebase_database: "doccompare"
      job_activity_tag: "uat-job"
      lakebase_export_schedule_pause: "UNPAUSED"
      lakebase_import_to_delta: "true"
      # Legacy Lakebase names of the app before the 2026-10-14 refactor: their copies in uat_proj would be stale.
      lakebase_tables_to_skip: "messages,feedbacks,errors,knowledge_base_metadata"
      job_cluster_policy_id_S: "000E7559CADE5290"
      notification_email: "jules.gourio.external@latecoere.aero"

  prod:
    mode: production
    workspace:
      host: https://dbc-77b87d5a-6bcb.cloud.databricks.com
      # Pinned like uat: keeps the state folder the prod target has always used.
      root_path: /Workspace/.bundle/${bundle.name}/qualibot-prod
    resources:
      postgres_projects:
        qualibot-history:
          project_id: qualibot
          display_name: "Qualibot History"
          # Native Postgres login in addition to Databricks OAuth tokens.
          enable_pg_native_login: true
          default_endpoint_settings:
            # Fixed 1 CU (~2 GB RAM) — no autoscaling (min = max).
            autoscaling_limit_min_cu: 1
            autoscaling_limit_max_cu: 1
            # Scale-to-zero: suspend the compute endpoint after 5 min idle.
            suspend_timeout_duration: "300s"
          lifecycle:
            prevent_destroy: true
          # Full desired state: grants made in the UI and not listed here are removed on the next deploy.
          permissions:
            - group_name: "Role-Project-LEAP-CoreAdmin"
              level: CAN_MANAGE
            - group_name: "Role-Project-LEAP-CoreDev"
              level: CAN_MANAGE
            - group_name: "leap-qualibot-service-accounts"
              level: CAN_MANAGE
            - group_name: "Role-Project-LEAP-End-users-Qualibot-DocCompare"
              level: CAN_USE
            - group_name: "Role-Project-LEAP-End-users-Qualibot-ChatBot"
              level: CAN_USE
      # Database-level Postgres role: map the Databricks group to a Lakebase
      # role and grant it DATABRICKS_SUPERUSER on the `production` branch.
      postgres_roles:
        qualibot-service-accounts:
          role_id: "leap-qualibot-service-accounts"
          parent: "projects/qualibot/branches/production"
          identity_type: GROUP
          postgres_role: "leap-qualibot-service-accounts"
          attributes:
            # All three attributes are required: the API rejects a partial `attributes` object.
            createdb: true
            createrole: false
            bypassrls: false
          membership_roles:
            - DATABRICKS_SUPERUSER
          # Adopt the role if it already exists on the branch instead of failing.
          replace_existing: true
        # The app connects as its own service principal: grant it its own role. The SP client id is referenced from the app resource, so it is right per environment.
        app-service-principal:
          # role_id is a Databricks resource identifier (RFC1123, starts with a letter), not the SP UUID; the SP identity is postgres_role.
          role_id: "app-doc-compare-sp"
          parent: "projects/qualibot/branches/production"
          identity_type: SERVICE_PRINCIPAL
          postgres_role: ${resources.apps.doc-compare.service_principal_client_id}
          attributes:
            createdb: true
            createrole: false
            bypassrls: false
          membership_roles:
            - DATABRICKS_SUPERUSER
          replace_existing: true
          lifecycle:
            prevent_destroy: true
        # CoreDev group: full access through DATABRICKS_SUPERUSER membership.
        coredev:
          role_id: "coredev"
          parent: "projects/qualibot/branches/production"
          identity_type: GROUP
          postgres_role: "Role-Project-LEAP-CoreDev"
          attributes:
            createdb: false
            createrole: false
            bypassrls: false
          membership_roles:
            - DATABRICKS_SUPERUSER
          replace_existing: true
      schemas:
        qualibot_proj_schema:
          catalog_name: ${var.pipeline_write_env}_proj
          name: qualibot
      volumes:
        qualibot_doc_compare:
          catalog_name: ${var.pipeline_write_env}_proj
          schema_name: ${resources.schemas.qualibot_proj_schema.name}
          name: doc_compare
          volume_type: MANAGED
        qualibot_docling_models:
          catalog_name: ${var.pipeline_write_env}_proj
          schema_name: ${resources.schemas.qualibot_proj_schema.name}
          name: docling_models
          volume_type: MANAGED
        # Written by the 3_parse task (PARSING_VOLUME_BASE_PATH). Created by the first deploy on prod_proj.
        qualibot_images:
          catalog_name: ${var.pipeline_write_env}_proj
          schema_name: ${resources.schemas.qualibot_proj_schema.name}
          name: images
          volume_type: MANAGED
      apps:
        doc-compare:
          resources:
            - name: doc-compare-volume
              uc_securable:
                securable_type: VOLUME
                securable_full_name: prod_proj.qualibot.doc_compare
                permission: WRITE_VOLUME
    variables:
      app_name: "qualibot"
      pipeline_write_env: prod
      alerts_warehouse_id: "03054ddc44b7f902"
