            - name: app_name
              default: "qualibot-uat-test"
          tasks:
            - task_key: provision_knowledge_assistant
              notebook_task:
                notebook_path: ./utils/databricks_ops/knowledge_assistant/provision_knowledge_assistant_job.py
                source: WORKSPACE
                base_parameters:
                  KA_PROFILES: "{{job.parameters.ka_profiles}}"
                  CATALOG: "{{job.parameters.catalog}}"
                  SCHEMA: "{{job.parameters.schema_name}}"
                  INDEX_SUFFIX: "{{job.parameters.index_suffix}}"
                  APP_NAME: "{{job.parameters.app_name}}"
              environment_key: default
          environments:
            - environment_key: default
              spec:
                environment_version: "2"
                dependencies:
                  - databricks-sdk>=0.102.0

        sync_user_capabilities_uat_test:
          name: "qualibot-sync-user-capabilities-uat-test"
          description: "Sync user group membership (system.access.audit) -> users.groups/can_chat/can_compare, on doccompare_test. Validation job — see utils/databricks_ops/user_capabilities/sync_user_capabilities_job.py. Point LAKEBASE_DATABASE at doccompare (qualibot-uat target) only once validated end to end."
          max_concurrent_runs: 1
          tags:
            project: Qualibot
          # Live test of job-runner-sa-uat on system.access.audit — known
          # blocker as of 2026-07-23 (missing USE SCHEMA/SELECT there).
          run_as:
            service_principal_name: 3e5cd4e5-f765-4760-b974-ee7715258b39
          permissions:
            - group_name: "Role-Project-LEAP-CoreAdmin"
              level: CAN_MANAGE
            - group_name: "Role-Project-LEAP-CoreDev"
              level: CAN_MANAGE
          tasks:
            # Serverless compute (no new_cluster) — same reasoning as
