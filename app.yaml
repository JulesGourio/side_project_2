command: [
  "bash", "start.sh"
]
env:
  - name: COMPARE_ENABLED
    value: "true"
  - name: CHAT_ENABLED
    value: "true"
  # Translation bridge (server/services/translation_bridge.py, on per target in target_env.json): a question that is neither French nor English
  # is translated to English before the document search, and the answer back.
  - name: CHAT_TRANSLATE_BRIDGE_ENABLED
    value: "false"
  - name: CHAT_TRANSLATE_ENDPOINT
    value: "databricks-gpt-5-6-luna"
  # Tried when CHAT_TRANSLATE_ENDPOINT fails (translation_bridge.py), comma-separated.
  - name: CHAT_TRANSLATE_FALLBACK_ENDPOINTS
    value: "databricks-gpt-6-luna"
  # Past messages replayed to the chat endpoint each turn (the latest question is always kept); 0 = no trimming.
  - name: CHAT_MAX_HISTORY
    value: "10"
  # Chat (server/services/chat_vsi.py, tests and choices: docs/chat_vsi_tests.md): bilingual rewrite, 3 hybrid Vector Search queries,
  # documents named by REF or title, answer by GPT-6 Luna. One index for every division (AS / IS = filter on `division`);
  # per-target index: utils/deploy/target_env.json.
  - name: CHAT_VSI_INDEX
    value: "dev_landingzone.qualibot.chunks_index"
  # No Claude model in the chatbot: GPT-6 Luna answers and rewrites, GPT-5.6 Luna is the fallback of both.
  - name: CHAT_VSI_LLM_ENDPOINT
    value: "databricks-gpt-6-luna"
  # Models tried in order when the answer model fails (429, 5xx, timeout, 404, empty answer), comma-separated.
  # chat_vsi_llm.py also retries, continues a cut answer and caps concurrent answers (CHAT_VSI_MAX_CONCURRENT_ANSWERS).
  - name: CHAT_VSI_LLM_FALLBACK_ENDPOINTS
    value: "databricks-gpt-5-6-luna"
  # Rewrite model (empty = the answer model) and its fallbacks (empty = the answer chain).
  - name: CHAT_VSI_REWRITE_ENDPOINT
    value: "databricks-gpt-6-luna"
  - name: CHAT_VSI_REWRITE_FALLBACK_ENDPOINTS
    value: "databricks-gpt-5-6-luna"
  # Output caps; a reasoning model counts its thinking in them.
  - name: CHAT_VSI_ANSWER_MAX_TOKENS
    value: "8000"
  - name: CHAT_VSI_REWRITE_MAX_TOKENS
    value: "2000"
  # How long can_chat / can_compare stay cached per user; sync_user_capabilities.py changes apply after the next cache miss.
  - name: CAPS_TTL_S
    value: "600"
  # SQL warehouse for the live is_account_group_member() check (server/services/user.py); empty = off, falls back to the Lakebase table.
  # Set per target in utils/deploy/target_env.json.
  - name: CAPS_WAREHOUSE_ID
    value: ""
  # "true" skips the group check: every visitor gets chat + compare. DEV only, via utils/deploy/target_env.json.
  - name: CAPS_BYPASS
    value: "false"
  # Main analysis model (Haiku 4.5 was rejected: quality too low for this pipeline).
  - name: COMPARE_ANALYSIS_ENDPOINT
    value: "databricks-claude-sonnet-4-6"
  - name: COMPARE_ANALYSIS_SYSTEM_PROMPT
    value: "You are a technical document comparison specialist.\n\nYour task: identify changes to CONTENT — numbers, requirements, specifications, normative references, procedures, scope. Ignore everything editorial.\n\nREPORT (these always matter):\n- A number, measurement, tolerance, limit, or threshold that changed\n- A normative reference (standard, spec, regulation) added, removed, or changed in revision\n- A technical requirement or procedure step added, removed, or substantively changed\n- A scope change: new applicability, new conditions, new equipment types, new roles\n- Changed safety or quality requirements, changed approval authorities\n\nDISCARD (never report these):\n- Pure formatting: extra spaces, hyphens, line breaks, capitalisation, punctuation\n- Reference code formatting when the underlying document is identical (\"NAS 410\" vs \"NAS410\" is NOT a change if the same revision is cited)\n- Modal verb substitutions throughout the document (shall/must/will/should/may — if the same requirement is present with different modal verbs, it is not a substantive change)\n- Rewording, restructuring, or synonym substitution that preserves the same technical meaning\n- Terminology rename applied uniformly across the document (e.g. NDI to NDT, inspection to examination, personnel to employees — if the same population is referred to)\n- Document cover page, metadata, revision tables, boilerplate, page numbers, TOC pagination\n\nOUTPUT: Markdown, ## per section, one bullet per real change, bold changed values. If nothing substantive changed: **No significant changes detected.**"
  # Impact search: one Vector Search query per reported change, then one LLM call per candidate document, which judges it from all its
  # retrieved passages and returns every conflicting passage with a verbatim quote (client/src/components/compare/README.md).
  # Per-target index in utils/deploy/target_env.json; the target once built is chunks_full_index (pre-2018 archive included).
  - name: COMPARE_IMPACT_INDEX
    value: "dev_landingzone.qualibot.chunks_index"
  # gpt-5-4-mini matched Claude Sonnet's verdicts on real UAT data and 2 trap candidates, at ~11x lower cost; gemini-3-1-flash-lite gave false positives.
  - name: COMPARE_IMPACT_ENDPOINT
    value: "databricks-gpt-5-6-luna"
  # Up to MAX_QUERIES changes get their own query (the lowest-criticality ones share the last); PER_QUERY_RESULTS hits each (the API caps HYBRID num_results at 200).
  - name: COMPARE_IMPACT_MAX_QUERIES
    value: "30"
  - name: COMPARE_IMPACT_PER_QUERY_RESULTS
    value: "40"
  # Best-ranked documents sent to the judge; lower-ranked ones are dropped.
  - name: COMPARE_IMPACT_MAX_CANDIDATES
    value: "15"
  # Cap on the change list shown to each judge call.
  - name: COMPARE_IMPACT_MAX_QUERY_CHARS
    value: "20000"
  # Per judge call (one document).
  - name: COMPARE_IMPACT_MAX_TOKENS
    value: "1500"
  # Single-document summary ("Summarize" buttons, Compare tab): a cheap model, cached on the file hash (server/services/summarize.py).
  # Images go to a vision endpoint (the one used for image description in the parsing pipeline, PARSING_LLM_ENDPOINT).
  - name: COMPARE_SUMMARY_ENDPOINT
    value: "databricks-gpt-5-6-luna"
  - name: COMPARE_SUMMARY_IMAGE_ENDPOINT
    value: "databricks-gpt-5-6-luna"
  # 300000 chars (~65-75k tokens) leaves room in gpt-5-4-mini's context window for the system prompt and output.
  - name: COMPARE_SUMMARY_MAX_CHARS
    value: "300000"
  - name: COMPARE_SUMMARY_MAX_TOKENS
    value: "800"
  - name: COMPARE_MAX_CONCURRENT
    value: "10"
  - name: MAX_COMPARE_PDF_MB
    value: "20"
  - name: COMPARE_ANALYSIS_TIMEOUT_S
    value: "300"
  - name: COMPARE_ANALYSIS_CONNECT_TIMEOUT_S
    value: "30"
  - name: COMPARE_ANALYSIS_RETRIES
    value: "1"
  - name: COMPARE_MAX_TOKENS
    value: "16000"
  - name: COMPARE_THINKING_BUDGET
    value: "4000"
  - name: COMPARE_TEMPERATURE
    value: "0.0"
  # Map-reduce for very large documents: a diff body above the threshold is split at section boundaries into chunks of at most CHUNK_SIZE chars,
  # one LLM call each, merged into a single stream (a single call skips changes on 100k+ char diffs).
  - name: COMPARE_CHUNK_THRESHOLD_CHARS
    value: "60000"
  - name: COMPARE_CHUNK_SIZE_CHARS
    value: "45000"
  # Default processor version per file type (standard | structured | comparative)
  - name: COMPARE_METHOD_PDF
    value: "standard"
  - name: COMPARE_METHOD_IMAGE
    value: "standard"
  - name: COMPARE_METHOD_DOCX
    value: "standard"
  - name: COMPARE_METHOD_PPTX
    value: "standard"
  - name: COMPARE_METHOD_EXCEL
    value: "standard"
  # Application version — increment to invalidate cached analyses
  - name: APP_VERSION
    value: "1.4.1"
  # Lakebase — comparison history (PostgreSQL)
  - name: LAKEBASE_PROJECT_ID
    value: "qualibot"
  - name: LAKEBASE_DATABASE
    value: "doccompare"
  - name: DATABRICKS_WAREHOUSE_ID
    value: "13eff4a6095513cb"
  # COMPARE_VOLUME_PATH: volume path for saving / restoring comparison files, empty = disabled. Set per environment in the Databricks App UI:
  #   dev : /Volumes/dev_lab/lab_jules/doc_compare
  #   uat : /Volumes/uat_landingzone/qualibot/doc_compare
  #   prod: /Volumes/prod_landingzone/qualibot/doc_compare
  - name: COMPARE_VOLUME_PATH
    value: ""
  # Exact-layout PDF preview (server/services/soffice.py): UC Volume path of a portable LibreOffice tar.gz built by
  # utils/soffice_packaging/package_libreoffice.py, extracted once per app process. Absent = no "Exact (PDF)" mode (docx-preview instead).
  #   uat : /Volumes/uat_landingzone/qualibot/doc_compare/libreoffice/libreoffice-25.8.7-linux-x64-v3.tar.gz
  - name: SOFFICE_ARCHIVE_VOLUME_PATH
    value: ""
  # Local dev: absolute path to an existing soffice binary, takes precedence over the archive.
  - name: SOFFICE_PATH
    value: ""
