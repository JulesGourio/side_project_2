# Bitbucket Pipelines for QualiBOT (latec-compare)
# =============================================================================
# Deploys the Databricks Asset Bundle to DEV, UAT and PROD.
#
# Each step writes ~/.databrickscfg from the secured DATABRICKS_TOKEN variable of its
# Bitbucket deployment environment (dev, uat, production). DATABRICKS_HOST is
# optional: each step carries the default host of its workspace.
#
# The deploy steps call utils/deploy/bitbucket_deploy.sh (one line each): every environment
# has deploy-<env> (bundle + app restart) and deploy-<env>-jobs (bundle only).
#
# Custom pipelines are triggered by hand. A push to main runs the UAT deployment, then
# offers the PROD deployment as a manual step.
# =============================================================================

image: python:3.11-slim

definitions:
  steps:
    # -----------------------------------------------------------------------
    # DEV: target dev, profile job-runner-sa-dev (DEV service principal
    # fde6ff28-739f-4a41-b61e-604a298c8478). Copy of the UAT data in the DEV workspace.
    # -----------------------------------------------------------------------
    - step: &deploy-dev
        name: Deploy bundle to DEV (dev)
        deployment: dev
        clone:
          depth: 1
        script:
          - bash utils/deploy/bitbucket_deploy.sh dev app

    # -----------------------------------------------------------------------
    # DEV jobs and notebooks only: same as deploy-dev, app neither redeployed nor restarted.
    # -----------------------------------------------------------------------
    - step: &deploy-dev-jobs
        name: Deploy jobs and notebooks to DEV, app untouched (dev)
        deployment: dev
        clone:
          depth: 1
        script:
          - bash utils/deploy/bitbucket_deploy.sh dev jobs

    # -----------------------------------------------------------------------
    # DEV, one-off: copy the bundle state from the old root (/Workspace/Shared/.bundle/qualibot/dev)
    # to the new one (/Workspace/.bundle/qualibot/dev). Run as the DEV SP. No --overwrite: a second run
    # refuses to replace the state of a deployment already made from the new root.
    # -----------------------------------------------------------------------
    - step: &migrate-dev-state
        name: One-off, copy DEV bundle state to /Workspace/.bundle (dev)
        deployment: dev
        clone:
          depth: 1
        script:
          - apt-get update -qq && apt-get install -y -qq curl unzip >/dev/null
          - curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/main/install.sh | sh
          - databricks version
          - |
            if [ -z "$DATABRICKS_TOKEN" ]; then
              echo "ERROR: DATABRICKS_TOKEN is missing (Bitbucket environment 'dev')." >&2
              exit 1
            fi
          - |
            cat > "$HOME/.databrickscfg" <<EOF
            [job-runner-sa-dev]
            host  = ${DATABRICKS_HOST:-https://dbc-c623749d-731b.cloud.databricks.com}
            token = ${DATABRICKS_TOKEN}
            EOF
          - chmod 600 "$HOME/.databrickscfg"
          - databricks current-user me -p job-runner-sa-dev
          - databricks workspace export-dir /Workspace/Shared/.bundle/qualibot/dev/state staging/dev-state -p job-runner-sa-dev
          - databricks workspace import-dir staging/dev-state /Workspace/.bundle/qualibot/dev/state -p job-runner-sa-dev
          - databricks workspace list /Workspace/.bundle/qualibot/dev/state -p job-runner-sa-dev

    # -----------------------------------------------------------------------
    # UAT, one-off: copy the bundle state from the old root (/Workspace/Shared/.bundle/qualibot/qualibot-uat)
    # to the new one (/Workspace/.bundle/qualibot/qualibot-uat). Run as the UAT SP, before uat-state-fix,
    # which works on the state of the new root. No --overwrite: a second run refuses to replace the copy.
    # -----------------------------------------------------------------------
    - step: &migrate-uat-state
        name: One-off, copy UAT bundle state to /Workspace/.bundle (uat)
        deployment: uat
        clone:
          depth: 1
        script:
          - bash utils/deploy/bitbucket_deploy.sh uat setup
          - databricks workspace export-dir /Workspace/Shared/.bundle/qualibot/qualibot-uat/state staging/uat-state -p job-runner-sa-uat
          - databricks workspace import-dir staging/uat-state /Workspace/.bundle/qualibot/qualibot-uat/state -p job-runner-sa-uat
          - databricks workspace list /Workspace/.bundle/qualibot/qualibot-uat/state -p job-runner-sa-uat

    # -----------------------------------------------------------------------
    # DEV, read-only: bundle plan against the new root. Expected: no create on the jobs,
    # no delete on the schemas or volumes. Nothing is deployed.
    # -----------------------------------------------------------------------
    - step: &plan-dev
        name: Plan DEV bundle (read-only, dev)
        deployment: dev
        clone:
          depth: 1
        script:
          - apt-get update -qq && apt-get install -y -qq curl unzip >/dev/null
          - curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/main/install.sh | sh
          - databricks version
          - |
            if [ -z "$DATABRICKS_TOKEN" ]; then
              echo "ERROR: DATABRICKS_TOKEN is missing (Bitbucket environment 'dev')." >&2
              exit 1
            fi
          - |
            cat > "$HOME/.databrickscfg" <<EOF
            [job-runner-sa-dev]
            host  = ${DATABRICKS_HOST:-https://dbc-c623749d-731b.cloud.databricks.com}
            token = ${DATABRICKS_TOKEN}
            EOF
          - chmod 600 "$HOME/.databrickscfg"
          - databricks current-user me -p job-runner-sa-dev
          - python3 utils/deploy/render_target_config_env.py dev
          - databricks bundle validate -t dev -p job-runner-sa-dev
          - databricks bundle plan -t dev -p job-runner-sa-dev

    # -----------------------------------------------------------------------
    # UAT, read-only: bundle plan of uat. Nothing is deployed.
    # -----------------------------------------------------------------------
    - step: &plan-uat
        name: Plan UAT bundle (read-only, uat)
        deployment: uat
        clone:
          depth: 1
        script:
          - apt-get update -qq && apt-get install -y -qq curl unzip >/dev/null
          - curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/main/install.sh | sh
          - databricks version
          - |
            if [ -z "$DATABRICKS_TOKEN" ]; then
              echo "ERROR: DATABRICKS_TOKEN is missing (Bitbucket environment 'uat')." >&2
              exit 1
            fi
          - |
            cat > "$HOME/.databrickscfg" <<EOF
            [job-runner-sa-uat]
            host  = ${DATABRICKS_HOST:-https://dbc-3a17bfce-9e88.cloud.databricks.com}
            token = ${DATABRICKS_TOKEN}
            EOF
          - chmod 600 "$HOME/.databrickscfg"
          - databricks current-user me -p job-runner-sa-uat
          - python3 utils/deploy/render_target_config_env.py uat
          - databricks bundle validate -t uat -p job-runner-sa-uat
          - databricks bundle plan -t uat -p job-runner-sa-uat

    # -----------------------------------------------------------------------
    # UAT, one-off: detach the bundle state from the former uat_landingzone objects (nothing is deleted in Databricks)
    # and bind it to the uat_proj volumes. Run plan-uat afterwards.
    # -----------------------------------------------------------------------
    - step: &uat-state-fix
        name: Detach the UAT bundle state from uat_landingzone (uat)
        deployment: uat
        clone:
          depth: 1
        script:
          - apt-get update -qq && apt-get install -y -qq curl unzip >/dev/null
          - curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/main/install.sh | sh
          - databricks version
          - |
            if [ -z "$DATABRICKS_TOKEN" ]; then
              echo "ERROR: DATABRICKS_TOKEN is missing (Bitbucket environment 'uat')." >&2
              exit 1
            fi
          - |
            cat > "$HOME/.databrickscfg" <<EOF
            [job-runner-sa-uat]
            host  = ${DATABRICKS_HOST:-https://dbc-3a17bfce-9e88.cloud.databricks.com}
            token = ${DATABRICKS_TOKEN}
            EOF
          - chmod 600 "$HOME/.databrickscfg"
          - databricks current-user me -p job-runner-sa-uat
          - python3 utils/deploy/render_target_config_env.py uat
          - databricks bundle validate -t uat -p job-runner-sa-uat
          - databricks bundle deployment unbind qualibot_schema -t uat -p job-runner-sa-uat
          - databricks bundle deployment unbind qualibot_test -t uat -p job-runner-sa-uat
          - databricks bundle deployment unbind qualibot_doc_compare -t uat -p job-runner-sa-uat
          - databricks bundle deployment unbind qualibot_images -t uat -p job-runner-sa-uat
          - databricks bundle deployment bind qualibot_doc_compare uat_proj.qualibot.doc_compare -t uat -p job-runner-sa-uat --auto-approve
          - databricks bundle deployment bind qualibot_images uat_proj.qualibot.images -t uat -p job-runner-sa-uat --auto-approve

    # -----------------------------------------------------------------------
    # DEV, one-off: detach the test volume from the bundle state. Nothing is deleted
    # in Databricks; the volume and its files stay. Run plan-dev afterwards.
    # -----------------------------------------------------------------------
    - step: &unbind-dev-test-volume
        name: Detach qualibot_test from the DEV bundle state (dev)
        deployment: dev
        clone:
          depth: 1
        script:
          - apt-get update -qq && apt-get install -y -qq curl unzip >/dev/null
          - curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/main/install.sh | sh
          - databricks version
          - |
            if [ -z "$DATABRICKS_TOKEN" ]; then
              echo "ERROR: DATABRICKS_TOKEN is missing (Bitbucket environment 'dev')." >&2
              exit 1
            fi
          - |
            cat > "$HOME/.databrickscfg" <<EOF
            [job-runner-sa-dev]
            host  = ${DATABRICKS_HOST:-https://dbc-c623749d-731b.cloud.databricks.com}
            token = ${DATABRICKS_TOKEN}
            EOF
          - chmod 600 "$HOME/.databrickscfg"
          - databricks current-user me -p job-runner-sa-dev
          - python3 utils/deploy/render_target_config_env.py dev
          - databricks bundle validate -t dev -p job-runner-sa-dev
          - databricks bundle deployment unbind qualibot_test -t dev -p job-runner-sa-dev

    # -----------------------------------------------------------------------
    # UAT, one-off: record the existing Lakebase project in the bundle state of the new root (the schema, the volumes
    # and the app are already bound). State only: nothing changes in Databricks. Run plan-uat afterwards.
    # -----------------------------------------------------------------------
    - step: &bind-uat-lakebase
        name: Bind the existing UAT Lakebase project to the bundle state (uat)
        deployment: uat
        clone:
          depth: 1
        script:
          - bash utils/deploy/bitbucket_deploy.sh uat setup
          - python3 utils/deploy/render_target_config_env.py uat
          - databricks bundle validate -t uat -p job-runner-sa-uat
          - databricks bundle deployment bind qualibot-history projects/qualibot -t uat -p job-runner-sa-uat --auto-approve

    # -----------------------------------------------------------------------
    # UAT: target uat, profile job-runner-sa-uat.
    # -----------------------------------------------------------------------
    - step: &deploy-uat
        name: Deploy bundle to UAT (uat)
        deployment: uat
        clone:
          depth: 1
        script:
          - bash utils/deploy/bitbucket_deploy.sh uat app

    # -----------------------------------------------------------------------
    # UAT jobs and notebooks only: same as deploy-uat, app neither redeployed nor restarted.
    # -----------------------------------------------------------------------
    - step: &deploy-uat-jobs
        name: Deploy jobs and notebooks to UAT, app untouched (uat)
        deployment: uat
        clone:
          depth: 1
        script:
          - bash utils/deploy/bitbucket_deploy.sh uat jobs

    # -----------------------------------------------------------------------
    # PROD: target prod, profile job-runner-sa-prod.
    # -----------------------------------------------------------------------
    - step: &deploy-prod
        name: Deploy bundle to PROD (prod)
        deployment: production
        clone:
          depth: 1
        script:
          - bash utils/deploy/bitbucket_deploy.sh prod app

    # -----------------------------------------------------------------------
    # PROD jobs and notebooks only: same as deploy-prod, app neither redeployed nor restarted.
    # -----------------------------------------------------------------------
    - step: &deploy-prod-jobs
        name: Deploy jobs and notebooks to PROD, app untouched (prod)
        deployment: production
        clone:
          depth: 1
        script:
          - bash utils/deploy/bitbucket_deploy.sh prod jobs

    # -----------------------------------------------------------------------
    # Copies the docling models volume and the Lakebase data from UAT to PROD, in two steps.
    # Staging files pass between the steps as pipeline artifacts.
    # -----------------------------------------------------------------------
    - step: &export-from-uat
        name: "Sync prod data (1/2): export from UAT"
        deployment: uat
        clone:
          depth: 1
        script:
          - apt-get update -qq && apt-get install -y -qq curl unzip >/dev/null
          - curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/main/install.sh | sh
          - pip install -q psycopg2-binary databricks-sdk
          - |
            if [ -z "$DATABRICKS_TOKEN" ]; then
              echo "ERREUR: variable DATABRICKS_TOKEN absente (environnement Bitbucket 'UAT')." >&2
              exit 1
            fi
          - |
            cat > "$HOME/.databrickscfg" <<EOF
            [job-runner-sa-uat]
            host  = ${DATABRICKS_HOST:-https://dbc-3a17bfce-9e88.cloud.databricks.com}
            token = ${DATABRICKS_TOKEN}
            EOF
          - chmod 600 "$HOME/.databrickscfg"
          - databricks fs cp -r dbfs:/Volumes/uat_proj/qualibot/docling_models staging/docling_models --profile job-runner-sa-uat
          - python3 utils/lakebase_sync/export_lakebase_to_json.py --profile job-runner-sa-uat --out-dir staging/lakebase
        artifacts:
          - staging/**

    - step: &import-to-prod
        name: "Sync prod data (2/2): import to PROD"
        deployment: production
        clone:
          depth: 1
        script:
          - apt-get update -qq && apt-get install -y -qq curl unzip >/dev/null
          - curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/main/install.sh | sh
          - pip install -q psycopg2-binary databricks-sdk
          - |
            if [ -z "$DATABRICKS_TOKEN" ]; then
              echo "ERREUR: variable DATABRICKS_TOKEN absente (environnement Bitbucket 'Production')." >&2
              exit 1
            fi
          - |
            cat > "$HOME/.databrickscfg" <<EOF
            [job-runner-sa-prod]
            host  = ${DATABRICKS_HOST:-https://dbc-77b87d5a-6bcb.cloud.databricks.com}
            token = ${DATABRICKS_TOKEN}
            EOF
          - chmod 600 "$HOME/.databrickscfg"
          - databricks fs cp -r staging/docling_models dbfs:/Volumes/prod_proj/qualibot/docling_models --overwrite --profile job-runner-sa-prod
          - python3 utils/lakebase_sync/import_lakebase_from_json.py --profile job-runner-sa-prod --in-dir staging/lakebase

pipelines:
  # Manual triggers (UAT first, then PROD).
  custom:
    deploy-dev:
      - step: *deploy-dev
    deploy-dev-jobs:
      - step: *deploy-dev-jobs
    migrate-dev-state:
      - step: *migrate-dev-state
    migrate-uat-state:
      - step: *migrate-uat-state
    plan-dev:
      - step: *plan-dev
    plan-uat:
      - step: *plan-uat
    uat-state-fix:
      - step: *uat-state-fix
    bind-uat-lakebase:
      - step: *bind-uat-lakebase
    unbind-dev-test-volume:
      - step: *unbind-dev-test-volume
    deploy-uat:
      - step: *deploy-uat
    deploy-uat-jobs:
      - step: *deploy-uat-jobs
    deploy-prod:
      - step: *deploy-prod
    deploy-prod-jobs:
      - step: *deploy-prod-jobs
    sync-prod-data:
      - step: *export-from-uat
      - step: *import-to-prod

  # Disabled: a push to main does nothing for now. Re-enable (uncomment) when the main-branch deploy is decided.
#   # Runs on every push to main: steps run in order, and a failing step stops the rest
#   # (PROD does not start if UAT failed).
#   branches:
#     main:
#       # Automatic: deploys UAT on every push to main.
#       - step: *deploy-uat
#       # Manual: available once UAT is green; it is the gate between UAT and PROD. A manual step
#       # cannot come first in a pipeline, hence the automatic UAT step before it.
#       - step:
#           <<: *deploy-prod
#           trigger: manual
