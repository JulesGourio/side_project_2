# Parsing Pipeline Job — Qualibot RAG
#
# Daily chain, on separate clusters (perf/cost):
#   0. 1_categories : freshness guard + category_reference -> small CPU
#   1. 2_manifest    : scope + parse_manifest                -> small CPU (same cluster)
#   2. 3_parse       : Docling parsing + chunking             -> GPU cluster (g4dn) — ~2.65x/PDF
#   3. 02_images      : Vision LLM image description           -> small CPU (I/O-bound,
#                       rate-limiter-bound; a GPU would be wasted here)
#   4. 5_sync_index  : Vector Search index sync                -> serverless
#   5. 6_update_kb_metadata : Lakebase knowledge_base_metadata  -> serverless
#                       (documents_as_of/updated_at) bump, once the whole
#                       chain — including the index sync above — succeeded
#
# 00b/00 run on their own cluster (meta_cpu_cluster), not 02's: a cluster
# shared between a start task and an end task would stay up through the whole
# GPU parse for nothing.
#
# Without 03, new chunks stay in the Delta tables and are never queryable
# (Delta Sync indexes are pipeline_type=TRIGGERED) — the whole chain would run
# with no visible effect on chat.
#
# Variables (databricks.yml, per target):
#   parsing_gpu_node_type / parsing_describe_node_type / parsing_num_workers
#   parsing_vector_search_indexes / parsing_schedule_cron / parsing_schedule_pause
#   parsing_lakebase_database
#   PARSING_* : catalog/volumes/run_mode (spark_env_vars below)
#
# Defined per-target below (not under a bundle-wide `resources:` block) so
# qualibot-uat-test never gets its own copy — that app is chat-only, it
# doesn't do document comparison and has no use for a parsing pipeline.
# `dev` carries the shared body under a YAML anchor; `qualibot-uat` and
# `qualibot-prod` merge it in via `<<: *parsing_pipeline_body` so the three
# targets that DO need this job stay byte-identical without hand-copying
# ~200 lines three times.

targets:
  dev:
    resources:
      jobs:
        parsing_pipeline: &parsing_pipeline_body
          # D_1 prefix: org-wide job-naming convention for the shared UAT/PROD
          # workspaces (D_<n>=daily, matching e.g. D_0_intraqual_documents_sync)
          # — see the databricks-job-conventions skill.
          name: "D_1_qualibot-parsing-pipeline-${bundle.target}"
          description: "Docling parsing (GPU) + LLM image description pipeline for Qualibot RAG"

          # Default is 1: a partial run selecting only "3_parse" queues behind a
          # partial run of "4_describe_images" instead of running concurrently,
          # even though they use separate clusters and (in incremental mode)
          # disjoint IDDOC scopes. Raised to allow deliberately running both
          # (or 02's own repair/retry cycles) at once — confirmed 2026-07-03.
          max_concurrent_runs: 3

          tags:
            project: Qualibot
            activity-type: ${var.parsing_job_activity_tag}
            ingestion-system: intraqual_ingestion
            job-purpose: documents-parsing

          permissions:
            - group_name: "Role-Project-LEAP-CoreAdmin"
              level: CAN_MANAGE
            - group_name: "Role-Project-LEAP-CoreDev"
              level: CAN_MANAGE

          job_clusters:
            # No policy_id on any of the 3 clusters: the org's 6 "Job Compute *"
            # policies all force aws_attributes.availability=SPOT_WITH_FALLBACK
            # (hidden), which would reintroduce the spot-driver-reclaim risk
            # already fixed on parse_gpu_cluster (see first_on_demand below) on
            # these single-node ON_DEMAND clusters. None of them allow a GPU-ML
            # spark_version either. Exception accepted — see the
            # databricks-job-conventions skill for details.
            #
            # ── Small CPU cluster for the metadata tasks (00b, 00) ────────────────
            # Pure Delta/SQL work + one dbutils.fs.ls on the volume: no GPU or
            # workers needed. Finishes before the GPU cluster starts.
            - job_cluster_key: meta_cpu_cluster
              new_cluster:
                spark_version: "17.3.x-scala2.13"
                node_type_id: ${var.parsing_describe_node_type}
                num_workers: 0
                # See README.md#uc-not-enabled-single-user — without this, table reads fail with [UC_NOT_ENABLED].
                data_security_mode: SINGLE_USER
                aws_attributes:
                  availability: ON_DEMAND
                spark_conf:
                  spark.databricks.cluster.profile: singleNode
                  spark.master: "local[*]"
                custom_tags:
                  ResourceClass: SingleNode
                spark_env_vars:
                  PARSING_CATALOG_SCHEMA:   ${var.app_write_catalog}.${var.app_write_schema}
                  PARSING_INTRAQUAL_SOURCE: ${var.intraqual_source_catalog_schema}
                  PARSING_INTRAQUAL_BRONZE: ${var.intraqual_bronze_catalog_schema}
                  PARSING_INTRAQUAL_SUFFIX: ${var.intraqual_suffix}
                  PARSING_VOLUME_ROOT_PATH: ${var.intraqual_volume_root}
                  PARSING_VOLUME_BASE_PATH: /Volumes/${var.app_write_catalog}/${var.app_write_schema}/images
                  PARSING_OFFLINE_MODELS:   ${var.parsing_offline_models_path}
                  PARSING_TABLE_SUFFIX:     ${var.parsing_table_suffix}
                  PARSING_MAX_SOURCE_STALENESS_HOURS: ${var.parsing_max_source_staleness_hours}
                  PARSING_USE_GPU:          "false"

            # ── GPU cluster for Docling parsing (task 01) ─────────────────────────
            - job_cluster_key: parse_gpu_cluster
              new_cluster:
                spark_version: "17.3.x-gpu-ml-scala2.13"
                node_type_id: ${var.parsing_gpu_node_type}
                num_workers: ${var.parsing_num_workers}
                data_security_mode: SINGLE_USER   # already the effective state, made explicit
                aws_attributes:
                  # See README.md#spot-driver-reclaim — a reclaimed spot driver killed a run, pinned on-demand.
                  first_on_demand: 1
                  availability: SPOT_WITH_FALLBACK
                  ebs_volume_count: 1
                  ebs_volume_size: 100
                  ebs_volume_type: GENERAL_PURPOSE_SSD
                spark_conf:
                  # See README.md#gpu-task-executor-contention — 16 Spark tasks were fighting over 1 GPU.
                  spark.executor.resource.gpu.amount: "1"
                  spark.task.resource.gpu.amount: "1"
                  spark.databricks.delta.optimizeWrite.enabled: "true"
                  spark.databricks.delta.autoCompact.enabled: "true"
                spark_env_vars:
                  PARSING_CATALOG_SCHEMA:   ${var.app_write_catalog}.${var.app_write_schema}
                  PARSING_INTRAQUAL_SOURCE: ${var.intraqual_source_catalog_schema}
                  PARSING_INTRAQUAL_BRONZE: ${var.intraqual_bronze_catalog_schema}
                  PARSING_INTRAQUAL_SUFFIX: ${var.intraqual_suffix}
                  PARSING_VOLUME_ROOT_PATH: ${var.intraqual_volume_root}
                  PARSING_VOLUME_BASE_PATH: /Volumes/${var.app_write_catalog}/${var.app_write_schema}/images
                  PARSING_OFFLINE_MODELS:   ${var.parsing_offline_models_path}
                  PARSING_RUN_MODE:         ${var.parsing_run_mode}
                  PARSING_PARSE_FILTER:     ${var.parsing_parse_filter}
                  PARSING_TABLE_SUFFIX:     ${var.parsing_table_suffix}
                  PARSING_USE_GPU:          "true"
                  # See README.md#opencv-python-headless-crash — belt-and-suspenders, set before the interpreter starts.
                  USE_TF:                 "0"
                  TRANSFORMERS_NO_TF:     "1"
                  TF_CPP_MIN_LOG_LEVEL:   "3"
                  CUDA_MODULE_LOADING:    "LAZY"
                  HF_HUB_OFFLINE:         "1"
                  TRANSFORMERS_OFFLINE:   "1"
                  HF_HUB_DISABLE_TELEMETRY: "1"
                  # See README.md#pythonpath-worker-daemon-revert — do not set a static PYTHONPATH here.

            # ── Small CPU cluster for LLM description (task 02, I/O-bound) ────────
            - job_cluster_key: describe_cpu_cluster
              new_cluster:
                spark_version: "17.3.x-scala2.13"
                node_type_id: ${var.parsing_describe_node_type}
                num_workers: 0
                data_security_mode: SINGLE_USER   # already the effective state, made explicit
                aws_attributes:
                  # Single-node cluster: the driver IS the only node, so it must not be spot.
                  availability: ON_DEMAND
                spark_conf:
                  spark.databricks.cluster.profile: singleNode
                  spark.master: "local[*]"
                custom_tags:
                  ResourceClass: SingleNode
                spark_env_vars:
                  PARSING_CATALOG_SCHEMA:   ${var.app_write_catalog}.${var.app_write_schema}
                  PARSING_INTRAQUAL_SOURCE: ${var.intraqual_source_catalog_schema}
                  PARSING_INTRAQUAL_BRONZE: ${var.intraqual_bronze_catalog_schema}
                  PARSING_INTRAQUAL_SUFFIX: ${var.intraqual_suffix}
                  PARSING_VOLUME_ROOT_PATH: ${var.intraqual_volume_root}
                  PARSING_VOLUME_BASE_PATH: /Volumes/${var.app_write_catalog}/${var.app_write_schema}/images
                  PARSING_OFFLINE_MODELS:   ${var.parsing_offline_models_path}
                  PARSING_RUN_MODE:         ${var.parsing_run_mode}
                  PARSING_TABLE_SUFFIX:     ${var.parsing_table_suffix}
                  PARSING_USE_GPU:          "false"

          tasks:
            - task_key: "1_categories"
              description: "Intraqual source freshness guard + build category_reference"
              job_cluster_key: meta_cpu_cluster
              notebook_task:
                notebook_path: ../utils/parsing_pipeline/1_Build_Category_Reference.py
                source: WORKSPACE

            - task_key: "2_manifest"
              description: "Qualibot scope -> processed_files exclusions + parse_manifest"
              depends_on:
                - task_key: "1_categories"
              job_cluster_key: meta_cpu_cluster
              notebook_task:
                notebook_path: ../utils/parsing_pipeline/2_Cleanup_Volume.py
                source: WORKSPACE
                base_parameters:
                  # DRY_RUN=oui is mandatory on a scheduled run: scope depends on
                  # courant/etat, which change on every revision. Deleting files for
                  # a momentarily out-of-scope document would need a full volume resync.
                  DRY_RUN: "oui"
                  JOB_RUN_ID: "{{job.run_id}}"
              libraries:
                - pypi: {package: "tiktoken"}

            - task_key: "3_parse"
              description: "Docling parsing, chunking, image extraction (GPU)"
              depends_on:
                - task_key: "2_manifest"
              job_cluster_key: parse_gpu_cluster
              notebook_task:
                notebook_path: ../utils/parsing_pipeline/3_Parse_Pipeline_v2.py
                source: WORKSPACE
                base_parameters:
                  JOB_RUN_ID: "{{job.run_id}}"
              libraries:
                - pypi: {package: "numpy<2"}
                - pypi: {package: "docling"}
                - pypi: {package: "docling-core"}
                - pypi: {package: "langchain-text-splitters"}
                - pypi: {package: "tiktoken"}
                - pypi: {package: "striprtf"}
                - pypi: {package: "odfpy"}
                - pypi: {package: "xlrd"}
                - pypi: {package: "openpyxl"}
                - pypi: {package: "lxml"}
                - pypi: {package: "olefile"}
                - pypi: {package: "pyxlsb"}
                - pypi: {package: "openai"}
                - pypi: {package: "tenacity"}
                # See README.md#opencv-python-headless-crash — do not add opencv-python-headless
                # as a library here; the fix is the %pip cell in 3_Parse_Pipeline_v2.py.

            - task_key: "4_describe_images"
              description: "Vision LLM image descriptions + image chunks injection (CPU, rate-limited)"
              depends_on:
                - task_key: "3_parse"
              job_cluster_key: describe_cpu_cluster
              notebook_task:
                notebook_path: ../utils/parsing_pipeline/4_Describe_Images_LLM_v2.py
                source: WORKSPACE
              libraries:
                - pypi: {package: "openai"}
                - pypi: {package: "tenacity"}
                - pypi: {package: "nest_asyncio"}

            - task_key: "5_sync_index"
              description: "Sync Vector Search indexes on the rewritten chunk tables (creating one first if it doesn't exist yet)"
              depends_on:
                - task_key: "4_describe_images"
              notebook_task:
                notebook_path: ../utils/parsing_pipeline/5_Sync_Vector_Indexes.py
                source: WORKSPACE
                base_parameters:
                  indexes: ${var.parsing_vector_search_indexes}
                  wait_minutes: "45"
                  # Only used if one of `indexes` doesn't exist yet and needs creating.
                  vector_search_endpoint: "qualibot"
                  embedding_model: "databricks-qwen3-embedding-0-6b"
                  catalog_schema: ${var.app_write_catalog}.${var.app_write_schema}
                  table_suffix: ${var.parsing_table_suffix}
              # Serverless: plain SDK calls, no Spark needed. run_as (the target's
              # owning SP) already has whatever grant creating a new index needs.
              environment_key: default

            - task_key: "6_update_kb_metadata"
              description: "Bump knowledge_base_metadata.documents_as_of/updated_at (Lakebase) now the chain succeeded end to end"
              depends_on:
                - task_key: "5_sync_index"
              notebook_task:
                notebook_path: ../utils/parsing_pipeline/6_Update_Knowledge_Base_Metadata.py
                source: WORKSPACE
                base_parameters:
                  LAKEBASE_PROJECT_ID: "qualibot"
                  LAKEBASE_BRANCH: "production"
                  LAKEBASE_ENDPOINT: "primary"
                  LAKEBASE_DATABASE: ${var.parsing_lakebase_database}
              # Serverless: classic job compute can't reach the Lakebase private
              # endpoint (same blocker as migrate_lakebase_uat_test/sync_user_capabilities_uat
              # in databricks.yml) — separate environment from "default" above,
              # psycopg2 isn't needed by 5_sync_index.
              environment_key: lakebase_env

          environments:
            - environment_key: default
              spec:
                environment_version: "2"
                dependencies:
                  - databricks-sdk>=0.118.0
            - environment_key: lakebase_env
              spec:
                environment_version: "2"
                dependencies:
                  - psycopg2-binary
                  - databricks-sdk>=0.118.0

          # Daily run. Scheduled at night on purpose: upstream Intraqual ingestion
          # is file-arrival-triggered and lands during the day (observed ~11h/13h),
          # so a nightly run has several hours of margin on that day's drop — and
          # 00b fails explicitly if sources are older than
          # `parsing_max_source_staleness_hours`.
          schedule:
            quartz_cron_expression: ${var.parsing_schedule_cron}
            timezone_id: "Europe/Paris"
            pause_status: ${var.parsing_schedule_pause}

  qualibot-uat:
    resources:
      jobs:
        parsing_pipeline:
          <<: *parsing_pipeline_body
          # run_as job-runner-sa-uat: confirmed working end to end by the
          # daily schedule itself — all 7 tasks succeed, including
          # 6_update_kb_metadata's Lakebase write to doccompare.
          run_as:
            service_principal_name: 3e5cd4e5-f765-4760-b974-ee7715258b39

  qualibot-prod:
    resources:
      jobs:
        parsing_pipeline:
          <<: *parsing_pipeline_body
          # run_as job-runner-sa-prod (b82d3b5a-b633-4738-8dde-68bb2142cb02) —
          # confirmed working end to end: recent scheduled runs complete all 6
          # tasks as SUCCESS, including 1_categories' read from
          # prod_bronze.intraqual/prod_landingzone.intraqual.
          run_as:
            service_principal_name: b82d3b5a-b633-4738-8dde-68bb2142cb02
