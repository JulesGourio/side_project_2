# Rehearsal of the UAT switch to the new chatbot on qualibot-uat-test (see databricks.yml).
# Manual trigger. Creates the pipeline volume and deep-clones the parsing state tables of the running UAT
# (uat_proj.qualibot.*_v1, read only) into uat_proj.qualibot with the `_test` suffix, so the first
# parsing run re-chunks from the checkpoint instead of reparsing the corpus on GPU. Run as job-runner-sa-uat:
# the SP owns everything it creates. An existing table is kept unless the overwrite parameter is "true".

targets:
  qualibot-uat-test:
    resources:
      jobs:
        setup_proj_schema:
          name: "Z_4_Qualibot_Setup_Proj_Schema_${bundle.target}"
          description: "Create the pipeline volume and clone the parsing state tables into uat_proj.qualibot (_test suffix). Manual trigger only."
          max_concurrent_runs: 1
          tags:
            project: Qualibot
          run_as:
            service_principal_name: 3e5cd4e5-f765-4760-b974-ee7715258b39
          permissions:
            - group_name: "Role-Project-LEAP-CoreAdmin"
              level: CAN_MANAGE
            - group_name: "Role-Project-LEAP-CoreDev"
              level: CAN_MANAGE
          parameters:
            - name: overwrite
              default: "false"
          tasks:
            - task_key: setup_proj_schema
              notebook_task:
                notebook_path: ../utils/uat_setup/setup_proj_schema.py
                source: WORKSPACE
                base_parameters:
                  target_catalog_schema: ${var.app_proj_catalog}.${var.app_proj_schema}
                  target_suffix: ${var.parsing_table_suffix}
                  source_catalog_schema: "uat_landingzone.qualibot"
                  source_suffix: "_v1"
                  tables: "_pipeline_checkpoint,processed_files,image_metadata,parse_manifest,category_reference"
                  volumes: ${var.parsing_images_volume}
                  reader_groups: "Role-Project-LEAP-CoreAdmin,Role-Project-LEAP-CoreDev"
                  overwrite: "{{job.parameters.overwrite}}"
              environment_key: default
          environments:
            - environment_key: default
              spec:
                environment_version: "2"
