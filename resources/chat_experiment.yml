# Creates the MLflow experiment of the live chat traces (server/services/chat/mlflow_turns.py), owned by the job service principal
# instead of the person who runs the script. Manual trigger; idempotent (an existing experiment is left as is, permissions re-applied).
# Steps: operations_dev.md block Y.

targets:
  dev:
    resources:
      jobs:
        create_chat_experiment_dev:
          name: "Z_2_Qualibot_Create_Chat_Experiment_${bundle.target}"
          description: "Create /Shared/qualibot/chat_turns owned by the DEV job SP; the DEV app SP can edit it. Manual trigger only."
          max_concurrent_runs: 1
          tags:
            project: Qualibot
          run_as:
            service_principal_name: fde6ff28-739f-4a41-b61e-604a298c8478
          permissions:
            - group_name: "Role-Project-LEAP-CoreAdmin"
              level: CAN_MANAGE
            - group_name: "Role-Project-LEAP-CoreDev"
              level: CAN_MANAGE
            - service_principal_name: "fde6ff28-739f-4a41-b61e-604a298c8478"
              level: CAN_MANAGE
            - user_name: "mehdi.lamrani@databricks.com"
              level: CAN_MANAGE
          tasks:
            - task_key: create_chat_experiment
              spark_python_task:
                python_file: ../utils/evaluation/create_chat_experiment.py
                source: WORKSPACE
                parameters:
                  - "--app"
                  - "qualibot"
                  - "--experiment"
                  - "/Shared/qualibot/chat_turns"
                  - "--managers"
                  - "Role-Project-LEAP-CoreAdmin,Role-Project-LEAP-CoreDev"
              environment_key: default
          environments:
            - environment_key: default
              spec:
                environment_version: "2"
                dependencies:
                  - mlflow[databricks]>=3.1
                  - databricks-sdk>=0.118.0
