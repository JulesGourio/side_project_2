# Manual grant jobs.
# Declared per target: each job exists only on the targets listed below.

targets:
  dev:
    resources:
      jobs:

        # Manual trigger. Grants the DEV app SP what it uses (catalog and schema usage, volumes, indexes, serving endpoints),
        # and the DEV SP itself SELECT + MODIFY on `pipeline_tables`. Edit the lists in base_parameters, deploy, run;
        # re-run after recreating an index, a table or the app.
        grant_app_access_dev:
          name: "Z_1_Qualibot_Grant_App_Access_${bundle.target}"
          description: "Grant the DEV qualibot app SP its volumes, indexes and LLM endpoints, and the DEV job SP the pipeline tables. Manual trigger only."
          max_concurrent_runs: 1
          tags:
            project: Qualibot
          run_as:
            service_principal_name: fde6ff28-739f-4a41-b61e-604a298c8478
          permissions:
            - group_name: "Role-Project-LEAP-CoreAdmin"
              level: CAN_MANAGE
            - group_name: "Role-Project-LEAP-CoreDev"
              level: CAN_MANAGE
            - service_principal_name: "fde6ff28-739f-4a41-b61e-604a298c8478"  # DEV job SP — lets the Bitbucket deploy (run as this SP) update jobs a human created
              level: CAN_MANAGE
            - user_name: "mehdi.lamrani@databricks.com"  # developer on the DEV copy
              level: CAN_MANAGE
          parameters:
            - name: app_service_principal
              default: "8e411164-a7e8-46ff-8013-8c56af2c3656"
          tasks:
            - task_key: grant_app_access
              notebook_task:
                notebook_path: ../utils/grants/grant_app_access.py
                source: WORKSPACE
                base_parameters:
                  app_service_principal: "{{job.parameters.app_service_principal}}"
                  catalog: ${var.app_write_catalog}
                  schema_name: ${var.app_write_schema}
                  volumes: "doc_compare,test"
                  indexes: "chunks_index"
                  serving_endpoints: "databricks-claude-sonnet-4-6,databricks-gpt-5-6-luna,databricks-gpt-6-luna"
                  # The DEV SP itself (this job's run_as), on the tables a person created.
                  pipeline_service_principal: fde6ff28-739f-4a41-b61e-604a298c8478
                  pipeline_tables: "_pipeline_checkpoint,processed_files,image_metadata,parse_manifest,category_reference,chunks"
              environment_key: default
          environments:
            - environment_key: default
              spec:
                environment_version: "2"
                dependencies:
                  - databricks-sdk>=0.118.0
  qualibot-uat-test:
    resources:
      jobs:
        # No parsing_pipeline job here: it is declared per target in resources/parsing_pipeline.job.yml.

        # One-off admin utility, manual trigger, outside the daily chain.
        # run_as job-runner-sa-uat can grant on uat_landingzone but not on prod_landingzone.intraqual: run it as the deploying user there.
        # It grants one specific SP. The `account users` USE CATALOG failure of `bundle deploy` needs a governance decision (CLAUDE.md).
        grant_volume_access:
          name: "Z_1_Qualibot_Grant_Volume_Access_${bundle.target}"
          description: "Grants USE CATALOG + USE SCHEMA + READ/WRITE VOLUME on a volume to a service principal. Manual trigger only."
          max_concurrent_runs: 1
          tags:
            project: Qualibot
          run_as:
            service_principal_name: 3e5cd4e5-f765-4760-b974-ee7715258b39
          parameters:
            - name: service_principal
              default: "3e5cd4e5-f765-4760-b974-ee7715258b39"
            - name: catalog
              default: "prod_landingzone"
            - name: schema_name
              default: "intraqual"
            - name: volume_name
              default: "intraqual_documents"
            - name: volume_permission
              default: "READ VOLUME"
          tasks:
            - task_key: grant
              notebook_task:
                notebook_path: ../utils/grants/grant_volume_access_job.py
                source: WORKSPACE
                base_parameters:
                  service_principal: "{{job.parameters.service_principal}}"
                  catalog: "{{job.parameters.catalog}}"
                  schema_name: "{{job.parameters.schema_name}}"
                  volume_name: "{{job.parameters.volume_name}}"
                  volume_permission: "{{job.parameters.volume_permission}}"
              environment_key: default
          environments:
            - environment_key: default
              spec:
                environment_version: "2"
