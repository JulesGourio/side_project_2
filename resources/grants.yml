# Manual grant jobs.
# Declared per target: each job exists only on the targets listed below.

targets:
  dev:
    resources:
      jobs:

        # Manual trigger. Grants the DEV app SP what it uses (catalog and schema usage, volumes, index),
        # and the DEV SP itself SELECT + MODIFY on `pipeline_tables`. LLM endpoints are never granted: every workspace user can already query them.
        grant_app_access_dev:
          name: "Z_1_Qualibot_Grant_App_Access_${bundle.target}"
          queue:
            enabled: true
          email_notifications:
            on_failure:
              - ${var.notification_email}
          notification_settings:
            no_alert_for_canceled_runs: true
          description: "Grant the DEV qualibot app SP its volumes and index, and the DEV job SP the pipeline tables. Manual trigger only."
          max_concurrent_runs: 1
          tags:
            activity-type: ${var.job_activity_tag}
            job-purpose: platform
            project-name: qualibot
            project: Qualibot
          run_as:
            service_principal_name: fde6ff28-739f-4a41-b61e-604a298c8478
          permissions:
            - group_name: "Role-Project-LEAP-CoreAdmin"
              level: CAN_MANAGE
            - group_name: "Role-Project-LEAP-CoreDev"
              level: CAN_MANAGE
            - service_principal_name: "fde6ff28-739f-4a41-b61e-604a298c8478"  # DEV job SP: the deploy runs as this SP, which updates jobs created by a person
              level: CAN_MANAGE
            - user_name: "mehdi.lamrani@databricks.com"  # developer on the DEV copy
              level: CAN_MANAGE
          parameters:
            - name: app_service_principal
              default: "8e411164-a7e8-46ff-8013-8c56af2c3656"
          tasks:
            - task_key: grant_app_access
              notebook_task:
                notebook_path: ../utils/grants/grant_app_access.py
                source: WORKSPACE
                base_parameters:
                  app_service_principal: "{{job.parameters.app_service_principal}}"
                  catalog: ${var.app_proj_catalog}
                  schema_name: ${var.app_proj_schema}
                  proj_catalog: ${var.app_proj_catalog}
                  proj_schema: ${var.app_proj_schema}
                  volumes: "doc_compare,test"
                  indexes: "chunks_index"
                  # The DEV SP itself (this job's run_as), on the tables a person created.
                  pipeline_service_principal: fde6ff28-739f-4a41-b61e-604a298c8478
                  pipeline_tables: "parsing_checkpoint,parsed_documents,image_metadata,parse_manifest,category_reference,chunks"
              environment_key: default
          environments:
            - environment_key: default
              spec:
                environment_version: "2"
                dependencies:
                  - databricks-sdk>=0.118.0
  qualibot-uat-test:
    resources:
      jobs:
        # Manual trigger. Grants the qualibot-uat-test app SP USE CATALOG / USE SCHEMA on uat_proj.qualibot, SELECT on its
        # index in uat_proj.qualibot. Runs as job-runner-sa-uat, owner of uat_proj.qualibot.
        grant_app_access_uat_test:
          name: "Z_1_Qualibot_Grant_App_Access_${bundle.target}"
          queue:
            enabled: true
          email_notifications:
            on_failure:
              - ${var.notification_email}
          notification_settings:
            no_alert_for_canceled_runs: true
          description: "Grant the qualibot-uat-test app SP its index in uat_proj.qualibot. Manual trigger only."
          max_concurrent_runs: 1
          tags:
            activity-type: ${var.job_activity_tag}
            job-purpose: platform
            project-name: qualibot
            project: Qualibot
          run_as:
            service_principal_name: 3e5cd4e5-f765-4760-b974-ee7715258b39
          permissions:
            - group_name: "Role-Project-LEAP-CoreAdmin"
              level: CAN_MANAGE
            - group_name: "Role-Project-LEAP-CoreDev"
              level: CAN_MANAGE
          parameters:
            - name: app_service_principal
              default: "c3a9ba06-ed84-4f7b-a815-4db97577aa97"  # qualibot-uat-test app SP
          tasks:
            - task_key: grant_app_access
              notebook_task:
                notebook_path: ../utils/grants/grant_app_access.py
                source: WORKSPACE
                base_parameters:
                  app_service_principal: "{{job.parameters.app_service_principal}}"
                  catalog: ${var.app_proj_catalog}
                  schema_name: ${var.app_proj_schema}
                  proj_catalog: ${var.app_proj_catalog}
                  proj_schema: ${var.app_proj_schema}
                  volumes: "doc_compare_test,test_test,images_test"
                  indexes: "chunks_index${var.parsing_table_suffix}"
                  pipeline_service_principal: ""
                  pipeline_tables: ""
              environment_key: default
          environments:
            - environment_key: default
              spec:
                environment_version: "2"
                dependencies:
                  - databricks-sdk>=0.118.0


        # Admin utility, manual trigger, outside the daily chain.
        # run_as job-runner-sa-uat cannot grant on the Intraqual source catalog, so the grant there needs the deploying user's rights.
        # It grants one specific SP. The `account users` USE CATALOG failure of `bundle deploy` needs a governance decision.
        grant_volume_access:
          name: "Z_1_Qualibot_Grant_Volume_Access_${bundle.target}"
          queue:
            enabled: true
          email_notifications:
            on_failure:
              - ${var.notification_email}
          notification_settings:
            no_alert_for_canceled_runs: true
          description: "Grants USE CATALOG + USE SCHEMA + READ/WRITE VOLUME on a volume to a service principal. Manual trigger only."
          max_concurrent_runs: 1
          tags:
            activity-type: ${var.job_activity_tag}
            job-purpose: platform
            project-name: qualibot
            project: Qualibot
          run_as:
            service_principal_name: 3e5cd4e5-f765-4760-b974-ee7715258b39
          parameters:
            - name: service_principal
              default: "3e5cd4e5-f765-4760-b974-ee7715258b39"
            - name: catalog
              default: "prod_landingzone"
            - name: schema_name
              default: "intraqual"
            - name: volume_name
              default: "intraqual_documents"
            - name: volume_permission
              default: "READ VOLUME"
          tasks:
            - task_key: grant
              notebook_task:
                notebook_path: ../utils/grants/grant_volume_access_job.py
                source: WORKSPACE
                base_parameters:
                  service_principal: "{{job.parameters.service_principal}}"
                  catalog: "{{job.parameters.catalog}}"
                  schema_name: "{{job.parameters.schema_name}}"
                  volume_name: "{{job.parameters.volume_name}}"
                  volume_permission: "{{job.parameters.volume_permission}}"
              environment_key: default
          environments:
            - environment_key: default
              spec:
                environment_version: "2"
