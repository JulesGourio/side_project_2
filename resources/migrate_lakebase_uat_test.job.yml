targets:
  qualibot-uat-test:
    resources:
      jobs:

        migrate_lakebase_uat_test:
          name: "Z_1_Qualibot_Migrate_Lakebase_${bundle.target}"
          description: "Apply idempotent Lakebase schema migrations (utils/lakebase_sync/migrate_lakebase.py) to doccompare_test — never doccompare. Manual trigger only."
          max_concurrent_runs: 1
          tags:
            project: Qualibot
          # doccompare_test tables are owned by the qualibot-uat-test app SP, not job-runner-sa-uat.
          run_as:
            service_principal_name: 3e5cd4e5-f765-4760-b974-ee7715258b39
          permissions:
            - group_name: "Role-Project-LEAP-CoreAdmin"
              level: CAN_MANAGE
            - group_name: "Role-Project-LEAP-CoreDev"
              level: CAN_MANAGE
          tasks:
            # Serverless: classic job compute cannot reach the Lakebase private endpoint.
            - task_key: migrate_lakebase
              notebook_task:
                notebook_path: ../utils/lakebase_sync/migrate_lakebase_job.py
                source: WORKSPACE
                base_parameters:
                  LAKEBASE_PROJECT_ID: "qualibot"
                  LAKEBASE_BRANCH: "production"
                  LAKEBASE_ENDPOINT: "primary"
                  LAKEBASE_DATABASE: "doccompare_test"
              environment_key: default
          environments:
            - environment_key: default
              spec:
                environment_version: "2"
                dependencies:
                  - psycopg2-binary
                  - databricks-sdk>=0.118.0
