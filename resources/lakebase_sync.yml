# Export of the Lakebase tables of the app to the staging volume of the environment, then load of the exported tables as
# Delta tables of <env>_proj.qualibot. One job for dev, uat and prod: the environment comes from pipeline_write_env.
#
# The job is declared once at the root. The targets at the end only override run_as: the DEV service principal is the
# default, and the UAT and PROD targets run as their own service principal. The schedule is lakebase_export_schedule_pause,
# the Delta load is lakebase_import_to_delta (off on DEV, whose schema holds Delta copies of the UAT tables).

resources:
  jobs:
    lakebase_export:
      name: "D_1_Qualibot_Lakebase_Export_To_Volume"
      queue:
        enabled: true
      email_notifications:
        on_failure:
          - ${var.notification_email}
      notification_settings:
        no_alert_for_canceled_runs: true
      description: "Export the Lakebase tables of the app to the <env>_proj.qualibot.staging volume, then load them as Delta tables of <env>_proj.qualibot"
      max_concurrent_runs: 1
      tags:
        activity-type: ${var.job_activity_tag}
        job-purpose: platform
        project-name: qualibot
        project: Qualibot
      # Without it, run_as=SP makes the SP sole owner and humans lose View/Manage Run rights at deploy.
      permissions:
        - group_name: "Role-Project-LEAP-CoreAdmin"
          level: CAN_MANAGE
        - group_name: "Role-Project-LEAP-CoreDev"
          level: CAN_MANAGE
      # DEV service principal by default; the targets at the end of this file override it.
      run_as:
        service_principal_name: fde6ff28-739f-4a41-b61e-604a298c8478
      tasks:
        # Serverless: classic job compute cannot reach the Lakebase private endpoint.
        - task_key: export_lakebase_to_volume
          description: "Extract the Lakebase tables to JSONL files in the staging volume"
          notebook_task:
            notebook_path: ../utils/lakebase_sync/export_lakebase_to_volume_job.py
            source: WORKSPACE
            base_parameters:
              LAKEBASE_PROJECT_ID: "qualibot"
              LAKEBASE_BRANCH: "production"
              LAKEBASE_ENDPOINT: "primary"
              LAKEBASE_DATABASE: "doccompare"
              OUTPUT_VOLUME_CATALOG: ${var.pipeline_write_env}_proj
              OUTPUT_VOLUME_SCHEMA: "qualibot"
              OUTPUT_VOLUME_NAME: "staging"
              TABLES_TO_SKIP: ${var.lakebase_tables_to_skip}
          environment_key: default
        - task_key: import_lakebase_tables_to_delta
          description: "Load every exported table as a Delta table of the same name in <env>_proj.qualibot"
          depends_on:
            - task_key: export_lakebase_to_volume
          notebook_task:
            notebook_path: ../utils/lakebase_sync/import_lakebase_tables_to_delta_job.py
            source: WORKSPACE
            base_parameters:
              CATALOG: ${var.pipeline_write_env}_proj
              SCHEMA: "qualibot"
              VOLUME_NAME: "staging"
              ENABLED: ${var.lakebase_import_to_delta}
          environment_key: default
      environments:
        - environment_key: default
          spec:
            environment_version: "2"
            dependencies:
              - psycopg2-binary
              - databricks-sdk>=0.118.0
      schedule:
        quartz_cron_expression: "0 0 2,14 * * ?"
        timezone_id: "Europe/Brussels"
        pause_status: ${var.lakebase_export_schedule_pause}

targets:
  uat:
    resources:
      jobs:
        lakebase_export:
          run_as:
            service_principal_name: 3e5cd4e5-f765-4760-b974-ee7715258b39  # job-runner-sa-uat

  prod:
    resources:
      jobs:
        lakebase_export:
          run_as:
            service_principal_name: b82d3b5a-b633-4738-8dde-68bb2142cb02  # job-runner-sa-prod
