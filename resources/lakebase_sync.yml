# Lakebase exports to a UC volume (DEV, UAT) and the UAT chatbot-table import. One-off Lakebase schema migrations live in runbooks/scripts/lakebase/.
# Declared per target: each job exists only on the targets listed below.

targets:
  dev:
    resources:
      jobs:
        # ── DEV Lakebase export to the staging volume ───────────────────────
        lakebase_export_dev_to_volume:
          name: "D_1_Qualibot_Lakebase_Export_To_Volume"
          queue:
            enabled: true
          email_notifications:
            on_failure:
              - ${var.notification_email}
          notification_settings:
            no_alert_for_canceled_runs: true
          description: "Export the DEV Lakebase tables to the dev_proj.qualibot.staging volume"
          max_concurrent_runs: 1
          tags:
            activity-type: ${var.job_activity_tag}
            job-purpose: platform
            project-name: qualibot
            project: Qualibot
          permissions:
            - group_name: "Role-Project-LEAP-CoreAdmin"
              level: CAN_MANAGE
            - group_name: "Role-Project-LEAP-CoreDev"
              level: CAN_MANAGE
            - service_principal_name: "fde6ff28-739f-4a41-b61e-604a298c8478"  # DEV job SP: the deploy runs as this SP, which updates jobs created by a person
              level: CAN_MANAGE
          run_as:
            service_principal_name: fde6ff28-739f-4a41-b61e-604a298c8478
          tasks:
            # Serverless: classic job compute cannot reach the Lakebase private endpoint.
            - task_key: export_lakebase_dev_to_volume
              notebook_task:
                notebook_path: ../utils/lakebase_sync/export_lakebase_uat_to_volume_job.py
                source: WORKSPACE
                base_parameters:
                  LAKEBASE_PROJECT_ID: "qualibot"
                  LAKEBASE_BRANCH: "production"
                  LAKEBASE_ENDPOINT: "primary"
                  LAKEBASE_DATABASE: "doccompare"
                  OUTPUT_VOLUME_CATALOG: ${var.pipeline_write_env}_proj
                  OUTPUT_VOLUME_SCHEMA: qualibot
                  OUTPUT_VOLUME_NAME: "staging"
                  TABLES_TO_SKIP: "llm_requests"
              environment_key: default
          environments:
            - environment_key: default
              spec:
                environment_version: "2"
                dependencies:
                  - psycopg2-binary
                  - databricks-sdk>=0.118.0
          schedule:
            quartz_cron_expression: "0 0 2,14 * * ?"
            timezone_id: "Europe/Brussels"
            pause_status: PAUSED

  qualibot-uat:
    resources:
      jobs:
        lakebase_export_uat_to_volume:
          name: "D_1_Qualibot_Lakebase_Export_To_Volume"
          queue:
            enabled: true
          email_notifications:
            on_failure:
              - ${var.notification_email}
          notification_settings:
            no_alert_for_canceled_runs: true
          description: "Export Lakebase UAT tables to a Unity Catalog staging volume"
          max_concurrent_runs: 1
          tags:
            activity-type: ${var.job_activity_tag}
            job-purpose: platform
            project-name: qualibot
            project: Qualibot
          # Without it, run_as=job-runner-sa-uat makes the SP sole owner and humans lose View/Manage Run rights at deploy.
          permissions:
            - group_name: "Role-Project-LEAP-CoreAdmin"
              level: CAN_MANAGE
            - group_name: "Role-Project-LEAP-CoreDev"
              level: CAN_MANAGE
          run_as:
            service_principal_name: 3e5cd4e5-f765-4760-b974-ee7715258b39
          tasks:
            # Serverless: classic job compute cannot reach the Lakebase private endpoint.
            - task_key: export_lakebase_uat_to_volume
              description: "Extract Lakebase tables to JSONL files in the UAT staging volume"
              notebook_task:
                notebook_path: ../utils/lakebase_sync/export_lakebase_uat_to_volume_job.py
                source: WORKSPACE
                base_parameters:
                  LAKEBASE_PROJECT_ID: "qualibot"
                  LAKEBASE_BRANCH: "production"
                  LAKEBASE_ENDPOINT: "primary"
                  LAKEBASE_DATABASE: "doccompare"
                  OUTPUT_VOLUME_CATALOG: "uat_proj"
                  OUTPUT_VOLUME_SCHEMA: "qualibot"
                  OUTPUT_VOLUME_NAME: "staging"
                  TABLES_TO_SKIP: ""
              environment_key: default
            - task_key: import_chatbot_tables_to_uat
              description: "Load every Lakebase JSON export (chat, compare, impact search, users, caches, errors, request logs) as Delta tables in uat_proj.qualibot"
              depends_on:
                - task_key: export_lakebase_uat_to_volume
              notebook_task:
                notebook_path: ../utils/lakebase_sync/import_chatbot_tables_to_uat_job.py
                source: WORKSPACE
              environment_key: default
          environments:
            - environment_key: default
              spec:
                environment_version: "2"
                dependencies:
                  - psycopg2-binary
                  - databricks-sdk>=0.118.0
          schedule:
            quartz_cron_expression: "0 0 2,14 * * ?"
            timezone_id: "Europe/Brussels"
            pause_status: UNPAUSED
