# Nightly and weekend stop/start of the Qualibot app.
# Declared per target: each job exists only on the targets listed below.

targets:
  dev:
    resources:
      jobs:

        # ── App off-hours (DEV) ───────────────────────────────────────────────
        # The nightly stop runs every night (weekend included), the app is started by hand when needed. The weekend pair is redundant
        # with it and stays PAUSED (a Monday auto-start is not wanted on the test copy).
        apps_stop_nightly_dev:
          name: "D_1_Qualibot_Apps_Stop_Nightly_Dev"
          queue:
            enabled: true
          email_notifications:
            on_failure:
              - ${var.notification_email}
          notification_settings:
            no_alert_for_canceled_runs: true
          description: "Stop the DEV qualibot app every night at 21h."
          max_concurrent_runs: 1
          tags:
            activity-type: ${var.job_activity_tag}
            job-purpose: platform
            project-name: qualibot
            project: Qualibot
          permissions:
            - group_name: "Role-Project-LEAP-CoreAdmin"
              level: CAN_MANAGE
            - group_name: "Role-Project-LEAP-CoreDev"
              level: CAN_MANAGE
            - service_principal_name: "fde6ff28-739f-4a41-b61e-604a298c8478"  # DEV job SP: the deploy runs as this SP, which updates jobs created by a person
              level: CAN_MANAGE
          run_as:
            service_principal_name: fde6ff28-739f-4a41-b61e-604a298c8478  # job-runner-sa-dev
          tasks:
            - task_key: stop_apps
              notebook_task:
                notebook_path: ../utils/app_mgmt/stop_start_app_job.py
                source: WORKSPACE
                base_parameters:
                  action: "stop"
                  app_names: ${var.app_name}
              environment_key: default
          environments:
            - environment_key: default
              spec:
                environment_version: "2"
                dependencies:
                  - databricks-sdk>=0.118.0
          schedule:
            quartz_cron_expression: "0 0 21 * * ?"
            timezone_id: "Europe/Brussels"
            pause_status: UNPAUSED

        qualibot_stop_weekend_dev:
          name: "W_1_Qualibot_Stop_Weekend_Dev"
          queue:
            enabled: true
          email_notifications:
            on_failure:
              - ${var.notification_email}
          notification_settings:
            no_alert_for_canceled_runs: true
          description: "Stop the DEV qualibot app for the weekend."
          max_concurrent_runs: 1
          tags:
            activity-type: ${var.job_activity_tag}
            job-purpose: platform
            project-name: qualibot
            project: Qualibot
          permissions:
            - group_name: "Role-Project-LEAP-CoreAdmin"
              level: CAN_MANAGE
            - group_name: "Role-Project-LEAP-CoreDev"
              level: CAN_MANAGE
            - service_principal_name: "fde6ff28-739f-4a41-b61e-604a298c8478"  # DEV job SP: the deploy runs as this SP, which updates jobs created by a person
              level: CAN_MANAGE
          run_as:
            service_principal_name: fde6ff28-739f-4a41-b61e-604a298c8478  # job-runner-sa-dev
          tasks:
            - task_key: stop_app
              notebook_task:
                notebook_path: ../utils/app_mgmt/stop_start_app_job.py
                source: WORKSPACE
                base_parameters:
                  action: "stop"
                  app_names: ${var.app_name}
              environment_key: default
          environments:
            - environment_key: default
              spec:
                environment_version: "2"
                dependencies:
                  - databricks-sdk>=0.118.0
          schedule:
            quartz_cron_expression: "0 0 21 ? * FRI"
            timezone_id: "Europe/Brussels"
            pause_status: PAUSED

        qualibot_start_weekend_dev:
          name: "W_1_Qualibot_Start_Weekend_Dev"
          queue:
            enabled: true
          email_notifications:
            on_failure:
              - ${var.notification_email}
          notification_settings:
            no_alert_for_canceled_runs: true
          description: "Restart the DEV qualibot app on Monday morning."
          max_concurrent_runs: 1
          tags:
            activity-type: ${var.job_activity_tag}
            job-purpose: platform
            project-name: qualibot
            project: Qualibot
          permissions:
            - group_name: "Role-Project-LEAP-CoreAdmin"
              level: CAN_MANAGE
            - group_name: "Role-Project-LEAP-CoreDev"
              level: CAN_MANAGE
            - service_principal_name: "fde6ff28-739f-4a41-b61e-604a298c8478"  # DEV job SP: the deploy runs as this SP, which updates jobs created by a person
              level: CAN_MANAGE
          run_as:
            service_principal_name: fde6ff28-739f-4a41-b61e-604a298c8478  # job-runner-sa-dev
          tasks:
            - task_key: start_app
              notebook_task:
                notebook_path: ../utils/app_mgmt/stop_start_app_job.py
                source: WORKSPACE
                base_parameters:
                  action: "start"
                  app_names: ${var.app_name}
              environment_key: default
          environments:
            - environment_key: default
              spec:
                environment_version: "2"
                dependencies:
                  - databricks-sdk>=0.118.0
          schedule:
            quartz_cron_expression: "0 0 7 ? * MON"
            timezone_id: "Europe/Brussels"
            pause_status: PAUSED
  uat:
    resources:
      jobs:

        # ── App off-hours (UAT) ─────────────────────────────────────────────
        # Generic notebook utils/app_mgmt/stop_start_app_job.py; run_as job-runner-sa-uat holds CAN_MANAGE on the app (declared in databricks.yml).
        # Only qualibot has a start job (weekend pair below).
        qualibot_stop_weekend_uat:
          name: "W_1_Qualibot_Stop_Weekend_Uat"
          queue:
            enabled: true
          email_notifications:
            on_failure:
              - ${var.notification_email}
          notification_settings:
            no_alert_for_canceled_runs: true
          description: "Stop qualibot for the weekend (no nightly schedule for this app)."
          max_concurrent_runs: 1
          tags:
            activity-type: ${var.job_activity_tag}
            job-purpose: platform
            project-name: qualibot
            project: Qualibot
          permissions:
            - group_name: "Role-Project-LEAP-CoreAdmin"
              level: CAN_MANAGE
            - group_name: "Role-Project-LEAP-CoreDev"
              level: CAN_MANAGE
          run_as:
            service_principal_name: 3e5cd4e5-f765-4760-b974-ee7715258b39
          tasks:
            - task_key: stop_app
              notebook_task:
                notebook_path: ../utils/app_mgmt/stop_start_app_job.py
                source: WORKSPACE
                base_parameters:
                  action: "stop"
                  app_names: "qualibot"
              environment_key: default
          environments:
            - environment_key: default
              spec:
                environment_version: "2"
                dependencies:
                  - databricks-sdk>=0.118.0
          schedule:
            quartz_cron_expression: "0 0 21 ? * FRI"
            timezone_id: "Europe/Brussels"
            pause_status: UNPAUSED

        qualibot_start_weekend_uat:
          name: "W_1_Qualibot_Start_Weekend_Uat"
          queue:
            enabled: true
          email_notifications:
            on_failure:
              - ${var.notification_email}
          notification_settings:
            no_alert_for_canceled_runs: true
          description: "Restart qualibot on Monday morning."
          max_concurrent_runs: 1
          tags:
            activity-type: ${var.job_activity_tag}
            job-purpose: platform
            project-name: qualibot
            project: Qualibot
          permissions:
            - group_name: "Role-Project-LEAP-CoreAdmin"
              level: CAN_MANAGE
            - group_name: "Role-Project-LEAP-CoreDev"
              level: CAN_MANAGE
          run_as:
            service_principal_name: 3e5cd4e5-f765-4760-b974-ee7715258b39
          tasks:
            - task_key: start_app
              notebook_task:
                notebook_path: ../utils/app_mgmt/stop_start_app_job.py
                source: WORKSPACE
                base_parameters:
                  action: "start"
                  app_names: "qualibot"
              environment_key: default
          environments:
            - environment_key: default
              spec:
                environment_version: "2"
                dependencies:
                  - databricks-sdk>=0.118.0
          schedule:
            quartz_cron_expression: "0 0 7 ? * MON"
            timezone_id: "Europe/Brussels"
            pause_status: UNPAUSED
