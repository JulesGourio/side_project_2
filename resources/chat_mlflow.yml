# Creates the MLflow experiment of the live chat traces (server/services/chat/mlflow_turns.py), owned by the job service principal
# instead of the person who runs the script. Manual trigger; idempotent (an existing experiment is left as is, permissions re-applied).

targets:
  dev:
    resources:
      jobs:
        create_chat_experiment_dev:
          name: "Z_2_Qualibot_Create_Chat_Experiment"
          queue:
            enabled: true
          email_notifications:
            on_failure:
              - ${var.notification_email}
          notification_settings:
            no_alert_for_canceled_runs: true
          description: "Create the chat experiment (variable chat_mlflow_experiment) owned by the DEV job SP; the DEV app SP can edit it. Manual trigger only."
          max_concurrent_runs: 1
          tags:
            activity-type: ${var.job_activity_tag}
            job-purpose: platform
            project-name: qualibot
            project: Qualibot
          run_as:
            service_principal_name: fde6ff28-739f-4a41-b61e-604a298c8478
          permissions:
            - group_name: "Role-Project-LEAP-CoreAdmin"
              level: CAN_MANAGE
            - group_name: "Role-Project-LEAP-CoreDev"
              level: CAN_MANAGE
            - service_principal_name: "fde6ff28-739f-4a41-b61e-604a298c8478"
              level: CAN_MANAGE
          tasks:
            - task_key: create_chat_experiment
              spark_python_task:
                python_file: ../utils/evaluation/create_chat_experiment.py
                source: WORKSPACE
                parameters:
                  - "--app"
                  - "qualibot"
                  - "--experiment"
                  - ${var.chat_mlflow_experiment}
                  - "--uc-schema"
                  - ${var.pipeline_write_env}_proj.qualibot
                  - "--warehouse-id"
                  - ${var.alerts_warehouse_id}
                  - "--managers"
                  - "Role-Project-LEAP-CoreAdmin,Role-Project-LEAP-CoreDev"
              environment_key: default
          environments:
            - environment_key: default
              spec:
                environment_version: "2"
                dependencies:
                  - mlflow[databricks]>=3.11.1
                  - databricks-sdk>=0.118.0

        register_chat_prompts_dev:
          name: "Z_3_Qualibot_Register_Chat_Prompts"
          queue:
            enabled: true
          email_notifications:
            on_failure:
              - ${var.notification_email}
          notification_settings:
            no_alert_for_canceled_runs: true
          description: "Register the chat prompt files in dev_proj.qualibot (MLflow prompt registry, alias deployed). Run after every deploy that touches server/prompts/chat/. Manual trigger only."
          max_concurrent_runs: 1
          tags:
            activity-type: ${var.job_activity_tag}
            job-purpose: platform
            project-name: qualibot
            project: Qualibot
          run_as:
            service_principal_name: fde6ff28-739f-4a41-b61e-604a298c8478
          permissions:
            - group_name: "Role-Project-LEAP-CoreAdmin"
              level: CAN_MANAGE
            - group_name: "Role-Project-LEAP-CoreDev"
              level: CAN_MANAGE
            - service_principal_name: "fde6ff28-739f-4a41-b61e-604a298c8478"
              level: CAN_MANAGE
          tasks:
            - task_key: register_chat_prompts
              spark_python_task:
                python_file: ../utils/evaluation/register_chat_prompts.py
                source: WORKSPACE
                parameters:
                  - "--schema"
                  - "${var.pipeline_write_env}_proj.qualibot"
                  - "--experiment"
                  - ${var.chat_mlflow_experiment}
                  - "--app-root"
                  - "${workspace.root_path}/files"
              environment_key: default
          environments:
            - environment_key: default
              spec:
                environment_version: "2"
                dependencies:
                  - mlflow[databricks]>=3.11.1

        score_chat_traces_dev:
          name: "D_2_Qualibot_Score_Chat_Traces"
          queue:
            enabled: true
          email_notifications:
            on_failure:
              - ${var.notification_email}
          notification_settings:
            no_alert_for_canceled_runs: true
          description: "Score the live chat traces (free scorers on every turn, LLM judges on a sample, throttled). dry_run=true only prints the plan and the token estimate: set it to false to judge."
          max_concurrent_runs: 1
          tags:
            activity-type: ${var.job_activity_tag}
            job-purpose: platform
            project-name: qualibot
            project: Qualibot
          run_as:
            service_principal_name: fde6ff28-739f-4a41-b61e-604a298c8478
          permissions:
            - group_name: "Role-Project-LEAP-CoreAdmin"
              level: CAN_MANAGE
            - group_name: "Role-Project-LEAP-CoreDev"
              level: CAN_MANAGE
            - service_principal_name: "fde6ff28-739f-4a41-b61e-604a298c8478"
              level: CAN_MANAGE
          parameters:
            - name: dry_run
              default: "true"
          tasks:
            - task_key: score_chat_traces
              notebook_task:
                notebook_path: ../utils/evaluation/score_chat_traces.py
                source: WORKSPACE
                base_parameters:
                  dry_run: "{{job.parameters.dry_run}}"
                  min_date: "2026-10-12"
                  app_code_path: "${workspace.root_path}/files"
                  experiment: ${var.chat_mlflow_experiment}
                  warehouse_id: ${var.alerts_warehouse_id}
                  results_table: "${var.pipeline_write_env}_proj.qualibot.chat_trace_scores"
              environment_key: default
          environments:
            - environment_key: default
              spec:
                environment_version: "2"
                dependencies:
                  - mlflow[databricks]>=3.11.1
          schedule:
            quartz_cron_expression: "0 30 2 * * ?"
            timezone_id: "Europe/Brussels"
            pause_status: PAUSED

