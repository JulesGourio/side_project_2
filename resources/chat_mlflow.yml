# Creates the MLflow experiment of the live chat traces (server/services/chat/mlflow_turns.py), owned by the job service principal
# instead of the person who runs the script. Manual trigger; idempotent (an existing experiment is left as is, permissions re-applied).
# Steps: runbooks/dev.md block 0 (0.8 to 0.14).

targets:
  dev:
    resources:
      jobs:
        create_chat_experiment_dev:
          name: "Z_2_Qualibot_Create_Chat_Experiment_${bundle.target}"
          description: "Create /Shared/qualibot/chat_turns owned by the DEV job SP; the DEV app SP can edit it. Manual trigger only."
          max_concurrent_runs: 1
          tags:
            project: Qualibot
          run_as:
            service_principal_name: fde6ff28-739f-4a41-b61e-604a298c8478
          permissions:
            - group_name: "Role-Project-LEAP-CoreAdmin"
              level: CAN_MANAGE
            - group_name: "Role-Project-LEAP-CoreDev"
              level: CAN_MANAGE
            - service_principal_name: "fde6ff28-739f-4a41-b61e-604a298c8478"
              level: CAN_MANAGE
            - user_name: "mehdi.lamrani@databricks.com"
              level: CAN_MANAGE
          tasks:
            - task_key: create_chat_experiment
              spark_python_task:
                python_file: ../utils/evaluation/create_chat_experiment.py
                source: WORKSPACE
                parameters:
                  - "--app"
                  - "qualibot"
                  - "--experiment"
                  - "/Shared/qualibot/chat_turns"
                  - "--managers"
                  - "Role-Project-LEAP-CoreAdmin,Role-Project-LEAP-CoreDev"
              environment_key: default
          environments:
            - environment_key: default
              spec:
                environment_version: "2"
                dependencies:
                  - mlflow[databricks]>=3.1
                  - databricks-sdk>=0.118.0

        register_chat_prompts_dev:
          name: "Z_3_Qualibot_Register_Chat_Prompts_${bundle.target}"
          description: "Register the chat prompt files in dev_proj.qualibot (MLflow prompt registry, alias deployed). Run after every deploy that touches server/prompts/chat/. Manual trigger only."
          max_concurrent_runs: 1
          tags:
            project: Qualibot
          run_as:
            service_principal_name: fde6ff28-739f-4a41-b61e-604a298c8478
          permissions:
            - group_name: "Role-Project-LEAP-CoreAdmin"
              level: CAN_MANAGE
            - group_name: "Role-Project-LEAP-CoreDev"
              level: CAN_MANAGE
            - service_principal_name: "fde6ff28-739f-4a41-b61e-604a298c8478"
              level: CAN_MANAGE
            - user_name: "mehdi.lamrani@databricks.com"
              level: CAN_MANAGE
          tasks:
            - task_key: register_chat_prompts
              spark_python_task:
                python_file: ../utils/evaluation/register_chat_prompts.py
                source: WORKSPACE
                parameters:
                  - "--schema"
                  - "${var.app_proj_catalog}.${var.app_proj_schema}"
                  - "--experiment"
                  - "/Shared/qualibot/chat_turns"
                  - "--app-root"
                  - "/Workspace/Shared/.bundle/${bundle.name}/${bundle.target}/files"
              environment_key: default
          environments:
            - environment_key: default
              spec:
                environment_version: "2"
                dependencies:
                  - mlflow[databricks]>=3.4

        score_chat_traces_dev:
          name: "D_2_Qualibot_Score_Chat_Traces_${bundle.target}"
          description: "Score the live chat traces (free scorers on every turn, LLM judges on a sample, throttled). dry_run=true only prints the plan and the token estimate: set it to false to judge."
          max_concurrent_runs: 1
          tags:
            project: Qualibot
          run_as:
            service_principal_name: fde6ff28-739f-4a41-b61e-604a298c8478
          permissions:
            - group_name: "Role-Project-LEAP-CoreAdmin"
              level: CAN_MANAGE
            - group_name: "Role-Project-LEAP-CoreDev"
              level: CAN_MANAGE
            - service_principal_name: "fde6ff28-739f-4a41-b61e-604a298c8478"
              level: CAN_MANAGE
            - user_name: "mehdi.lamrani@databricks.com"
              level: CAN_MANAGE
          parameters:
            - name: dry_run
              default: "true"
          tasks:
            - task_key: score_chat_traces
              notebook_task:
                notebook_path: ../utils/evaluation/score_chat_traces.py
                source: WORKSPACE
                base_parameters:
                  dry_run: "{{job.parameters.dry_run}}"
                  app_code_path: "/Workspace/Shared/.bundle/${bundle.name}/${bundle.target}/files"
                  experiment: "/Shared/qualibot/chat_turns"
                  results_table: "${var.app_proj_catalog}.${var.app_proj_schema}.chat_trace_scores"
              environment_key: default
          environments:
            - environment_key: default
              spec:
                environment_version: "2"
                dependencies:
                  - mlflow[databricks]>=3.4
          schedule:
            quartz_cron_expression: "0 30 2 * * ?"
            timezone_id: "Europe/Paris"
            pause_status: PAUSED

