targets:
  dev:
    resources:
      jobs:

        # Manual trigger. Grants the DEV app SP what it uses (catalog and schema usage, volumes, indexes, serving endpoints),
        # and the DEV SP itself SELECT + MODIFY on `pipeline_tables`. Edit the lists in base_parameters, deploy, run;
        # re-run after recreating an index, a table or the app.
        grant_app_access_dev:
          name: "Z_1_Qualibot_Grant_App_Access_${bundle.target}"
          description: "Grant the DEV qualibot app SP its volumes, indexes and LLM endpoints, and the DEV job SP the pipeline tables. Manual trigger only."
          max_concurrent_runs: 1
          tags:
            project: Qualibot
          run_as:
            service_principal_name: fde6ff28-739f-4a41-b61e-604a298c8478
          permissions:
            - group_name: "Role-Project-LEAP-CoreAdmin"
              level: CAN_MANAGE
            - group_name: "Role-Project-LEAP-CoreDev"
              level: CAN_MANAGE
            - service_principal_name: "fde6ff28-739f-4a41-b61e-604a298c8478"  # DEV job SP — lets the Bitbucket deploy (run as this SP) update jobs a human created
              level: CAN_MANAGE
            - user_name: "mehdi.lamrani@databricks.com"  # developer on the DEV copy
              level: CAN_MANAGE
          parameters:
            - name: app_service_principal
              default: "8e411164-a7e8-46ff-8013-8c56af2c3656"
          tasks:
            - task_key: grant_app_access
              notebook_task:
                notebook_path: ../utils/grants/grant_app_access.py
                source: WORKSPACE
                base_parameters:
                  app_service_principal: "{{job.parameters.app_service_principal}}"
                  catalog: ${var.app_write_catalog}
                  schema_name: ${var.app_write_schema}
                  volumes: "doc_compare,test"
                  indexes: "chunks_index"
                  serving_endpoints: "databricks-claude-sonnet-4-6,databricks-gpt-5-6-luna,databricks-gpt-6-luna"
                  # The DEV SP itself (this job's run_as), on the tables a person created.
                  pipeline_service_principal: fde6ff28-739f-4a41-b61e-604a298c8478
                  pipeline_tables: "_pipeline_checkpoint,processed_files,image_metadata,parse_manifest,category_reference,chunks"
              environment_key: default
          environments:
            - environment_key: default
              spec:
                environment_version: "2"
                dependencies:
                  - databricks-sdk>=0.118.0
