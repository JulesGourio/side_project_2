# One-off copy of UAT data into DEV.
# Declared per target: each job exists only on the targets listed below.

targets:
  dev:
    resources:
      jobs:

        # ── UAT copy ─────────────────────────────────────────────────────────
        # Manual trigger. Loads the snapshot written by export_uat_to_staging.py, then creates and syncs the Vector Search index:
        # the corpus is queryable without a parsing run, and parsing_pipeline resumes incrementally from the copied checkpoint.
        copy_uat_to_dev:
          name: "Z_1_Qualibot_Copy_Uat_To_Dev"
          description: "Load the UAT corpus snapshot (chunks + parsing state) into dev_landingzone.qualibot and build the Vector Search indexes. Manual trigger only."
          max_concurrent_runs: 1
          tags:
            project: Qualibot
          # Runs as the deploying user: the DEV SP has no READ VOLUME on uat_landingzone.qualibot.staging.
          # Explicit, because dropping run_as leaves the previous SP in place on redeploy.
          run_as:
            user_name: jules.gourio.external@latecoere.aero
          permissions:
            - group_name: "Role-Project-LEAP-CoreAdmin"
              level: CAN_MANAGE
            - group_name: "Role-Project-LEAP-CoreDev"
              level: CAN_MANAGE
            - service_principal_name: "fde6ff28-739f-4a41-b61e-604a298c8478"  # DEV job SP — lets the Bitbucket deploy (run as this SP) update jobs a human created
              level: CAN_MANAGE
            - user_name: "mehdi.lamrani@databricks.com"  # developer on the DEV copy
              level: CAN_MANAGE
          parameters:
            - name: overwrite
              default: "false"
          tasks:
            - task_key: "1_import_tables"
              description: "Staging volume snapshot -> dev_landingzone.qualibot.* (+ LibreOffice archive)"
              notebook_task:
                notebook_path: ../utils/dev_copy/import_staging_to_dev_job.py
                source: WORKSPACE
                base_parameters:
                  SOURCE_DIR: "/Volumes/uat_landingzone/qualibot/staging/dev_copy"
                  TARGET_CATALOG_SCHEMA: ${var.app_write_catalog}.${var.app_write_schema}
                  TABLE_SUFFIX: ${var.parsing_table_suffix}
                  OVERWRITE: "{{job.parameters.overwrite}}"
                  SOFFICE_TARGET_DIR: /Volumes/${var.app_write_catalog}/${var.app_write_schema}/doc_compare/libreoffice
              # Serverless: starts in seconds.
              environment_key: default
            - task_key: "2_vector_search_endpoint"
              description: "Create the Vector Search endpoint if missing, wait until ONLINE"
              depends_on:
                - task_key: "1_import_tables"
              notebook_task:
                notebook_path: ../utils/dev_copy/ensure_vector_search_endpoint.py
                source: WORKSPACE
                base_parameters:
                  vector_search_endpoint: "qualibot"
                  wait_minutes: "30"
              environment_key: default
            # Reuses the parsing pipeline's index task: creates the index if missing, then syncs it.
            - task_key: "3_sync_indexes"
              description: "Create + sync the chunks Vector Search index"
              depends_on:
                - task_key: "2_vector_search_endpoint"
              notebook_task:
                notebook_path: ../utils/parsing_pipeline/5_Sync_Vector_Indexes.py
                source: WORKSPACE
                base_parameters:
                  indexes: ${var.parsing_vector_search_indexes}
                  wait_minutes: "120"
                  vector_search_endpoint: "qualibot"
                  embedding_model: "databricks-qwen3-embedding-0-6b"
                  catalog_schema: ${var.app_write_catalog}.${var.app_write_schema}
                  table_suffix: ${var.parsing_table_suffix}
                  build_chunks_full: "false"
              environment_key: default
          environments:
            - environment_key: default
              spec:
                environment_version: "2"
                dependencies:
                  - databricks-sdk>=0.118.0
